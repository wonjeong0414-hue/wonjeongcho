<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — WON JEONG CHO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=Cormorant+Garamond:wght@300;400&display=swap" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=Cormorant+Garamond:wght@300;400&display=swap"></noscript>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1a1a18;--ink-mid:#6b6b68;--ink-dim:#aaa9a2;--bg:#f7f6f3;--white:#fff;--left-w:160px}
html,body{height:100%;background:var(--bg);font-family:'Cormorant Garamond',serif;color:var(--ink);overflow:hidden}

/* ── 전체: 좌(태그) + 우(이미지/그리드) ── */
.shell{position:fixed;inset:0;display:flex;}

/* ── 왼쪽 태그 패널 ── */
.left-panel{
  width:var(--left-w);flex-shrink:0;
  display:flex;flex-direction:column;
  padding:20px 0 20px 24px;
}
.tag-item{
  font-size:10px;letter-spacing:0.13em;text-transform:uppercase;
  color:var(--ink-mid);font-weight:500;
  padding:8px 16px 8px 0;
  cursor:pointer;
  line-height:1.4;
  position:relative;
  transition:color 0.2s, padding-left 0.2s;
}
.tag-item:hover,.tag-item.active{color:var(--ink);padding-left:6px}
.tag-item.active::after{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:2px;height:10px;background:var(--ink-dim);border-radius:1px;
}

/* ── 오른쪽 콘텐츠 ── */
.right-panel{flex:1;min-width:0;position:relative;overflow:hidden;}

/* ── float zone ── */
.float-zone{position:absolute;inset:0;transition:opacity 0.45s ease;}
.float-zone.hidden{opacity:0;pointer-events:none}

@keyframes floatA{0%,100%{transform:translateY(0)}35%{transform:translateY(-9px)}70%{transform:translateY(4px)}}
@keyframes floatB{0%,100%{transform:translateY(0)}30%{transform:translateY(7px)}65%{transform:translateY(-10px)}}
@keyframes floatC{0%,100%{transform:translateY(0)}40%{transform:translateY(-7px)}75%{transform:translateY(6px)}}

.sub-card{position:absolute;overflow:hidden;cursor:pointer;transition:box-shadow 0.3s ease;background:rgba(0,0,0,0.05);}
.sub-card.s1{width:36%;height:44%;top:7%;left:5%;animation:floatA 8s ease-in-out infinite}
.sub-card.s2{width:43%;height:55%;top:4%;left:48%;animation:floatB 10s ease-in-out infinite}
.sub-card.s3{width:55%;height:42%;top:52%;left:15%;animation:floatC 9s ease-in-out 0.6s infinite}
.sub-card:hover{box-shadow:0 14px 40px rgba(0,0,0,0.12);z-index:10}
.sub-img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity 0.8s ease,transform 0.5s ease}
.sub-img.loaded{opacity:1}
.sub-card:hover .sub-img{transform:scale(1.04)}

/* ── 이미지들 사이 빈 공간의 텍스트 ── */
/* s1(좌상)과 s3(하중) 사이 오른쪽 하단 빈 공간에 배치 */
.float-text{
  position:absolute;
  left:5%;
  top:5%;
  text-align:left;
  pointer-events:none;
  z-index:1;
}
.float-text-title{
  font-family:'EB Garamond',serif;font-style:italic;
  font-size:clamp(18px,2vw,26px);
  color:var(--ink);letter-spacing:0.05em;
  margin-bottom:10px;line-height:1.1;
}
.float-text-desc{
  font-size:clamp(9px,0.8vw,11px);
  color:var(--ink-dim);
  letter-spacing:0.04em;
  line-height:2;
  word-break:keep-all;
}

/* ── narrative zone ── */
.narrative-zone{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:48px 52px;opacity:0;transform:translateY(16px);transition:opacity 0.7s cubic-bezier(0.16,1,0.3,1),transform 0.8s cubic-bezier(0.16,1,0.3,1);pointer-events:none;}
.narrative-zone.show{opacity:1;transform:translateY(0);pointer-events:all}
.narrative-zone.rising{opacity:0;transform:translateY(-16px);transition:opacity 0.4s ease,transform 0.5s cubic-bezier(0.4,0,0.2,1)}
.ns-label{font-family:'EB Garamond',serif;font-style:italic;font-size:9.5px;letter-spacing:0.3em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:20px}
.ns-text{font-family:'EB Garamond',serif;font-size:clamp(15px,1.7vw,20px);line-height:2;color:var(--ink);max-width:480px;word-break:keep-all}
.ns-rule{width:0;height:0.5px;background:rgba(0,0,0,0.12);margin-top:24px;transition:width 1.2s cubic-bezier(0.16,1,0.3,1) 0.4s}
.narrative-zone.show .ns-rule{width:28px}

/* ── grid zone ── */
.grid-zone{position:absolute;inset:0;overflow-y:auto;padding:16px 16px 48px;scrollbar-width:thin;scrollbar-color:rgba(0,0,0,0.1) transparent;opacity:0;pointer-events:none;transition:opacity 0.45s ease;}
.grid-zone.open{opacity:1;pointer-events:all}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;}
.card{position:relative;overflow:hidden;cursor:pointer;background:rgba(0,0,0,0.04);aspect-ratio:3/4;opacity:0;transform:translateY(6px);transition:opacity 0.35s ease,transform 0.4s cubic-bezier(0.16,1,0.3,1);}
.card.revealed{opacity:1;transform:translateY(0)}
.card img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;filter:blur(3px);transition:opacity 0.5s ease,filter 0.6s ease,transform 0.35s ease;position:absolute;inset:0;}
.card img.loaded{opacity:1;filter:blur(0)}
.card:hover img{transform:scale(1.05)}
.card-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(26,26,24,0.6) 0%,transparent 50%);opacity:0;transition:opacity 0.22s ease;display:flex;flex-direction:column;justify-content:flex-end;padding:7px 8px;}
.card:hover .card-overlay{opacity:1}
.card-title{font-family:'EB Garamond',serif;font-style:italic;font-size:9.5px;color:#fff;line-height:1.3;margin-bottom:1px}
.card-meta{font-size:6px;letter-spacing:0.08em;color:rgba(255,255,255,0.5);text-transform:uppercase}
.card-skeleton{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,0.04) 25%,rgba(0,0,0,0.07) 50%,rgba(0,0,0,0.04) 75%);background-size:200% 100%;animation:shimmer 1.4s ease infinite;}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.load-sentinel{grid-column:1/-1;height:1px}

/* ── modal ── */
.modal-bg{position:fixed;inset:0;background:rgba(26,26,24,0.78);z-index:500;opacity:0;pointer-events:none;transition:opacity 0.3s ease;display:flex;align-items:center;justify-content:center;padding:24px}
.modal-bg.open{opacity:1;pointer-events:all}
.modal{background:var(--white);max-width:900px;width:100%;max-height:88vh;display:flex;overflow:hidden;transform:translateY(16px) scale(0.976);transition:transform 0.34s cubic-bezier(0.16,1,0.3,1);position:relative}
.modal-bg.open .modal{transform:translateY(0) scale(1)}
.modal-img-area{flex:1;min-width:0;background:#f7f6f3;display:flex;align-items:center;justify-content:center;padding:28px}
.modal-img-area img{width:100%;height:100%;object-fit:contain;max-height:calc(88vh - 56px)}
.modal-panel{width:240px;flex-shrink:0;padding:36px 22px 24px;display:flex;flex-direction:column;overflow-y:auto;border-left:0.5px solid rgba(0,0,0,0.07)}
.modal-x{position:absolute;top:14px;right:16px;font-size:20px;color:var(--ink-dim);cursor:pointer;background:none;border:none;font-family:serif;transition:color 0.15s}
.modal-x:hover{color:var(--ink)}
.m-title{font-family:'EB Garamond',serif;font-style:italic;font-size:18px;color:var(--ink);line-height:1.3;margin-bottom:8px}
.m-meta{font-size:8px;letter-spacing:0.14em;color:var(--ink-dim);text-transform:uppercase;margin-bottom:2px}
.m-rule{width:18px;height:0.5px;background:rgba(0,0,0,0.12);margin:14px 0}
.m-desc{font-size:10.5px;line-height:1.9;color:var(--ink-mid);word-break:keep-all;flex:1}
.m-tags{margin-top:18px;display:flex;flex-wrap:wrap;gap:4px}
.m-tag{font-size:7px;letter-spacing:0.05em;padding:3px 7px;border-radius:20px;color:var(--ink-dim);background:rgba(0,0,0,0.04)}
.modal-arr{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.12);backdrop-filter:blur(6px);border:none;color:#fff;font-size:22px;width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.2s;font-family:serif}
.modal-arr:hover{background:rgba(255,255,255,0.24)}
.arr-prev{left:10px}
.arr-next{right:calc(240px + 10px)}
</style>
</head>
<body>
<div class="shell">
  <div class="left-panel">
    <div class="tag-item" id="tag-THE" onclick="onTagClick('THE')">Themes &amp; Philosophy</div>
    <div class="tag-item" id="tag-SER" onclick="onTagClick('SER')">Series &amp; Narratives</div>
    <div class="tag-item" id="tag-MAT" onclick="onTagClick('MAT')">Materiality &amp; Process</div>
    <div class="tag-item" id="tag-SEN" onclick="onTagClick('SEN')">Senses &amp; Emotions</div>
  </div>
  <div class="right-panel">
    <div class="float-zone" id="floatZone">
      <div class="sub-card s1"><img class="sub-img" id="subImg1" alt=""></div>
      <div class="sub-card s2"><img class="sub-img" id="subImg2" alt=""></div>
      <div class="sub-card s3"><img class="sub-img" id="subImg3" alt=""></div>
      <!-- 이미지들 사이 빈 공간: 오른쪽 하단 -->
      <div class="float-text">
        <div class="float-text-title">Tactile Thinking</div>
        <div class="float-text-desc">우연의 캔버스 위에 스며든 필연의 숨결,<br>비결정적 순간이 빚어낸 견고한 정원</div>
      </div>
    </div>
    <div class="narrative-zone" id="narrativeZone">
      <div class="ns-label" id="nsLabel"></div>
      <div class="ns-text" id="nsText"></div>
      <div class="ns-rule"></div>
    </div>
    <div class="grid-zone" id="gridZone">
      <div class="grid" id="grid"></div>
    </div>
  </div>
</div>

<div class="modal-bg" id="modalBg" onclick="bgClose(event)">
  <div class="modal">
    <button class="modal-arr arr-prev" id="arrPrev" onclick="navModal(-1)">‹</button>
    <div class="modal-img-area"><img id="mImg" src="" alt=""></div>
    <div class="modal-panel">
      <button class="modal-x" onclick="closeModal()">×</button>
      <div class="m-title" id="mTitle"></div>
      <div class="m-meta" id="mYear"></div>
      <div class="m-meta" id="mMedium"></div>
      <div class="m-rule"></div>
      <div class="m-desc" id="mDesc"></div>
      <div class="m-tags" id="mTags"></div>
    </div>
    <button class="modal-arr arr-next" id="arrNext" onclick="navModal(1)">›</button>
  </div>
</div>

<script>
var TAG_DESC={'비결정적 순간':'정의되지 않은 우연과 필연의 경계, 그 찰나에 포착된 존재의 흔적.','촉각적 사고':'눈이 아닌 손끝으로 먼저 반응하는 사유. 물성과 감각이 만나는 지점.','윤슬의 사유':'찰나의 빛과 물결을 통한 명상적 시선. 반짝임 속에서 발견하는 고요.','숨의 궤적':'생명체 고유의 호흡과 생명력의 흐름.','잔상':'망막과 기억에 지워지지 않고 남은 흔적.','회귀':'본질과 근원으로 돌아가려는 의지.','침잠':'깊은 고요 속으로 스스로를 던지는 상태.','부유하는 계절':'고정되지 않고 흐르는 시간의 편린들.','식물의 고독':'정적인 대상에서 발견하는 주체적인 생명감.','무질서의 질서':'우연한 흔적들이 모여 이루는 새로운 조화.','여백의 밀도':'비어 있는 공간 속에 응축된 심리적 무게.','잊혀진 것들의 초상':'소외된 기억과 사물을 향한 따뜻한 시선.','디지털 지문':'기기를 통해 남겨진 작가만의 고유한 흔적.','물성의 발현':'흙과 재료가 가진 원초적인 질감.','스며듦과 번짐':'수성 매체가 종이 위에서 자생적으로 만드는 길.','마찰의 기록':'펜 끝과 화면이 만나 발생한 촉각적 에너지.','가변적 형태':'공간과 환경에 따라 유동적으로 변하는 입체의 속성.','조용한 소란':'정적인 화면 너머에서 느껴지는 내면의 진동.','잔향의 기억':'소리가 사라진 뒤에도 남아있는 울림.','온도의 기억':'특정 공간이나 순간이 지녔던 따스함의 기록.','푸른 우울':'단순한 색상을 넘어선 감정적 깊이.','빛의 파편':'부서져 내리는 강렬한 색채의 입자들.','바람의 결':'보이지 않는 흐름을 시각적 선으로 치환한 감각.','살결':'인물이나 사물에서 느껴지는 생생한 피부의 촉감.'};
var CAT_COL={THE:'Themes & Philosophy',SER:'Series & Narratives',MAT:'Materiality & Process',SEN:'Senses & Emotions'};
var allWorks=[],filtered=[],modalIdx=0,narrativeTimer=null,activeCat=null;
var CHUNK_SIZE=24,renderedCount=0,chunkSentinel=null,chunkObserver=null;

function sel(id){return document.getElementById(id);}
function parseTags(str){if(!str)return[];return String(str).split(/[,\n]/).map(function(t){return t.trim();}).filter(Boolean);}
function thumbUrl(row){return row.thumb||'';}
function fullUrl(row){return row.full||row.thumb||'';}
function allRowTags(row){var arr=[];Object.keys(CAT_COL).forEach(function(cat){parseTags(row[CAT_COL[cat]]).forEach(function(t){arr.push(t);});});return arr;}

function onTagClick(cat){
  if(activeCat===cat){activeCat=null;document.querySelectorAll('.tag-item').forEach(function(el){el.classList.remove('active');});showFloat();return;}
  activeCat=cat;
  document.querySelectorAll('.tag-item').forEach(function(el){el.classList.remove('active');});
  sel('tag-'+cat).classList.add('active');
  var firstTag=null;
  for(var i=0;i<allWorks.length;i++){var tags=parseTags(allWorks[i][CAT_COL[cat]]);if(tags.length){firstTag=tags[0];break;}}
  runNarrativeThenGrid(cat,firstTag);
}

function showFloat(){
  if(narrativeTimer){clearTimeout(narrativeTimer);narrativeTimer=null;}
  disconnectChunkObserver();
  sel('narrativeZone').classList.remove('show','rising');
  sel('gridZone').classList.remove('open');
  sel('floatZone').classList.remove('hidden');
}

function runNarrativeThenGrid(cat,firstTag){
  if(narrativeTimer){clearTimeout(narrativeTimer);narrativeTimer=null;}
  sel('floatZone').classList.add('hidden');
  sel('gridZone').classList.remove('open');
  var nz=sel('narrativeZone');
  sel('nsLabel').textContent=CAT_COL[cat]||'';
  sel('nsText').textContent=(firstTag&&TAG_DESC[firstTag])||'';
  nz.classList.remove('rising');nz.classList.add('show');
  narrativeTimer=setTimeout(function(){
    narrativeTimer=null;nz.classList.add('rising');
    setTimeout(function(){nz.classList.remove('show','rising');},500);
    renderFiltered(cat);
  },2200);
}

function renderFiltered(cat){
  filtered=allWorks.filter(function(row){
    if(row.pub&&row.pub!=='y')return false;
    return parseTags(row[CAT_COL[cat]]).length>0;
  }).map(function(row){return{Title:row.title,Year:row.year,Medium:row.medium,Description:row.desc,thumb:row.thumb,full:row.full,'Themes & Philosophy':row.THE,'Series & Narratives':row.SER,'Materiality & Process':row.MAT,'Senses & Emotions':row.SEN};});
  renderedCount=0;sel('grid').innerHTML='';
  sel('gridZone').classList.add('open');
  disconnectChunkObserver();renderNextChunk(true);
}

function renderNextChunk(animate){
  var grid=sel('grid'),start=renderedCount,end=Math.min(start+CHUNK_SIZE,filtered.length);
  for(var i=start;i<end;i++)grid.appendChild(makeCard(filtered[i],i,animate));
  renderedCount=end;
  if(chunkSentinel)chunkSentinel.remove();chunkSentinel=null;
  if(renderedCount<filtered.length){chunkSentinel=document.createElement('div');chunkSentinel.className='load-sentinel';grid.appendChild(chunkSentinel);connectChunkObserver();}
}
function connectChunkObserver(){
  if(chunkObserver)chunkObserver.disconnect();
  chunkObserver=new IntersectionObserver(function(entries){entries.forEach(function(e){if(!e.isIntersecting)return;chunkObserver.disconnect();chunkObserver=null;renderNextChunk(true);});},{rootMargin:'300px'});
  if(chunkSentinel)chunkObserver.observe(chunkSentinel);
}
function disconnectChunkObserver(){if(chunkObserver){chunkObserver.disconnect();chunkObserver=null;}if(chunkSentinel){chunkSentinel.remove();chunkSentinel=null;}}

function makeCard(row,idx,animate){
  var card=document.createElement('div');card.className='card';
  var title=row.Title||'',year=row.Year||'',medium=row.Medium||'',thumb=thumbUrl(row);
  var sk=document.createElement('div');sk.className='card-skeleton';card.appendChild(sk);
  var img=document.createElement('img');img.alt=title;
  img.onload=function(){if(sk.parentNode)sk.parentNode.removeChild(sk);};
  img.onerror=function(){if(sk.parentNode)sk.parentNode.removeChild(sk);};
  if(thumb){lazyLoad(img,thumb);}else{img.classList.add('loaded');}
  card.appendChild(img);
  var ov=document.createElement('div');ov.className='card-overlay';
  ov.innerHTML='<div class="card-title">'+title+'</div><div class="card-meta">'+year+(medium?' · '+medium:'')+'</div>';
  card.appendChild(ov);
  (function(i){card.addEventListener('click',function(){openModal(i);});})(idx);
  var delay=animate?Math.min((idx-(renderedCount-CHUNK_SIZE))*25,400):0;
  setTimeout(function(){card.classList.add('revealed');},delay);
  return card;
}

var imgObserver=new IntersectionObserver(function(entries,obs){entries.forEach(function(e){if(!e.isIntersecting)return;var img=e.target,src=img.dataset.src;obs.unobserve(img);img.onerror=function(){var m=src.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);if(m&&this.src.indexOf('w200')===-1){this.src='https://drive.google.com/thumbnail?id='+m[1]+'&sz=w200';}else{this.style.opacity='0.05';this.classList.add('loaded');}};img.onload=function(){img.classList.add('loaded');};img.src=src;});},{rootMargin:'300px'});
function lazyLoad(img,url){if(!url){img.classList.add('loaded');return;}img.dataset.src=url;imgObserver.observe(img);}

function loadSubImg(imgId,url){
  if(!url)return;var img=sel(imgId);
  img.onload=function(){this.classList.add('loaded');};
  img.onerror=function(){var m=url.match(/\/d\/([a-zA-Z0-9_-]{10,})/);if(m&&this.src.indexOf('export')===-1){this.src='https://drive.google.com/uc?export=view&id='+m[1];}};
  img.src=url;
}

function openModal(idx){modalIdx=idx;paintModal();sel('modalBg').classList.add('open');}
function closeModal(){sel('modalBg').classList.remove('open');}
function bgClose(e){if(e.target===sel('modalBg'))closeModal();}
function navModal(d){modalIdx=(modalIdx+d+filtered.length)%filtered.length;paintModal();}
function paintModal(){
  var row=filtered[modalIdx],mImg=sel('mImg');mImg.style.opacity='0';
  mImg.onload=function(){mImg.style.opacity='1';};
  mImg.onerror=function(){var id=row.thumb&&row.thumb.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);if(id&&mImg.src.indexOf('w800')===-1){mImg.src='https://drive.google.com/thumbnail?id='+id[1]+'&sz=w800';}};
  mImg.src=fullUrl(row);
  sel('mTitle').textContent=row.Title||'';sel('mYear').textContent=row.Year||'';sel('mMedium').textContent=row.Medium||'';sel('mDesc').textContent=row.Description||'';
  sel('mTags').innerHTML=allRowTags(row).map(function(t){return'<span class="m-tag">'+t+'</span>';}).join('');
  sel('arrPrev').style.display=filtered.length>1?'flex':'none';sel('arrNext').style.display=filtered.length>1?'flex':'none';
}
document.addEventListener('keydown',function(e){if(!sel('modalBg').classList.contains('open'))return;if(e.key==='Escape')closeModal();if(e.key==='ArrowLeft')navModal(-1);if(e.key==='ArrowRight')navModal(1);});
window.addEventListener('message',function(e){if(e.data&&e.data.openCat)onTagClick(e.data.openCat);});

Promise.all([
  fetch('./data/tags.json').then(function(r){return r.json();}),
  fetch('./data/works.json').then(function(r){return r.json();})
]).then(function(results){
  allWorks=results[1];
  var sorted=allWorks.slice().sort(function(a,b){return(parseInt(b.year||0))-(parseInt(a.year||0));});
  var subs=[];
  for(var i=0;i<sorted.length&&subs.length<3;i++){if((sorted[i].page||'').trim()==='서브')subs.push(sorted[i]);}
  if(subs[0])loadSubImg('subImg1',subs[0].thumb||subs[0].full||'');
  if(subs[1])loadSubImg('subImg2',subs[1].thumb||subs[1].full||'');
  if(subs[2])loadSubImg('subImg3',subs[2].thumb||subs[2].full||'');
}).catch(function(){console.error('데이터 로딩 오류');});
</script>
</body>
</html>
