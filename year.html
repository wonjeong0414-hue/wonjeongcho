<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 36px;z-index:200;background:var(--bg)}

.yr-item:hover .yr-label{color:var(--ink)}.yr-item:hover::after{transform:scaleX(1)}
.yr-item.checked .yr-label{color:var(--ink);font-weight:600;font-size:14.5px}.yr-item.checked::after{transform:scaleX(1)}
.body-row{flex:1;display:flex;overflow:hidden;position:relative}

.grid-zone.open{opacity:1;pointer-events:all}

.year-section-grid{overflow:hidden}

.grid{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:52px;gap:4px}

.card-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(26,26,24,0.6) 0%,transparent 50%);opacity:0;transition:opacity 0.22s ease;display:flex;flex-direction:column;justify-content:flex-end;padding:7px 8px}

.card-title{font-family:'EB Garamond',serif;font-style:italic;font-size:12px;font-weight:500;color:#fff;line-height:1.3;margin-bottom:2px}

.card-dim{font-size:7.5px;letter-spacing:0.04em;color:rgba(255,255,255,0.6);margin-top:1px}
.card-skeleton{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,0.04) 25%,rgba(0,0,0,0.07) 50%,rgba(0,0,0,0.04) 75%);background-size:200% 100%;animation:cardShimmer 1.4s ease infinite}

.m-meta{font-size:9px;letter-spacing:0.06em;color:var(--ink-mid);margin-bottom:2px}

.arr-prev{left:16px}.arr-next{right:16px}
#page-loader{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;opacity:1;transition:opacity 0.6s cubic-bezier(0.16,1,0.3,1);pointer-events:all}

.loader-inner{display:flex;flex-direction:column;align-items:center;gap:20px}
.loader-name{font-family:'EB Garamond',serif;font-style:italic;font-size:clamp(18px,3vw,28px);letter-spacing:0.18em;color:var(--ink);opacity:0;animation:loaderFadeIn 0.8s ease 0.2s forwards}
.loader-line{width:0;height:0.5px;background:var(--ink);opacity:0.3;animation:loaderLine 1s cubic-bezier(0.16,1,0.3,1) 0.4s forwards}

@keyframes loaderLine{from{width:0}to{width:clamp(80px,12vw,140px)}}

body.fade-out{opacity:0;transition:opacity 0.3s ease}
.m-year-bar{display:none}

  .bs-title{font-family:'EB Garamond',serif;font-style:italic;font-size:20px;color:var(--ink);line-height:1.3;margin-bottom:6px}
  .bs-meta{font-size:10px;letter-spacing:0.06em;color:var(--ink-mid);margin-bottom:2px}

}

      <div class="m-rule"></div>
      <div class="m-desc" id="mDesc"></div>
      <div class="m-tags" id="mTags"></div>
    </div>
    <button class="modal-arr arr-next" id="arrNext" onclick="navModal(1)">›</button>
  </div>
</div>
<div class="bs-sheet" id="bsSheet">
  <div class="bs-handle-wrap" id="bsHandle"><div class="bs-handle"></div></div>
  <button class="bs-close" onclick="closeSheet()">×</button>
  <button class="bs-nav bs-prev" id="bsPrev" onclick="navSheet(-1)">‹</button>
  <button class="bs-nav bs-next" id="bsNext" onclick="navSheet(1)">›</button>
  <div class="bs-img-area" id="bsImgArea"><img id="bsImg" src="" alt=""></div>
  <div class="bs-info">
    <div class="bs-title" id="bsTitle"></div>
    <div class="bs-meta" id="bsYear"></div>
    <div class="bs-meta" id="bsMedium"></div>
    <div class="bs-meta" id="bsDim"></div>
    <div class="bs-rule"></div>
    <div class="bs-desc" id="bsDesc"></div>
    <div class="bs-tags" id="bsTags"></div>
  </div>
</div>
<script>
var ALL_YEARS=[],selectedYears=[],allFiltered=[],flatFiltered=[],modalIdx=0;
var CHUNK_SIZE=24,chunkSentinel=null,chunkObserver=null,yearRendered={};
var allWorks=[];
var sheetState='closed',dragStartY=0,dragStartState='';
var introWorks=[];
function sel(id){return document.getElementById(id);}
function isMobile(){return window.innerWidth<=600;}
function go(page){document.body.classList.add('fade-out');setTimeout(function(){window.location.href=page+'.html';},280);}
function rnd(min,max){return Math.random()*(max-min)+min;}
function rndInt(min,max){return Math.floor(rnd(min,max+1));}
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
document.addEventListener('DOMContentLoaded',function(){document.body.classList.add('page-fade');setTimeout(function(){document.body.classList.remove('page-fade');},500);});
var mosaicObserver=new IntersectionObserver(function(entries,obs){entries.forEach(function(e){if(!e.isIntersecting)return;obs.unobserve(e.target);e.target.classList.add('revealed');});},{rootMargin:'0px'});
function buildMosaic(works){
  var yearGroups={};
  works.forEach(function(w){var y=parseInt(w['year']||0);if(!y)return;if(!yearGroups[y])yearGroups[y]=[];yearGroups[y].push(w);});
  var seeds=[];
  Object.keys(yearGroups).forEach(function(y){var g=yearGroups[y];for(var i=0;i<g.length;i++){if(g[i]['thumb']||g[i]['full']){seeds.push(g[i]);break;}}});
  var imgWorks=works.filter(function(w){return !!(w['thumb']||w['full']);});
  var extra=shuffle(imgWorks).slice(0,Math.max(0,40-seeds.length));
  var pool=shuffle(seeds.concat(extra));
  introWorks=pool;
  var spanOptions=[{c:1,r:2},{c:1,r:2},{c:1,r:3},{c:2,r:2},{c:2,r:3},{c:2,r:4},{c:3,r:3},{c:1,r:2},{c:1,r:2},{c:3,r:2},{c:2,r:2}];
  var grid=sel('mosaicGrid');grid.innerHTML='';
  pool.forEach(function(row,i){
    var span=spanOptions[i%spanOptions.length];
    if(Math.random()<0.3){span={c:span.c,r:span.r+(Math.random()<0.5?1:-1)};span.r=Math.max(2,span.r);}
    var tile=document.createElement('div');tile.className='mtile';
    tile.style.gridColumn='span '+span.c;tile.style.gridRow='span '+span.r;
    var delay=rnd(0.05,2.2);var dur=rnd(0.5,1.2);
    tile.style.transition='opacity '+dur+'s ease '+delay+'s, transform '+dur+'s cubic-bezier(0.16,1,0.3,1) '+delay+'s';
    var sk=document.createElement('div');sk.className='mtile-sk';tile.appendChild(sk);
    var img=document.createElement('img');var src=row['thumb']||row['full']||'';img.alt=row['title']||'';
    img.onload=function(){img.classList.add('loaded');if(sk.parentNode)sk.parentNode.removeChild(sk);};
    img.onerror=function(){var m=(src||'').match(/[?&]id=([a-zA-Z0-9_-]{10,})/);if(m&&img.src.indexOf('w400')===-1){img.src='https://drive.google.com/thumbnail?id='+m[1]+'&sz=w400';}else{if(sk.parentNode)sk.parentNode.removeChild(sk);}};
    if(src)img.src=src;tile.appendChild(img);
    var ov=document.createElement('div');ov.className='mtile-overlay';tile.appendChild(ov);
    var rowYr=row['year']||'';
    if(rowYr){var yrLabel=document.createElement('div');yrLabel.className='mtile-year';yrLabel.textContent=rowYr;tile.appendChild(yrLabel);}
    (function(yr){tile.addEventListener('click',function(){if(yr)selectYear(parseInt(yr));});})(row['year']);
    grid.appendChild(tile);
    (function(t,d){setTimeout(function(){t.classList.add('revealed');},d*1000);})(tile,delay);
  });
}
function buildYearGrid(){
  var grid=sel('yearGrid');
  if(!ALL_YEARS.length){grid.innerHTML='<div style="font-size:8px;color:var(--ink-dim)">연도 없음</div>';return;}
  grid.innerHTML=ALL_YEARS.map(function(yr){return '<div class="yr-item" id="yr-'+yr+'" onclick="selectYear('+yr+')"><span class="yr-label">'+yr+'</span></div>';}).join('');
  buildMobileYearBar();
}
function buildMobileYearBar(){
  var activeEl=sel('mYrActive'),listEl=sel('mYrList');if(!activeEl||!listEl)return;
  var curYr=selectedYears.length?selectedYears[0]:(ALL_YEARS[0]||'');activeEl.textContent=curYr||'';listEl.innerHTML='';
  ALL_YEARS.forEach(function(yr){if(yr===curYr)return;var div=document.createElement('div');div.className='m-yr-item';div.textContent=yr;div.addEventListener('click',function(){selectYear(yr);});listEl.appendChild(div);});
}
function updateMobileYearBar(){
  var activeEl=sel('mYrActive'),listEl=sel('mYrList');if(!activeEl||!listEl)return;
  var curYr=selectedYears.length?selectedYears[0]:(ALL_YEARS[0]||'');activeEl.textContent=curYr||'';listEl.innerHTML='';
  ALL_YEARS.forEach(function(yr){if(yr===curYr)return;var div=document.createElement('div');div.className='m-yr-item';div.textContent=yr;div.addEventListener('click',function(){selectYear(yr);});listEl.appendChild(div);});
}
function selectYear(yr){
  var already=selectedYears.length===1&&selectedYears[0]===yr;
  ALL_YEARS.forEach(function(y){var e=sel('yr-'+y);if(e)e.classList.remove('checked');});
  if(already){selectedYears=[];sel('introZone').classList.remove('hidden');sel('gridZone').classList.remove('open');sel('gridContainer').innerHTML='';allFiltered=[];flatFiltered=[];return;}
  selectedYears=[yr];var el=sel('yr-'+yr);if(el)el.classList.add('checked');
  if(isMobile())updateMobileYearBar();
  sel('introZone').classList.add('hidden');fetchAndRender();
}
function fetchAndRender(){
  disconnectChunkObserver();
  if(!selectedYears.length){sel('gridZone').classList.remove('open');sel('gridContainer').innerHTML='';allFiltered=[];flatFiltered=[];return;}
  sel('gridZone').classList.add('open');sel('gridContainer').innerHTML='<div class="loading-msg">Loading…</div>';
  var yearsDesc=selectedYears.slice().sort(function(a,b){return b-a;});
  allFiltered=[];flatFiltered=[];
  yearsDesc.forEach(function(yr){var rows=allWorks.filter(function(w){return parseInt(w['year']||0)===yr;});if(rows.length)allFiltered.push({year:yr,rows:rows});rows.forEach(function(r){flatFiltered.push(r);});});
  yearRendered={};renderAll();
}
function renderAll(){
  var con=sel('gridContainer');con.innerHTML='';disconnectChunkObserver();
  if(!allFiltered.length){con.innerHTML='<div style="padding:60px 0;text-align:center;font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-dim)">No works found</div>';return;}
  allFiltered.forEach(function(g){
    if(!isMobile()){
      var section=document.createElement('div');section.className='year-section';
      var header=document.createElement('div');header.className='year-section-header';
      header.innerHTML='<span class="yd-label">'+g.year+'</span><span class="yd-count">'+g.rows.length+' works</span>';
      var gridWrap=document.createElement('div');gridWrap.className='year-section-grid';
      var grid=document.createElement('div');grid.className='grid';grid.id='grid-'+g.year;
      gridWrap.appendChild(grid);section.appendChild(header);section.appendChild(gridWrap);con.appendChild(section);
    } else {
      var grid=document.createElement('div');grid.className='grid';grid.id='grid-'+g.year;con.appendChild(grid);
    }
    yearRendered[g.year]=0;
  });
  renderNextChunk();
}
function renderNextChunk(){
  var rem=CHUNK_SIZE;
  allFiltered.forEach(function(g){if(rem<=0)return;var grid=sel('grid-'+g.year);if(!grid)return;var start=yearRendered[g.year],end=Math.min(start+rem,g.rows.length);for(var i=start;i<end;i++)grid.appendChild(makeCard(g.rows[i],getFlatIndex(g.year,i),i-start));rem-=(end-start);yearRendered[g.year]=end;});
  if(chunkSentinel)chunkSentinel.remove();chunkSentinel=null;
  if(allFiltered.some(function(g){return yearRendered[g.year]<g.rows.length;})){chunkSentinel=document.createElement('div');chunkSentinel.className='load-sentinel';sel('gridContainer').appendChild(chunkSentinel);connectChunkObserver();}
}
function getFlatIndex(year,rowIdx){var off=0;for(var i=0;i<allFiltered.length;i++){if(allFiltered[i].year===year)return off+rowIdx;off+=allFiltered[i].rows.length;}return off+rowIdx;}
function connectChunkObserver(){
  if(chunkObserver)chunkObserver.disconnect();
  chunkObserver=new IntersectionObserver(function(entries){entries.forEach(function(e){if(!e.isIntersecting)return;chunkObserver.disconnect();chunkObserver=null;renderNextChunk();});},{rootMargin:'300px'});
  if(chunkSentinel)chunkObserver.observe(chunkSentinel);
}
function disconnectChunkObserver(){if(chunkObserver){chunkObserver.disconnect();chunkObserver=null;}if(chunkSentinel){chunkSentinel.remove();chunkSentinel=null;}}
var CARD_SPANS=[{c:1,r:3},{c:1,r:2},{c:2,r:3},{c:1,r:2},{c:1,r:4},{c:2,r:2},{c:1,r:3},{c:2,r:4},{c:1,r:2},{c:1,r:3},{c:3,r:3},{c:1,r:2},{c:2,r:3},{c:1,r:2},{c:1,r:3}];
function makeCard(row,flatIdx,animOffset){
  var card=document.createElement('div');card.className='card';
  var title=row['title']||'',yr=row['year']||'',medium=row['medium']||'',dim=row['dim']||row['dimensions']||'';
  var sp=CARD_SPANS[flatIdx%CARD_SPANS.length];
  if(Math.random()<0.3){sp={c:sp.c,r:sp.r+(Math.random()<0.5?1:-1)};sp.r=Math.max(2,sp.r);}
  card.style.gridColumn='span '+sp.c;card.style.gridRow='span '+sp.r;
  var thumb=row['thumb']||'';
  var sk=document.createElement('div');sk.className='card-skeleton';card.appendChild(sk);
  var img=document.createElement('img');img.alt=title;
  img.onload=function(){if(sk.parentNode)sk.parentNode.removeChild(sk);img.classList.add('loaded');};
  img.onerror=function(){if(sk.parentNode)sk.parentNode.removeChild(sk);};
  if(thumb){lazyLoad(img,thumb);}else{img.classList.add('loaded');}
  card.appendChild(img);
  if(!isMobile()){var ov=document.createElement('div');ov.className='card-overlay';ov.innerHTML='<div class="card-title">'+title+'</div><div class="card-meta">'+yr+(medium?' · '+medium:'')+'</div>'+(dim?'<div class="card-dim">'+dim+'</div>':'');card.appendChild(ov);}
  (function(idx){card.addEventListener('click',function(){openModal(idx);});})(flatIdx);
  setTimeout(function(){card.classList.add('revealed');},animOffset*60);
  return card;
}
var imgObserver=new IntersectionObserver(function(entries,obs){entries.forEach(function(e){if(!e.isIntersecting)return;var img=e.target,src=img.dataset.src;obs.unobserve(img);img.onerror=function(){var m=src.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);if(m&&this.src.indexOf('w200')===-1){this.src='https://drive.google.com/thumbnail?id='+m[1]+'&sz=w200';}else{this.style.opacity='0.05';this.classList.add('loaded');}};img.onload=function(){img.classList.add('loaded');};img.src=src;});},{rootMargin:'300px'});
function lazyLoad(img,url){if(!url){img.classList.add('loaded');return;}img.dataset.src=url;imgObserver.observe(img);}
function openModal(idx){modalIdx=idx;if(isMobile()){openSheet(idx);return;}paintModal();sel('modalBg').classList.add('open');document.body.style.overflow='hidden';}
function closeModal(){var area=sel('modalImgArea');var iframe=area.querySelector('iframe');if(iframe)iframe.src='';sel('modalBg').classList.remove('open');document.body.style.overflow='';}
function bgClose(e){if(e.target===sel('modalBg'))closeModal();}
function navModal(d){modalIdx=(modalIdx+d+flatFiltered.length)%flatFiltered.length;paintModal();}
function paintModal(){
  var row=flatFiltered[modalIdx];var area=sel('modalImgArea');var prev=area.querySelector('iframe');if(prev)prev.src='';area.innerHTML='';
  var img=document.createElement('img');img.id='mImg';img.style.opacity='0';
  var src=row['full']||row['thumb']||'';
  img.onload=function(){img.style.opacity='1';};
  img.onerror=function(){var m=src.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);if(m&&img.src.indexOf('w800')===-1)img.src='https://drive.google.com/thumbnail?id='+m[1]+'&sz=w800';};
  img.src=src;area.appendChild(img);
  sel('mTitle').textContent=row['title']||'';sel('mYear').textContent=row['year']||'';sel('mMedium').textContent=row['medium']||'';sel('mDim').textContent=row['dim']||row['dimensions']||'';sel('mDesc').textContent=row['desc']||'';
  var tags=[];['THE','SER','MAT','SEN'].forEach(function(k){var v=row[k]||'';v.split(/[,\n]/).forEach(function(t){t=t.trim();if(t)tags.push(t);});});
  sel('mTags').innerHTML=tags.map(function(t){return'<span class="m-tag">'+t+'</span>';}).join('');
  sel('arrPrev').style.display=flatFiltered.length>1?'flex':'none';sel('arrNext').style.display=flatFiltered.length>1?'flex':'none';
}
function openSheet(idx){modalIdx=idx;paintSheet();var sheet=sel('bsSheet');sheet.classList.remove('half','full');requestAnimationFrame(function(){sheet.classList.add('half');});sheetState='half';document.body.classList.add('sheet-open');}
function closeSheet(){var area=sel('bsImgArea');var iframe=area.querySelector('iframe');if(iframe)iframe.src='';sel('bsSheet').classList.remove('half','full');sheetState='closed';document.body.classList.remove('sheet-open');}
function navSheet(d){modalIdx=(modalIdx+d+flatFiltered.length)%flatFiltered.length;paintSheet();}
function paintSheet(){
  var row=flatFiltered[modalIdx];var area=sel('bsImgArea');var prev=area.querySelector('iframe');if(prev)prev.src='';area.innerHTML='';
  var img=document.createElement('img');img.id='bsImg';img.style.opacity='0';
  var src=row['full']||row['thumb']||'';
  img.onload=function(){img.style.opacity='1';};
  img.onerror=function(){var m=src.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);if(m&&img.src.indexOf('w800')===-1)img.src='https://drive.google.com/thumbnail?id='+m[1]+'&sz=w800';};
  img.src=src;area.appendChild(img);
  sel('bsTitle').textContent=row['title']||'';sel('bsYear').textContent=row['year']||'';sel('bsMedium').textContent=row['medium']||'';sel('bsDim').textContent=row['dim']||row['dimensions']||'';sel('bsDesc').textContent=row['desc']||'';
  var tags=[];['THE','SER','MAT','SEN'].forEach(function(k){var v=row[k]||'';v.split(/[,\n]/).forEach(function(t){t=t.trim();if(t)tags.push(t);});});
  sel('bsTags').innerHTML=tags.map(function(t){return'<span class="bs-tag">'+t+'</span>';}).join('');
  var showNav=flatFiltered.length>1;sel('bsPrev').style.display=showNav?'flex':'none';sel('bsNext').style.display=showNav?'flex':'none';
}
(function(){
  var handle=sel('bsHandle'),sheet=sel('bsSheet');if(!handle||!sheet)return;
  function onStart(e){dragStartY=e.touches?e.touches[0].clientY:e.clientY;dragStartState=sheetState;document.addEventListener('touchmove',onMove,{passive:false});document.addEventListener('touchend',onEnd);document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onEnd);}
  function onMove(e){e.preventDefault();var y=e.touches?e.touches[0].clientY:e.clientY,dy=y-dragStartY;if(dy<-60){sheet.classList.remove('half');sheet.classList.add('full');sheetState='full';}else if(dy>60&&dragStartState==='full'){sheet.classList.remove('full');sheet.classList.add('half');sheetState='half';}else if(dy>100&&dragStartState==='half'){closeSheet();}}
  function onEnd(){document.removeEventListener('touchmove',onMove);document.removeEventListener('touchend',onEnd);document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onEnd);}
  handle.addEventListener('touchstart',onStart,{passive:true});handle.addEventListener('mousedown',onStart);
})();
document.addEventListener('keydown',function(e){
  if(sheetState!=='closed'){if(e.key==='Escape')closeSheet();if(e.key==='ArrowLeft')navSheet(-1);if(e.key==='ArrowRight')navSheet(1);return;}
  if(!sel('modalBg').classList.contains('open'))return;
  if(e.key==='Escape')closeModal();if(e.key==='ArrowLeft')navModal(-1);if(e.key==='ArrowRight')navModal(1);
});
document.querySelectorAll('.nav-dd').forEach(function(dd){
  var menu=dd.querySelector('.nav-dd-menu'),timer;
  function openM(){clearTimeout(timer);menu.classList.add('open');}
  function closeM(){timer=setTimeout(function(){menu.classList.remove('open');},160);}
  dd.addEventListener('mouseenter',openM);
  dd.addEventListener('mouseleave',closeM);
  menu.addEventListener('mouseenter',function(){clearTimeout(timer);});
  menu.addEventListener('mouseleave',closeM);
  dd.querySelector('.nav-item').addEventListener('click',function(e){
    e.stopPropagation();
    var isOpen=menu.classList.contains('open');
    document.querySelectorAll('.nav-dd-menu').forEach(function(m){m.classList.remove('open');});
    if(!isOpen)menu.classList.add('open');
  });
});
document.addEventListener('click',function(e){
  if(!e.target.closest||!e.target.closest('.nav-dd'))
    document.querySelectorAll('.nav-dd-menu').forEach(function(m){m.classList.remove('open');});
});
fetch('./data/works.json')
  .then(function(r){return r.json();})
  .then(function(works){
    allWorks=works;
    var yearSet={};works.forEach(function(w){var y=parseInt(w['year']||0);if(y)yearSet[y]=1;});
    ALL_YEARS=Object.keys(yearSet).map(Number).sort(function(a,b){return b-a;});
    buildYearGrid();
    if(isMobile()&&ALL_YEARS.length){sel('introZone').style.display='none';selectedYears=[ALL_YEARS[0]];var el=sel('yr-'+ALL_YEARS[0]);if(el)el.classList.add('checked');updateMobileYearBar();fetchAndRender();}
    else{buildMosaic(works);}
  })
  .catch(function(){sel('yearGrid').innerHTML='<div style="font-size:8px;color:var(--ink-dim)">로딩 오류</div>';});
window.addEventListener('load',function(){
  var loader=document.getElementById('page-loader');
  if(loader){setTimeout(function(){loader.classList.add('hidden');setTimeout(function(){loader.style.display='none';},650);},400);}
});
</script>
</body>
</html>
