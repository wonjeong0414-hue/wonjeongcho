 <!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Year — WON JEONG CHO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=Cormorant+Garamond:wght@300;400&display=swap" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=Cormorant+Garamond:wght@300;400&display=swap"></noscript>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1a1a18;--ink-mid:#4a4a47;--ink-dim:#7a7a74;--bg:#f7f6f3;--white:#fff;--nav-h:50px;--bar-h:44px}
html,body{height:100%;background:var(--bg);font-family:'Cormorant Garamond',serif;color:var(--ink);overflow:hidden}
nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 36px;z-index:200;background:var(--bg)}
@media(max-width:600px){nav{padding:0 12px}}
@media(max-width:480px){.nav-logo{font-size:9px !important;letter-spacing:0.16em !important}.nav-item{font-size:8px !important;padding:5px 6px !important}.nav-sep{margin:0 1px !important}}
.nav-logo{font-weight:400;font-size:13px;letter-spacing:0.28em;color:var(--ink);text-decoration:none;text-transform:uppercase;cursor:pointer}
.nav-right{display:flex;align-items:center}
.nav-item{font-size:9.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-dim);padding:5px 11px;cursor:pointer;text-decoration:none;transition:color 0.25s;white-space:nowrap;position:relative}
.nav-item::after{content:'';position:absolute;bottom:0;left:11px;right:11px;height:0.5px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform 0.28s cubic-bezier(0.16,1,0.3,1);opacity:0.5}
.nav-item:hover{color:var(--ink)}
.nav-item:hover::after{transform:scaleX(1)}
.nav-item.active{color:var(--ink)}
.nav-item.active::after{transform:scaleX(1)}
.nav-sep{width:0.5px;height:12px;background:rgba(0,0,0,0.12);margin:0 5px;flex-shrink:0}
.nav-dd{position:relative}
.nav-dd-menu{display:none;position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--white);border-radius:4px;padding:4px 0;min-width:80px;width:max-content;z-index:300;box-shadow:0 4px 14px rgba(0,0,0,0.08)}
.nav-dd-item{display:block;font-size:9px;letter-spacing:0.08em;color:var(--ink-mid);padding:5px 14px;cursor:pointer;transition:color 0.15s,background 0.15s;white-space:nowrap;text-transform:uppercase}
.nav-dd-item:hover{color:var(--ink);background:rgba(0,0,0,0.03)}

/* ── 데스크탑 레이아웃 ── */
.layout{position:fixed;top:var(--nav-h);left:0;right:0;bottom:0;display:flex;flex-direction:column}

/* ── 상단 연도 바 (Year 레이블 + 연도 가로) ── */
.year-bar{
  flex-shrink:0;
  min-height:var(--bar-h);
  height:auto !important;
  display:flex !important;
  align-items:center;
  flex-wrap:wrap !important;
  padding:6px 36px;
  border-bottom:0.5px solid rgba(0,0,0,0.07);
  gap:4px 0;
  overflow:visible !important;
  row-gap:4px;
}
.year-bar::-webkit-scrollbar{display:none}
.bar-title{
  font-family:'EB Garamond',serif;
  font-style:italic;
  font-size:18px;
  color:var(--ink);
  margin-right:12px;
  flex-shrink:0;
  letter-spacing:0.04em;
  align-self:flex-start;
  padding-top:4px;
}
.bar-sep{width:0.5px;height:14px;background:rgba(0,0,0,0.12);margin-right:18px;flex-shrink:0}
.yr-item{
  cursor:pointer;
  user-select:none;
  padding:3px 6px;
  position:relative;
  flex-shrink:0;
}
.yr-label{
  font-size:14px;
  color:var(--ink-mid);
  transition:color 0.18s;
  line-height:1.4;
  letter-spacing:0.03em;
  font-family:'Cormorant Garamond',serif;
  font-weight:500;
  display:block;
}
.yr-item::after{
  content:'';
  position:absolute;
  bottom:0;left:6px;right:6px;
  height:0.5px;background:var(--ink);
  transform:scaleX(0);transform-origin:left;
  transition:transform 0.25s cubic-bezier(0.16,1,0.3,1);
  opacity:0.4;
}
.yr-item:hover .yr-label{color:var(--ink)}
.yr-item:hover::after{transform:scaleX(1)}
.yr-item.checked .yr-label{color:var(--ink);font-weight:600;font-size:14.5px}
.yr-item.checked::after{transform:scaleX(1)}

/* ── body ── */
.body-row{flex:1;display:flex;overflow:hidden;position:relative}

/* ── preview zone ── */
.preview-zone{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  opacity:1;transition:opacity 0.5s ease;pointer-events:none;
}
.preview-img-wrap{pointer-events:all}
.preview-zone.hidden{opacity:0}
.preview-img-wrap{display:flex;flex-direction:column;align-items:center;max-width:88%}

/* ★ 이미지 10% 크게 + 움직임 강화 */
.preview-img{
  display:block;
  max-height:calc(100vh - var(--nav-h) - var(--bar-h) - 60px);
  max-width:88%;
  object-fit:contain;
  opacity:0;
  transition:opacity 1s ease, transform 0.6s cubic-bezier(0.16,1,0.3,1);
  animation:previewFloat 9s ease-in-out infinite;
  cursor:pointer;
}
.preview-img:hover{
  animation-play-state:paused;
  transform:scale(1.06) !important;
}
.preview-img.loaded{opacity:1}
@keyframes previewFloat{
  0%,100%{transform:translateY(0) rotate(0deg)}
  35%{transform:translateY(-4px) rotate(0.12deg)}
  70%{transform:translateY(2px) rotate(-0.08deg)}
}

.preview-caption{margin-top:10px;display:flex;flex-direction:column;gap:2px;opacity:0;transition:opacity 0.8s ease 0.4s}
.preview-caption.show{opacity:1}
.caption-title{font-family:'EB Garamond',serif;font-style:italic;font-size:11px;color:var(--ink-mid);letter-spacing:0.04em;line-height:1.4}
.caption-sen{font-size:8.5px;letter-spacing:0.1em;color:var(--ink-dim);line-height:1.5}
.empty-hint{font-family:'EB Garamond',serif;font-style:italic;font-size:13px;color:var(--ink-dim);letter-spacing:0.12em}

/* ── grid zone ── */
.grid-zone{position:absolute;inset:0;overflow-y:auto;padding:16px 24px 48px 36px;scrollbar-width:none;opacity:0;pointer-events:none;transition:opacity 0.5s ease}
.grid-zone::-webkit-scrollbar{display:none}
.grid-zone.open{opacity:1;pointer-events:all}
.year-section{margin-bottom:40px}
.year-section-header{width:80px;float:left;padding-top:4px;padding-right:16px}
.year-section-grid{overflow:hidden}
.yd-label{font-family:'EB Garamond',serif;font-style:italic;font-size:18px;color:var(--ink);letter-spacing:0.04em;line-height:1.3;display:block}
.yd-count{font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-mid);font-weight:500;display:block;margin-top:3px}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
@media(max-width:1200px){.grid{grid-template-columns:repeat(8,1fr)}}
@media(max-width:900px){.grid{grid-template-columns:repeat(6,1fr)}}
.card{position:relative;overflow:hidden;cursor:pointer;background:rgba(0,0,0,0.04);aspect-ratio:3/4;opacity:0;transform:translateY(6px);transition:opacity 0.35s ease,transform 0.4s cubic-bezier(0.16,1,0.3,1)}
.card.revealed{opacity:1;transform:translateY(0)}
.card img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;filter:blur(3px);transition:opacity 0.5s ease,filter 0.6s ease,transform 0.35s ease;position:absolute;inset:0}
.card img.loaded{opacity:1;filter:blur(0)}
.card:hover img{transform:scale(1.05)}
.card-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(26,26,24,0.6) 0%,transparent 50%);opacity:0;transition:opacity 0.22s ease;display:flex;flex-direction:column;justify-content:flex-end;padding:7px 8px}
.card:hover .card-overlay{opacity:1}
.card-title{font-family:'EB Garamond',serif;font-style:italic;font-size:10px;color:#fff;line-height:1.3;margin-bottom:1px}
.card-meta{font-size:6.5px;letter-spacing:0.08em;color:rgba(255,255,255,0.5);text-transform:uppercase}
.card-skeleton{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,0.04) 25%,rgba(0,0,0,0.07) 50%,rgba(0,0,0,0.04) 75%);background-size:200% 100%;animation:cardShimmer 1.4s ease infinite}
@keyframes cardShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.load-sentinel{height:1px}
.loading-msg{padding:40px;text-align:center;font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-dim)}

/* ── PC 모달 ── */
.modal-bg{position:fixed;inset:0;background:rgba(26,26,24,0.78);z-index:500;opacity:0;pointer-events:none;transition:opacity 0.3s ease;display:flex;align-items:center;justify-content:center;padding:24px}
.modal-bg.open{opacity:1;pointer-events:all}
.modal{background:var(--white);max-width:980px;width:100%;max-height:90vh;display:flex;overflow:hidden;transform:translateY(16px) scale(0.976);transition:transform 0.34s cubic-bezier(0.16,1,0.3,1);position:relative}
.modal-bg.open .modal{transform:translateY(0) scale(1)}
.modal-img-area{flex:1;min-width:0;background:#f7f6f3;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:24px}
.modal-img-area img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;transition:opacity 0.3s ease}
.modal-panel{width:260px;flex-shrink:0;padding:38px 26px 28px;display:flex;flex-direction:column;overflow-y:auto}
.modal-x{position:absolute;top:16px;right:18px;font-size:20px;line-height:1;color:var(--ink-dim);cursor:pointer;background:none;border:none;font-family:serif;transition:color 0.15s}
.modal-x:hover{color:var(--ink)}
.m-title{font-family:'EB Garamond',serif;font-style:italic;font-size:20px;color:var(--ink);line-height:1.3;margin-bottom:9px}
.m-meta{font-size:8px;letter-spacing:0.14em;color:var(--ink-dim);text-transform:uppercase;margin-bottom:3px}
.m-rule{width:20px;height:0.5px;background:rgba(0,0,0,0.13);margin:16px 0}
.m-desc{font-size:11px;line-height:1.9;color:var(--ink-mid);word-break:keep-all;flex:1}
.m-tags{margin-top:20px;display:flex;flex-wrap:wrap;gap:4px}
.m-tag{font-size:7.5px;letter-spacing:0.05em;padding:3px 8px;border-radius:20px;color:var(--ink-dim)}
.modal-arr{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.1);backdrop-filter:blur(6px);border:none;color:#fff;font-size:22px;width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.2s;font-family:serif}
.modal-arr:hover{background:rgba(255,255,255,0.22)}
.arr-prev{left:12px}
.arr-next{right:calc(260px + 12px)}
.m-year-bar{display:none}

/* ── 모바일 ── */
@media(max-width:600px){
  html,body{overflow:auto;height:auto}
  .layout{position:static;margin-top:var(--nav-h);height:auto;display:block}
  .year-bar{display:none}
  .body-row{display:block;overflow:visible;height:auto;position:static}
  .preview-zone{display:none !important}
  .m-year-bar{
    display:flex !important;
    align-items:center;
    padding:8px 12px;
    border-bottom:0.5px solid rgba(0,0,0,0.08);
    background:var(--bg);
    position:sticky;
    top:var(--nav-h);
    z-index:100;
    overflow-x:auto;
    scrollbar-width:none;
    gap:0;
  }
  .m-year-bar::-webkit-scrollbar{display:none}
  .m-yr-active{font-family:'EB Garamond',serif;font-style:italic;font-size:26px;color:var(--ink);line-height:1;margin-right:16px;flex-shrink:0;cursor:default}
  .m-yr-sep{width:0.5px;height:16px;background:rgba(0,0,0,0.15);margin-right:14px;flex-shrink:0}
  .m-yr-list{display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none}
  .m-yr-list::-webkit-scrollbar{display:none}
  .m-yr-item{padding:3px 7px;font-size:11px;color:var(--ink-dim);cursor:pointer;font-family:'Cormorant Garamond',serif;transition:color 0.15s;white-space:nowrap;flex-shrink:0}
  .m-yr-item:hover{color:var(--ink)}
  .m-yr-item.checked{color:var(--ink);font-weight:500}
  .grid-zone{position:static;opacity:1 !important;pointer-events:all;padding:8px 24px 120px;display:block !important;transition:filter 0.3s ease}
  .grid{display:block;column-count:2;column-gap:5px}
  .year-divider{display:none}
  .card{aspect-ratio:unset;background:rgba(0,0,0,0.04);display:inline-block;width:100%;break-inside:avoid;margin-bottom:5px}
  .card img{position:static;width:100%;height:auto;display:block;filter:none}
  .card img.loaded{filter:none}
  .card:hover img{transform:none}
  .card-overlay{display:none}
  .load-sentinel{column-span:all}
  .modal-bg{display:none !important}
  body.sheet-open .grid-zone{filter:blur(3px)}
  .bs-sheet{position:fixed;left:0;right:0;bottom:0;z-index:600;background:var(--white);border-radius:16px 16px 0 0;transform:translateY(100%);transition:transform 0.38s cubic-bezier(0.16,1,0.3,1);will-change:transform;overflow-y:auto;max-height:92vh}
  .bs-sheet.half{transform:translateY(8%)}
  .bs-sheet.full{transform:translateY(0)}
  .bs-handle-wrap{display:flex;justify-content:center;padding:10px 0 6px;cursor:grab}
  .bs-handle{width:36px;height:4px;border-radius:2px;background:rgba(0,0,0,0.15)}
  .bs-img-area{width:100%;padding:0 20px 12px;display:flex;align-items:center;justify-content:center}
  .bs-img-area img{max-width:100%;max-height:48vh;object-fit:contain;display:block;opacity:0;transition:opacity 0.3s ease}
  .bs-info{padding:0 20px 40px;overflow-y:auto;max-height:none}
  .bs-title{font-family:'EB Garamond',serif;font-style:italic;font-size:20px;color:var(--ink);line-height:1.3;margin-bottom:6px}
  .bs-meta{font-size:8px;letter-spacing:0.14em;color:var(--ink-dim);text-transform:uppercase;margin-bottom:2px}
  .bs-rule{width:20px;height:0.5px;background:rgba(0,0,0,0.13);margin:14px 0}
  .bs-desc{font-size:12px;line-height:1.9;color:var(--ink-mid);word-break:keep-all}
  .bs-tags{margin-top:16px;display:flex;flex-wrap:wrap;gap:4px}
  .bs-tag{font-size:7.5px;letter-spacing:0.05em;padding:3px 8px;border-radius:20px;color:var(--ink-dim);border:0.5px solid rgba(0,0,0,0.1)}
  .bs-close{position:absolute;top:12px;right:14px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,0.07);border:none;font-size:16px;color:var(--ink-dim);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .bs-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.06);border:none;width:36px;height:36px;border-radius:50%;font-size:20px;color:var(--ink-mid);cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:serif}
  .bs-prev{left:10px}
  .bs-next{right:10px}
}
</style>
</head>
<body>
<nav>
  <span class="nav-logo" onclick="go('index')">Won Jeong Cho</span>
  <div class="nav-right">
    <div class="nav-dd" id="navArchive">
      <span class="nav-item active">Archive</span>
      <div class="nav-dd-menu">
        <span class="nav-dd-item" onclick="go('year')" style="color:var(--ink);font-weight:500">Year</span>
        <span class="nav-dd-item" onclick="go('context')">Context</span>
      </div>
    </div>
    <div class="nav-sep"></div>
    <span class="nav-item" onclick="go('text')">Text</span>
    <div class="nav-sep"></div>
    <span class="nav-item" onclick="go('about')">About</span>
  </div>
</nav>

<div class="layout">
  <!-- ★ 상단 가로 연도 바 -->
  <div class="year-bar" id="yearBar">
    <span class="bar-title">Year</span>
    <div class="bar-sep"></div>
    <div class="year-grid" id="yearGrid" style="display:flex;flex-direction:row;gap:0"></div>
  </div>

  <div class="body-row">
    <!-- 모바일 연도 바 -->
    <div class="m-year-bar" id="mYearBar">
      <div class="m-yr-active" id="mYrActive"></div>
      <div class="m-yr-sep"></div>
      <div class="m-yr-list" id="mYrList"></div>
    </div>

    <div class="right-panel" style="flex:1;min-width:0;position:relative;overflow:hidden">
      <div class="preview-zone" id="previewZone">
        <div class="preview-img-wrap">
          <img class="preview-img" id="previewImg" src="" alt="">
          <div class="preview-caption" id="previewCaption">
            <div class="caption-title" id="captionTitle"></div>
            <div class="caption-sen" id="captionSen"></div>
          </div>
          <span class="empty-hint" id="emptyHint" style="display:none">연도를 선택하세요</span>
        </div>
      </div>
      <div class="grid-zone" id="gridZone">
        <div id="gridContainer"></div>
      </div>
    </div>
  </div>
</div>

<!-- PC 모달 -->
<div class="modal-bg" id="modalBg" onclick="bgClose(event)">
  <div class="modal">
    <button class="modal-arr arr-prev" id="arrPrev" onclick="navModal(-1)">‹</button>
    <div class="modal-img-area"><img id="mImg" src="" alt="" style="opacity:0"></div>
    <div class="modal-panel">
      <button class="modal-x" onclick="closeModal()">×</button>
      <div class="m-title" id="mTitle"></div>
      <div class="m-meta" id="mYear"></div>
      <div class="m-meta" id="mMedium"></div>
      <div class="m-meta" id="mDim"></div>
      <div class="m-rule"></div>
      <div class="m-desc" id="mDesc"></div>
      <div class="m-tags" id="mTags"></div>
    </div>
    <button class="modal-arr arr-next" id="arrNext" onclick="navModal(1)">›</button>
  </div>
</div>

<!-- 모바일 바텀시트 -->
<div class="bs-sheet" id="bsSheet">
  <div class="bs-handle-wrap" id="bsHandle"><div class="bs-handle"></div></div>
  <button class="bs-close" onclick="closeSheet()">×</button>
  <button class="bs-nav bs-prev" id="bsPrev" onclick="navSheet(-1)">‹</button>
  <button class="bs-nav bs-next" id="bsNext" onclick="navSheet(1)">›</button>
  <div class="bs-img-area"><img id="bsImg" src="" alt=""></div>
  <div class="bs-info">
    <div class="bs-title" id="bsTitle"></div>
    <div class="bs-meta" id="bsYear"></div>
    <div class="bs-meta" id="bsMedium"></div>
    <div class="bs-meta" id="bsDim"></div>
    <div class="bs-rule"></div>
    <div class="bs-desc" id="bsDesc"></div>
    <div class="bs-tags" id="bsTags"></div>
  </div>
</div>

<script>
var ALL_YEARS=[],selectedYears=[],allFiltered=[],flatFiltered=[],modalIdx=0;
var CHUNK_SIZE=24,chunkSentinel=null,chunkObserver=null,yearRendered={};
var allWorks=[];
var sheetState='closed',dragStartY=0,dragStartState='';

function sel(id){return document.getElementById(id);}
function isMobile(){return window.innerWidth<=600;}
function go(page){window.location.href=page+'.html';}

function initPreview(works){
  var found=null;
  var sorted=works.slice().sort(function(a,b){return(parseInt(b['year']||0))-(parseInt(a['year']||0));});
  for(var i=0;i<sorted.length;i++){if((sorted[i]['page']||'').trim()==='py'){found=sorted[i];break;}}
  var img=sel('previewImg');
  if(!found){img.style.display='none';sel('emptyHint').style.display='block';return;}
  var url=found['full']||found['thumb']||'';
  if(!url){img.style.display='none';sel('emptyHint').style.display='block';return;}
  img.onload=function(){
    img.classList.add('loaded');
    var title=found['title']||'',sen=found['THE']||found['SER']||'';
    if(title)sel('captionTitle').textContent=title;
    if(sen)sel('captionSen').textContent=sen.split(/[,\n]/)[0].trim();
    if(title||sen)sel('previewCaption').classList.add('show');
  };
  img.onerror=function(){
    var m=url.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);
    if(m&&img.src.indexOf('w800')===-1){img.src='https://drive.google.com/thumbnail?id='+m[1]+'&sz=w800';}
    else{img.style.display='none';sel('emptyHint').style.display='block';}
  };
  img.src=url;
}

function buildYearGrid(){
  var grid=sel('yearGrid');
  if(!ALL_YEARS.length){grid.innerHTML='<div style="font-size:8px;color:var(--ink-dim)">연도 없음</div>';return;}
  grid.innerHTML=ALL_YEARS.map(function(yr){
    return '<div class="yr-item" id="yr-'+yr+'" onclick="toggleYear('+yr+',this)"><span class="yr-label">'+yr+'</span></div>';
  }).join('');
  buildMobileYearBar();
}

function buildMobileYearBar(){
  var activeEl=sel('mYrActive'),listEl=sel('mYrList');
  if(!activeEl||!listEl)return;
  var curYr=selectedYears.length?selectedYears[0]:(ALL_YEARS[0]||'');
  activeEl.textContent=curYr;
  listEl.innerHTML='';
  ALL_YEARS.forEach(function(yr){
    if(yr===curYr)return;
    var div=document.createElement('div');
    div.className='m-yr-item';div.id='m-yr-'+yr;div.textContent=yr;
    div.addEventListener('click',function(){toggleYear(yr,sel('yr-'+yr));});
    listEl.appendChild(div);
  });
}

function updateMobileYearBar(){
  var activeEl=sel('mYrActive'),listEl=sel('mYrList');
  if(!activeEl||!listEl)return;
  var curYr=selectedYears.length?selectedYears[0]:(ALL_YEARS[0]||'');
  activeEl.textContent=curYr;
  listEl.innerHTML='';
  ALL_YEARS.forEach(function(yr){
    if(yr===curYr)return;
    var div=document.createElement('div');
    div.className='m-yr-item';div.id='m-yr-'+yr;div.textContent=yr;
    div.addEventListener('click',function(){toggleYear(yr,sel('yr-'+yr));});
    listEl.appendChild(div);
  });
}

function toggleYear(yr,el){
  var already=selectedYears.length===1&&selectedYears[0]===yr;
  ALL_YEARS.forEach(function(y){var e=sel('yr-'+y);if(e)e.classList.remove('checked');});
  if(already){selectedYears=[];}
  else{selectedYears=[yr];if(el)el.classList.add('checked');}
  if(isMobile())updateMobileYearBar();
  fetchAndRender();
}

function fetchAndRender(){
  disconnectChunkObserver();
  if(!selectedYears.length){
    sel('gridZone').classList.remove('open');
    if(!isMobile()){var pz=sel('previewZone');pz.classList.remove('hidden');pz.style.display='';}
    sel('gridContainer').innerHTML='';allFiltered=[];flatFiltered=[];return;
  }
  if(!isMobile())sel('previewZone').classList.add('hidden');
  sel('gridZone').classList.add('open');
  sel('gridContainer').innerHTML='<div class="loading-msg">Loading…</div>';
  var yearsDesc=selectedYears.slice().sort(function(a,b){return b-a;});
  allFiltered=[];flatFiltered=[];
  yearsDesc.forEach(function(yr){
    var rows=allWorks.filter(function(w){return parseInt(w['year']||0)===yr;});
    if(rows.length)allFiltered.push({year:yr,rows:rows});
    rows.forEach(function(r){flatFiltered.push(r);});
  });
  yearRendered={};renderAll();
}

function renderAll(){
  var con=sel('gridContainer');con.innerHTML='';disconnectChunkObserver();
  if(!allFiltered.length){
    con.innerHTML='<div style="padding:60px 0;text-align:center;font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-dim)">No works found</div>';
    return;
  }
  allFiltered.forEach(function(g){
    if(!isMobile()){
      var section=document.createElement('div');section.className='year-section';
      var header=document.createElement('div');header.className='year-section-header';
      header.innerHTML='<span class="yd-label">'+g.year+'</span><span class="yd-count">'+g.rows.length+' works</span>';
      var gridWrap=document.createElement('div');gridWrap.className='year-section-grid';
      var grid=document.createElement('div');grid.className='grid';grid.id='grid-'+g.year;
      gridWrap.appendChild(grid);
      section.appendChild(header);
      section.appendChild(gridWrap);
      con.appendChild(section);
    } else {
      var grid=document.createElement('div');grid.className='grid';grid.id='grid-'+g.year;
      con.appendChild(grid);
    }
    yearRendered[g.year]=0;
  });
  renderNextChunk();
}

function renderNextChunk(){
  var rem=CHUNK_SIZE;
  allFiltered.forEach(function(g){
    if(rem<=0)return;
    var grid=sel('grid-'+g.year);if(!grid)return;
    var start=yearRendered[g.year],end=Math.min(start+rem,g.rows.length);
    for(var i=start;i<end;i++)grid.appendChild(makeCard(g.rows[i],getFlatIndex(g.year,i),i-start));
    rem-=(end-start);yearRendered[g.year]=end;
  });
  if(chunkSentinel)chunkSentinel.remove();chunkSentinel=null;
  if(allFiltered.some(function(g){return yearRendered[g.year]<g.rows.length;})){
    chunkSentinel=document.createElement('div');chunkSentinel.className='load-sentinel';
    sel('gridContainer').appendChild(chunkSentinel);connectChunkObserver();
  }
}

function getFlatIndex(year,rowIdx){
  var off=0;
  for(var i=0;i<allFiltered.length;i++){if(allFiltered[i].year===year)return off+rowIdx;off+=allFiltered[i].rows.length;}
  return off+rowIdx;
}

function connectChunkObserver(){
  if(chunkObserver)chunkObserver.disconnect();
  chunkObserver=new IntersectionObserver(function(entries){
    entries.forEach(function(e){if(!e.isIntersecting)return;chunkObserver.disconnect();chunkObserver=null;renderNextChunk();});
  },{rootMargin:'300px'});
  if(chunkSentinel)chunkObserver.observe(chunkSentinel);
}

function disconnectChunkObserver(){
  if(chunkObserver){chunkObserver.disconnect();chunkObserver=null;}
  if(chunkSentinel){chunkSentinel.remove();chunkSentinel=null;}
}

function makeCard(row,flatIdx,animOffset){
  var card=document.createElement('div');card.className='card';
  var title=row['title']||'',yr=row['year']||'',medium=row['medium']||'',thumb=row['thumb']||'';
  var sk=document.createElement('div');sk.className='card-skeleton';card.appendChild(sk);
  var img=document.createElement('img');img.alt=title;
  img.onload=function(){if(sk.parentNode)sk.parentNode.removeChild(sk);img.classList.add('loaded');};
  img.onerror=function(){if(sk.parentNode)sk.parentNode.removeChild(sk);};
  if(thumb){lazyLoad(img,thumb);}else{img.classList.add('loaded');}
  card.appendChild(img);
  if(!isMobile()){
    var ov=document.createElement('div');ov.className='card-overlay';
    ov.innerHTML='<div class="card-title">'+title+'</div><div class="card-meta">'+yr+(medium?' · '+medium:'')+'</div>';
    card.appendChild(ov);
  }
  (function(idx){card.addEventListener('click',function(){openModal(idx);});})(flatIdx);
  setTimeout(function(){card.classList.add('revealed');},Math.min(animOffset*25,400));
  return card;
}

var imgObserver=new IntersectionObserver(function(entries,obs){
  entries.forEach(function(e){
    if(!e.isIntersecting)return;
    var img=e.target,src=img.dataset.src;obs.unobserve(img);
    img.onerror=function(){var m=src.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);if(m&&this.src.indexOf('w200')===-1){this.src='https://drive.google.com/thumbnail?id='+m[1]+'&sz=w200';}else{this.style.opacity='0.05';this.classList.add('loaded');}};
    img.onload=function(){img.classList.add('loaded');};
    img.src=src;
  });
},{rootMargin:'300px'});

function lazyLoad(img,url){if(!url){img.classList.add('loaded');return;}img.dataset.src=url;imgObserver.observe(img);}

function openModal(idx){
  modalIdx=idx;
  if(isMobile()){openSheet(idx);return;}
  paintModal();
  sel('modalBg').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(){sel('modalBg').classList.remove('open');document.body.style.overflow='';}
function bgClose(e){if(e.target===sel('modalBg'))closeModal();}
function navModal(d){modalIdx=(modalIdx+d+flatFiltered.length)%flatFiltered.length;paintModal();}

function paintModal(){
  var row=flatFiltered[modalIdx];
  var mImg=sel('mImg');mImg.style.opacity='0';
  var fullSrc=row['full']||row['thumb']||'';
  mImg.onload=function(){mImg.style.opacity='1';};
  mImg.onerror=function(){var m=fullSrc.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);if(m&&mImg.src.indexOf('w800')===-1)mImg.src='https://drive.google.com/thumbnail?id='+m[1]+'&sz=w800';};
  mImg.src=fullSrc;
  sel('mTitle').textContent=row['title']||'';
  sel('mYear').textContent=row['year']||'';
  sel('mMedium').textContent=row['medium']||'';
  sel('mDim').textContent=row['dim']||row['dimensions']||'';
  sel('mDesc').textContent=row['desc']||'';
  var tags=[];
  ['THE','SER','MAT','SEN'].forEach(function(k){var v=row[k]||'';v.split(/[,\n]/).forEach(function(t){t=t.trim();if(t)tags.push(t);});});
  sel('mTags').innerHTML=tags.map(function(t){return'<span class="m-tag">'+t+'</span>';}).join('');
  sel('arrPrev').style.display=flatFiltered.length>1?'flex':'none';
  sel('arrNext').style.display=flatFiltered.length>1?'flex':'none';
}

function openSheet(idx){
  modalIdx=idx;paintSheet();
  var sheet=sel('bsSheet');
  sheet.classList.remove('half','full');
  requestAnimationFrame(function(){sheet.classList.add('half');});
  sheetState='half';document.body.classList.add('sheet-open');
}
function closeSheet(){sel('bsSheet').classList.remove('half','full');sheetState='closed';document.body.classList.remove('sheet-open');}
function navSheet(d){modalIdx=(modalIdx+d+flatFiltered.length)%flatFiltered.length;paintSheet();}

function paintSheet(){
  var row=flatFiltered[modalIdx];
  var bsImg=sel('bsImg');bsImg.style.opacity='0';
  var imgUrl=row['full']||row['thumb']||'';
  bsImg.onload=function(){bsImg.style.opacity='1';};
  bsImg.onerror=function(){var m=imgUrl.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);if(m&&bsImg.src.indexOf('w800')===-1){bsImg.src='https://drive.google.com/thumbnail?id='+m[1]+'&sz=w800';}};
  bsImg.src=imgUrl;
  sel('bsTitle').textContent=row['title']||'';
  sel('bsYear').textContent=row['year']||'';
  sel('bsMedium').textContent=row['medium']||'';
  sel('bsDim').textContent=row['dim']||row['dimensions']||'';
  sel('bsDesc').textContent=row['desc']||'';
  var tags=[];
  ['THE','SER','MAT','SEN'].forEach(function(k){var v=row[k]||'';v.split(/[,\n]/).forEach(function(t){t=t.trim();if(t)tags.push(t);});});
  sel('bsTags').innerHTML=tags.map(function(t){return'<span class="bs-tag">'+t+'</span>';}).join('');
  var showNav=flatFiltered.length>1;
  sel('bsPrev').style.display=showNav?'flex':'none';
  sel('bsNext').style.display=showNav?'flex':'none';
}

(function(){
  var handle=sel('bsHandle'),sheet=sel('bsSheet');
  if(!handle||!sheet)return;
  function onStart(e){dragStartY=e.touches?e.touches[0].clientY:e.clientY;dragStartState=sheetState;document.addEventListener('touchmove',onMove,{passive:false});document.addEventListener('touchend',onEnd);document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onEnd);}
  function onMove(e){e.preventDefault();var y=e.touches?e.touches[0].clientY:e.clientY,dy=y-dragStartY;if(dy<-60){sheet.classList.remove('half');sheet.classList.add('full');sheetState='full';}else if(dy>60&&dragStartState==='full'){sheet.classList.remove('full');sheet.classList.add('half');sheetState='half';}else if(dy>100&&dragStartState==='half'){closeSheet();}}
  function onEnd(){document.removeEventListener('touchmove',onMove);document.removeEventListener('touchend',onEnd);document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onEnd);}
  handle.addEventListener('touchstart',onStart,{passive:true});
  handle.addEventListener('mousedown',onStart);
})();

document.addEventListener('keydown',function(e){
  if(sheetState!=='closed'){if(e.key==='Escape')closeSheet();if(e.key==='ArrowLeft')navSheet(-1);if(e.key==='ArrowRight')navSheet(1);return;}
  if(!sel('modalBg').classList.contains('open'))return;
  if(e.key==='Escape')closeModal();if(e.key==='ArrowLeft')navModal(-1);if(e.key==='ArrowRight')navModal(1);
});

document.querySelectorAll('.nav-dd').forEach(function(dd){
  var menu=dd.querySelector('.nav-dd-menu'),timer;
  dd.addEventListener('mouseenter',function(){clearTimeout(timer);menu.style.display='block';});
  dd.addEventListener('mouseleave',function(){timer=setTimeout(function(){menu.style.display='none';},150);});
  menu.addEventListener('mouseenter',function(){clearTimeout(timer);});
  menu.addEventListener('mouseleave',function(){timer=setTimeout(function(){menu.style.display='none';},150);});
  dd.querySelector('.nav-item').addEventListener('click',function(e){
    e.stopPropagation();
    var isOpen=menu.style.display==='block';
    document.querySelectorAll('.nav-dd-menu').forEach(function(m){m.style.display='none';});
    if(!isOpen)menu.style.display='block';
  });
});
document.addEventListener('click',function(e){
  if(!e.target.closest||!e.target.closest('.nav-dd'))
    document.querySelectorAll('.nav-dd-menu').forEach(function(m){m.style.display='none';});
});

fetch('./data/works.json')
  .then(function(r){return r.json();})
  .then(function(works){
    allWorks=works;
    var yearSet={};
    works.forEach(function(w){var y=parseInt(w['year']||0);if(y)yearSet[y]=1;});
    ALL_YEARS=Object.keys(yearSet).map(Number).sort(function(a,b){return b-a;});
    buildYearGrid();
    if(isMobile()){
      if(ALL_YEARS.length){
        selectedYears=[ALL_YEARS[0]];
        var el=sel('yr-'+ALL_YEARS[0]);
        if(el)el.classList.add('checked');
        updateMobileYearBar();
        fetchAndRender();
      }
    } else {
      initPreview(works);
    }
  })
  .catch(function(){
    sel('yearGrid').innerHTML='<div style="font-size:8px;color:var(--ink-dim)">로딩 오류</div>';
  });
</script>
</body>
</html>
