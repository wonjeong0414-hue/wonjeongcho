 <!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About — WON JEONG CHO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:wght@300;400&display=swap" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:wght@300;400&display=swap"></noscript>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1a1a18;--ink-mid:#4a4a47;--ink-dim:#7a7a74;
  --bg:#f7f6f3;--white:#fff;
  --nav-h:50px;--lang-h:44px;--max-w:960px;--pad:48px;
}
html{background:var(--bg);scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
body{background:var(--bg);font-family:'Cormorant Garamond',serif;color:var(--ink);min-height:100vh}

/* ── nav ── */
nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 36px;z-index:200;background:var(--bg);border-bottom:.5px solid rgba(26,26,24,.07)}
.nav-logo{font-weight:300;font-size:13px;letter-spacing:.3em;color:var(--ink);text-transform:uppercase;cursor:pointer;transition:opacity .2s}
.nav-logo:hover{opacity:.45}
.nav-right{display:flex;align-items:center}
.nav-item{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-dim);padding:5px 11px;cursor:pointer;text-decoration:none;transition:color .25s;white-space:nowrap;position:relative}
.nav-item::after{content:'';position:absolute;bottom:0;left:11px;right:11px;height:.5px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .28s cubic-bezier(.16,1,.3,1);opacity:.5}
.nav-item:hover{color:var(--ink)}
.nav-item:hover::after,.nav-item.active::after{transform:scaleX(1)}
.nav-item.active{color:var(--ink)}
.nav-sep{width:.5px;height:12px;background:rgba(0,0,0,.12);margin:0 5px;flex-shrink:0}
.nav-dd{position:relative;display:flex;align-items:center}
.nav-dd-menu{display:none;position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--white);border-radius:4px;padding:4px 0;min-width:80px;z-index:300;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.nav-dd-item{display:block;font-size:9px;letter-spacing:.08em;color:var(--ink-mid);padding:5px 14px;cursor:pointer;transition:color .15s,background .15s;white-space:nowrap;text-transform:uppercase}
.nav-dd-item:hover{color:var(--ink);background:rgba(0,0,0,.03)}

/* ── lang bar ── */
.lang-bar{position:fixed;top:var(--nav-h);left:0;right:0;height:var(--lang-h);display:flex;align-items:center;justify-content:flex-end;padding:0 36px;background:var(--bg);border-bottom:.5px solid rgba(26,26,24,.07);z-index:190}
.lang-toggle{display:flex;border:.5px solid rgba(26,26,24,.2);border-radius:2px;overflow:hidden}
.lang-btn{font-size:8px;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;cursor:pointer;background:transparent;color:var(--ink-dim);border:none;transition:background .15s,color .15s;font-family:'Cormorant Garamond',serif}
.lang-btn.active{background:rgba(26,26,24,.62);color:var(--bg)}
.lang-btn:not(.active):hover{color:var(--ink)}

/* ── page wrap ── */
.page-wrap{max-width:var(--max-w);margin:0 auto;padding:calc(var(--nav-h) + var(--lang-h) + 40px) var(--pad) 100px}

/* ── Bio ── */
.bio-section{margin-bottom:40px}
.bio-text{font-family:'EB Garamond',serif;color:#2a2a27;word-break:keep-all}
.bio-title{font-size:15px;font-weight:500;line-height:1.7;margin-bottom:1em;letter-spacing:.01em}
.bio-body{font-size:13px;line-height:2.0;color:var(--ink-mid);text-align:justify}
.bio-body p{margin-bottom:1.2em}
.bio-body p:last-child{margin-bottom:0}

/* ── CV 요약 ── */
.cv-summary-section{margin-bottom:48px}
.cv-summary{font-family:'EB Garamond',serif;font-size:13px;line-height:2.0;color:var(--ink-mid);word-break:keep-all;text-align:justify}
.cv-summary p{margin-bottom:1em}
.cv-summary p:last-child{margin-bottom:0}

/* ── Artist Statement ── */
.stmt-section{margin-bottom:36px}
.stmt-header-row{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.stmt-lbl{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-dim)}
.stmt-pdf{font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);text-decoration:none;transition:color .15s}
.stmt-pdf:hover{color:var(--ink)}
.stmt-body{font-family:'EB Garamond',serif;font-size:13px;line-height:2.0;color:var(--ink-mid);text-align:justify;word-break:keep-all;white-space:pre-wrap}

/* ── 구분선 ── */
.sec-divider{width:100%;height:.5px;background:rgba(26,26,24,.1);margin:0 0 40px}

/* ── 메인 그리드 ── */
.main-grid{display:grid;grid-template-columns:200px minmax(0,520px);gap:0 48px;align-items:start}

/* ── 좌측 ── */
.left-col{padding-top:2px}
.left-section{margin-bottom:36px}
.left-label{font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:12px}
.left-item{font-family:'EB Garamond',serif;font-size:12px;line-height:1.65;color:var(--ink-mid);padding:4px 0;border-bottom:.5px solid rgba(26,26,24,.06)}
.left-item:last-child{border-bottom:none}

/* ── 우측 전시 영역 ── */
.right-col{}

/* 현재연도 헤더 행 */
.latest-header-row{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;padding-bottom:8px;
  border-bottom:.5px solid rgba(26,26,24,.08);
}
.latest-year-label{
  font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-dim);
}

/* 테이블 헤더 */
.latest-table-head{
  display:grid;
  grid-template-columns:62px 1fr 110px 100px;
  gap:0 8px;
  padding:0 0 5px;
  border-bottom:.5px solid rgba(26,26,24,.1);
  margin-bottom:0;
}
.latest-th{font-size:7.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim)}

/* 리스트 공통 행 — compact */
.latest-row{
  display:grid;
  grid-template-columns:62px minmax(0,1fr) 160px 100px;
  gap:0 8px;
  padding:4px 0;
  border-bottom:.5px solid rgba(26,26,24,.04);
  font-family:'EB Garamond',serif;
  font-size:12px;line-height:1.55;color:var(--ink);
  align-items:baseline;
}
.latest-row:last-child{border-bottom:none}
.latest-cell-type{font-size:10px;color:var(--ink-dim);white-space:nowrap}
.latest-cell-title{color:var(--ink)}
.latest-cell-place{font-size:10.5px;color:var(--ink-mid)}
.latest-cell-date{font-size:10px;color:var(--ink-dim);letter-spacing:.01em}

/* 행 목록 래퍼 */
.latest-rows-wrap{overflow:visible}
.panel-row{
  display:grid;
  grid-template-columns:36px minmax(0,1fr) 160px;
  gap:0 8px;
  padding:3px 0;
  border-bottom:.5px solid rgba(26,26,24,.04);
  font-family:'EB Garamond',serif;
  font-size:12px;line-height:1.55;
  align-items:baseline;
}
.panel-row:last-child{border-bottom:none}
.panel-year{font-size:10px;color:var(--ink-dim);letter-spacing:.03em}
.panel-title{color:var(--ink)}
.panel-place{font-size:10.5px;color:var(--ink-mid);text-align:left}

/* ── 네비바 + 전체리스트 블록 ── */
.full-list-divider{display:none}
.full-list-block{
  margin-top:20px;
  border-top:.5px solid rgba(26,26,24,.1);
}
.full-list-wrap{
  display:flex;align-items:center;
  padding:10px 0;
  border-bottom:.5px solid rgba(26,26,24,.07);
  gap:0;
}
/* "전시 전체 리스트" 레이블 */
.full-list-label{
  font-size:8px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink);font-weight:600;
  white-space:nowrap;flex-shrink:0;
}
/* 세로 구분선 */
.full-list-sep{
  width:.5px;height:10px;
  background:rgba(26,26,24,.25);
  margin:0 14px;flex-shrink:0;
}
/* 탭 */
.cv-tabs{display:flex;gap:0;align-items:center;flex:1}
.cv-tab{
  font-size:8px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-dim);padding:2px 12px 2px 0;
  cursor:pointer;transition:color .2s;white-space:nowrap;
}
.cv-tab:hover{color:var(--ink-mid)}
.cv-tab.active{color:var(--ink);font-weight:700;letter-spacing:.13em;font-size:8.5px}
.cv-panel{display:none}
/* ← 현재 연도 버튼 */
.back-btn{
  display:none;font-size:7.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-dim);cursor:pointer;white-space:nowrap;
  border:.5px solid rgba(26,26,24,.2);border-radius:2px;
  padding:2px 8px;background:transparent;
  font-family:'Cormorant Garamond',serif;
  transition:color .15s,border-color .15s;margin-left:auto;
}
.back-btn:hover{color:var(--ink);border-color:rgba(26,26,24,.4)}
.back-btn.visible{display:inline-block}

/* 전체리스트 내용 영역 */
.full-list-rows{margin-top:4px}

/* ── footer ── */
.cv-footer{
  margin-top:56px;padding-top:28px;
  border-top:.5px solid rgba(26,26,24,.1);
  display:flex;justify-content:space-between;align-items:center;
  flex-wrap:wrap;gap:20px;
}
.cv-pdf-link{display:inline-flex;align-items:center;gap:7px;font-family:'Cormorant Garamond',serif;font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--bg);text-decoration:none;background:rgba(26,26,24,.55);padding:4px 12px 4px 10px;border-radius:2px;transition:background .2s}
.cv-pdf-link:hover{background:rgba(26,26,24,.75)}
.social-links{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.social-link{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mid);padding:4px 10px;border:.5px solid rgba(26,26,24,.22);border-radius:2px;background:transparent;transition:color .2s,border-color .2s,background .2s}
.social-link:hover{color:var(--ink);border-color:rgba(26,26,24,.45);background:rgba(26,26,24,.05)}
.social-link svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;opacity:.7}

.latest-cell-title-wrap{display:contents} /* 데스크탑: 기존 동작 유지 */
.latest-cell-sub{display:none} /* 데스크탑: 숨김 */
.place-sep{color:var(--ink-dim);opacity:.5;font-size:9px}
.place-city{font-size:10px;color:var(--ink-dim)}

.loading{padding:60px 0;text-align:center;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-dim)}

/* ════════════════════════════
   모바일 (≤600px)
════════════════════════════ */
@media(max-width:600px){
  :root{--pad:0px;--lang-h:40px}
  nav{padding:0 16px}
  .lang-bar{padding:0 16px}

  html,body{overflow:hidden !important;height:100% !important}

  .page-wrap{
    position:fixed;
    top:calc(var(--nav-h) + var(--lang-h));
    left:0;right:0;bottom:0;
    display:flex;flex-direction:column;
    overflow:hidden;padding:0;max-width:100%;margin:0;
  }

  /* ── Bio 접기/펼치기 ── */
  .bio-cv-wrap{
    flex-shrink:0;overflow:hidden;
    max-height:36px;
    transition:max-height .35s ease;
    border-bottom:.5px solid rgba(26,26,24,.08);
  }
  .bio-cv-wrap.expanded{max-height:60vh;overflow-y:auto}
  .bio-cv-wrap::-webkit-scrollbar{display:none}
  .bio-mini-bar{
    display:flex;align-items:center;justify-content:space-between;
    padding:9px 16px;
    font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-dim);
  }
  .bio-mini-arrow{font-size:8px;transition:transform .3s;display:inline-block;opacity:.6}
  .bio-cv-wrap.expanded .bio-mini-arrow{transform:rotate(180deg)}
  .bio-section{padding:0 16px 12px;margin-bottom:0}
  .bio-title{font-size:12.5px;margin-bottom:.7em}
  .bio-body{font-size:11px;line-height:1.7}
  .cv-summary-section{padding:0 16px 12px}
  .cv-summary{font-size:11px;line-height:1.7}
  .stmt-section{padding:0 16px 12px}

  .sec-divider{display:none}

  /* ── main-grid → 세로 flex ── */
  .main-grid{
    flex:1;display:flex;flex-direction:column;
    min-height:0;overflow:hidden;
    grid-template-columns:1fr;gap:0;padding:0;
  }
  .left-col{display:none}

  /* ── right-col: 전체 스크롤 ── */
  .right-col{
    flex:1;display:flex;flex-direction:column;
    min-height:0;overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .right-col::-webkit-scrollbar{display:none}

  /* 현재연도 헤더 */
  .latest-header-row{
    padding:8px 16px 6px;margin-bottom:0;
    border-bottom:.5px solid rgba(26,26,24,.07);
    border-top:.5px solid rgba(26,26,24,.06);
    position:sticky;top:0;background:var(--bg);z-index:10;
  }
  .latest-year-label{font-size:8px;letter-spacing:.2em}

  /* 테이블 헤더 숨김 */
  .latest-table-head{display:none}

  /* 현재연도 리스트 */
  .latest-rows-wrap{padding:0 16px 8px}
  .latest-row{
    grid-template-columns:46px 1fr;
    gap:0 8px;padding:6px 0;font-size:12px;
    align-items:start;
  }
  .latest-cell-type{font-size:9.5px;padding-top:1px}
  .latest-cell-title-wrap{display:flex;flex-direction:column;gap:2px}
  .latest-cell-title{color:var(--ink);line-height:1.5}
  .latest-cell-sub{display:block;font-size:9.5px;color:var(--ink-dim);line-height:1.4}
  /* 모바일: 장소+날짜 컬럼 숨김 (서브라인으로 대체) */
  .latest-cell-place,.latest-cell-date{display:none}

  /* 전체리스트 블록 */
  .full-list-block{
    margin-top:4px;
    border-top:.5px solid rgba(26,26,24,.1);
    flex-shrink:0;
  }
  .full-list-wrap{
    display:flex;align-items:center;
    padding:7px 16px;
    border-bottom:.5px solid rgba(26,26,24,.07);
    gap:0;overflow:hidden;
    position:sticky;bottom:0;background:var(--bg);z-index:10;
  }
  .full-list-label{
    font-size:7px;letter-spacing:.16em;
    flex-shrink:0;white-space:nowrap;font-weight:600;
  }
  .full-list-sep{width:.5px;height:8px;margin:0 8px;background:rgba(26,26,24,.25)}
  .cv-tabs{display:flex;flex:1;gap:0;align-items:center;overflow:hidden}
  .cv-tab{
    font-size:7px;letter-spacing:.05em;
    padding:0 7px 0 0;flex-shrink:0;white-space:nowrap;
  }
  .cv-tab.active{font-size:7.5px;font-weight:700;letter-spacing:.03em}
  .back-btn{font-size:6.5px;padding:1px 5px;margin-left:auto;flex-shrink:0}

  /* 전체리스트 행 */
  .full-list-rows{padding:4px 16px 32px}
  .panel-row{
    grid-template-columns:28px 1fr;
    gap:0 8px;padding:5px 0;font-size:12px;align-items:start;
  }
  .panel-year{font-size:9.5px;padding-top:1px}
  .panel-title{line-height:1.5}
  .panel-place{
    display:block;
    grid-column:2;
    font-size:10px;color:var(--ink-dim);
    margin-top:1px;
  }
  .place-city{font-size:9.5px}

  .cv-footer{display:none}
}

@media(max-width:480px){
  .nav-logo{font-size:10px;letter-spacing:.18em}
  .nav-item{font-size:8px;padding:5px 6px}
  .nav-sep{margin:0 1px}
}
</style>
</head>
<body>
<nav>
  <span class="nav-logo" onclick="go('index')">Won Jeong Cho</span>
  <div class="nav-right">
    <div class="nav-dd">
      <span class="nav-item">Archive</span>
      <div class="nav-dd-menu">
        <span class="nav-dd-item" onclick="go('year')">Year</span>
        <span class="nav-dd-item" onclick="go('context')">Context</span>
      </div>
    </div>
    <div class="nav-sep"></div>
    <span class="nav-item" onclick="go('text')">Text</span>
    <div class="nav-sep"></div>
    <span class="nav-item active">About</span>
  </div>
</nav>

<div class="lang-bar">
  <div class="lang-toggle">
    <button class="lang-btn active" id="btnKo" onclick="setLang('ko')">한국어</button>
    <button class="lang-btn" id="btnEn" onclick="setLang('en')">English</button>
  </div>
</div>

<div class="page-wrap">

  <!-- Bio + CV요약 묶음 -->
  <div class="bio-cv-wrap" id="bioCvWrap">
    <!-- 모바일 미니바 (클릭으로 펼침) -->
    <div class="bio-mini-bar" id="bioMiniBar" onclick="toggleBio()">
      <span id="bioMiniLabel">조원정 · Artist Bio</span>
      <span class="bio-mini-arrow">∨</span>
    </div>

    <div class="bio-section" id="bioSection"></div>

    <div class="stmt-section" id="stmtSection" style="display:none">
      <div class="stmt-header-row">
        <span class="stmt-lbl">Artist Statement</span>
        <a class="stmt-pdf" id="stmtPdfLink" href="#" target="_blank" style="display:none">PDF ↗</a>
      </div>
      <div class="stmt-body" id="stmtBody"></div>
    </div>

    <div class="cv-summary-section" id="cvSummarySection" style="display:none"></div>
  </div>

  <div class="sec-divider"></div>

  <!-- 메인: 좌(학력+소장인) / 우(CV 리스트) -->
  <div class="main-grid" id="mainGrid">

    <!-- 좌측 -->
    <div class="left-col">
      <div class="left-section">
        <div class="left-label" id="labelEdu">학력</div>
        <div id="edu1" class="left-item"></div>
        <div id="edu2" class="left-item"></div>
      </div>
      <div class="left-section">
        <div class="left-label" id="labelColl">주요 작품 소장인</div>
        <div id="collSection"></div>
      </div>
    </div>

    <!-- 우측 -->
    <div class="right-col">

      <!-- 현재연도 리스트 (기본 표시, 탭 클릭 시 숨김) -->
      <div class="latest-section" id="latestSection">
        <div class="latest-header-row">
          <span class="latest-year-label" id="latestYearLabel">2026년 전시</span>
        </div>
        <div class="latest-table-head" id="latestTableHead">
          <span class="latest-th" id="thType">구분</span>
          <span class="latest-th" id="thTitle">제목</span>
          <span class="latest-th" id="thPlace">장소</span>
          <span class="latest-th" id="thDate">날짜</span>
        </div>
        <div class="latest-rows-wrap">
          <div id="latestRows"><div class="loading">Loading…</div></div>
        </div>
      </div>

      <!-- 네비 바 + 전체리스트 영역 -->
      <div class="full-list-block" id="fullListBlock">
        <div class="full-list-wrap">
          <span class="full-list-label" id="labelFullList">전시 전체 리스트</span>
          <div class="full-list-sep"></div>
          <div class="cv-tabs">
            <div class="cv-tab" id="tabSolo"  onclick="setCvTab('solo')"><span id="labelSolo">개인 및 초대전</span></div>
            <div class="cv-tab" id="tabGroup" onclick="setCvTab('group')"><span id="labelGroup">단체전</span></div>
            <div class="cv-tab" id="tabFair"  onclick="setCvTab('fair')">Art Fair</div>
          </div>
          <button class="back-btn" id="backBtn" onclick="showLatestYear()">← 현재 연도</button>
        </div>
        <!-- 전체리스트 내용 (탭 클릭 시 표시) -->
        <div class="full-list-rows" id="fullListRows" style="display:none"></div>
      </div>

      <div style="display:none" id="panelSolo"></div>
      <div style="display:none" id="panelGroup"></div>
      <div style="display:none" id="panelFair"></div>

    </div><!-- /right-col -->
  </div><!-- /main-grid -->

  <!-- footer -->
  <div class="cv-footer">
    <a class="cv-pdf-link" id="pdfLink" href="#" target="_blank" style="display:none">
      <svg width="10" height="12" viewBox="0 0 10 12" fill="none"><rect x=".5" y=".5" width="9" height="11" rx="1" stroke="currentColor" stroke-width=".8"/><line x1="2" y1="4" x2="8" y2="4" stroke="currentColor" stroke-width=".8"/><line x1="2" y1="6" x2="8" y2="6" stroke="currentColor" stroke-width=".8"/><line x1="2" y1="8" x2="5.5" y2="8" stroke="currentColor" stroke-width=".8"/></svg>
      <span id="pdfLabel">CV Download</span>
    </a>
    <div class="social-links">
      <a class="social-link" href="mailto:wonjeong.cho@gmail.com">
        <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,4 12,14 22,4"/></svg>Email
      </a>
      <a class="social-link" href="https://www.instagram.com/wonjeong.cho/" target="_blank">
        <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r=".5" fill="currentColor" stroke="none"/></svg>Instagram
      </a>
      <a class="social-link" href="https://www.saatchiart.com/en-kr/chowonjeong" target="_blank">
        <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>Saatchi Art
      </a>
    </div>
  </div>
</div>

<script>
var D=null, lang='ko', activeTab=null, latestYear=null;

function go(p){window.location.href=p+'.html';}

/* nav dropdown */
document.querySelectorAll('.nav-dd').forEach(function(dd){
  var menu=dd.querySelector('.nav-dd-menu'),timer;
  dd.addEventListener('mouseenter',function(){clearTimeout(timer);menu.style.display='block';});
  dd.addEventListener('mouseleave',function(){timer=setTimeout(function(){menu.style.display='none';},150);});
  menu.addEventListener('mouseenter',function(){clearTimeout(timer);});
  menu.addEventListener('mouseleave',function(){timer=setTimeout(function(){menu.style.display='none';},150);});
});

/* Bio 토글 (모바일) */
function toggleBio(){
  document.getElementById('bioCvWrap').classList.toggle('expanded');
}

/* 언어 전환 */
function setLang(l){
  lang=l;
  document.getElementById('btnKo').classList.toggle('active',l==='ko');
  document.getElementById('btnEn').classList.toggle('active',l==='en');
  if(D) render();
}

/* ── 탭 클릭: 현재연도 숨기고 전체리스트 표시 ── */
function setCvTab(t){
  activeTab=t;
  ['solo','group','fair'].forEach(function(k){
    var el=document.getElementById('tab'+k.charAt(0).toUpperCase()+k.slice(1));
    if(el) el.classList.toggle('active', k===t);
  });
  document.getElementById('backBtn').classList.add('visible');
  /* 현재연도 섹션 숨김 */
  document.getElementById('latestSection').style.display='none';
  /* 전체리스트 표시 */
  document.getElementById('fullListRows').style.display='block';
  renderFullList();
}

/* ← 현재 연도: 현재연도 뷰 복귀 */
function showLatestYear(){
  activeTab=null;
  ['Solo','Group','Fair'].forEach(function(n){
    var el=document.getElementById('tab'+n);
    if(el) el.classList.remove('active');
  });
  document.getElementById('backBtn').classList.remove('visible');
  /* 현재연도 섹션 다시 표시 */
  document.getElementById('latestSection').style.display='';
  /* 전체리스트 숨김 */
  document.getElementById('fullListRows').style.display='none';
}

/* ── 전체리스트 렌더 ── */
function renderFullList(){
  if(!D||!activeTab) return;
  var ko=(lang==='ko');
  var src={solo:D.solo||[], group:D.group||[], fair:D.fair||[]};
  var list=src[activeTab]||[];
  var el=document.getElementById('fullListRows');
  if(!list.length){
    el.innerHTML='<div style="font-size:11px;color:var(--ink-dim);padding:8px 0">—</div>';
    return;
  }
  el.innerHTML=list.map(function(item){
    var t=ko?(item.ko||''):(item.en||item.ko||'');
    var p=ko?(item.placeKo||''):(item.placeEn||item.placeKo||'');
    var c=ko?(item.cityKo||''):(item.cityEn||item.cityKo||'');
    if(!t) return '';
    var placeHtml=p?('<span class="place-name">'+p+'</span>'+(c?'<span class="place-sep"> · </span><span class="place-city">'+c+'</span>':'')):(c||'');
    return '<div class="panel-row">'
      +'<div class="panel-year">'+(item.year||'')+'</div>'
      +'<div class="panel-title">'+t+'</div>'
      +'<div class="panel-place">'+placeHtml+'</div>'
      +'</div>';
  }).join('');
}

/* ── 현재연도 렌더 ── */
function renderMainArea(){
  if(!D) return;
  var ko=(lang==='ko');
  var labelEl=document.getElementById('latestYearLabel');
  var headEl=document.getElementById('latestTableHead');
  var rowsEl=document.getElementById('latestRows');

  labelEl.textContent=latestYear
    ? (ko ? latestYear+'년 전시' : latestYear+' Exhibitions')
    : (ko ? '최근 전시' : 'Recent Exhibitions');
  if(headEl) headEl.style.display='';

  var typeL={solo:ko?'개인·초대':'Solo', group:ko?'단체전':'Group', fair:'Art Fair'};
  var allItems=[]
    .concat((D.solo||[]).map(function(i){return Object.assign({},i,{_t:'solo'});}))
    .concat((D.group||[]).map(function(i){return Object.assign({},i,{_t:'group'});}))
    .concat((D.fair||[]).map(function(i){return Object.assign({},i,{_t:'fair'});}));
  var filtered=latestYear
    ? allItems.filter(function(i){return String(i.year)===String(latestYear);})
    : [];
  if(!filtered.length){
    rowsEl.innerHTML='<div style="font-size:11px;color:var(--ink-dim);padding:8px 0">—</div>';
    return;
  }
  rowsEl.innerHTML=filtered.map(function(item){
    var t=ko?(item.ko||''):(item.en||item.ko||'');
    var p=ko?(item.placeKo||''):(item.placeEn||item.placeKo||'');
    var c=ko?(item.cityKo||''):(item.cityEn||item.cityKo||'');
    var placeHtml=p?('<span class="place-name">'+p+'</span>'+(c?'<span class="place-sep"> · </span><span class="place-city">'+c+'</span>':'')):(c||'');
    var subLine=placeHtml?'<div class="latest-cell-sub">'+placeHtml+'</div>':'';
    return '<div class="latest-row">'
      +'<div class="latest-cell-type">'+(typeL[item._t]||'')+'</div>'
      +'<div class="latest-cell-title-wrap">'
        +'<div class="latest-cell-title">'+t+'</div>'
        +subLine
      +'</div>'
      +'<div class="latest-cell-place">'+placeHtml+'</div>'
      +'<div class="latest-cell-date">'+(item.date||'')+'</div>'
      +'</div>';
  }).join('');

  /* 언어 전환 시 탭 뷰 상태 유지 */
  if(activeTab){
    document.getElementById('latestSection').style.display='none';
    document.getElementById('fullListRows').style.display='block';
    renderFullList();
  }
}

/* ── Bio 렌더 ── */
function renderBio(text){
  if(!text) return '<div class="bio-text"><div class="bio-body"><p>—</p></div></div>';
  var lines=text.split(/\n/).map(function(l){return l.trim();}).filter(Boolean);
  var html='<div class="bio-text">';
  if(!lines.length) return html+'</div>';
  var first=lines[0];
  var isTitle=first.indexOf(':')>=0||first.length<=60;
  if(isTitle){
    html+='<div class="bio-title">'+first+'</div><div class="bio-body">';
    var paras=text.split(/\n\n+/).slice(1);
    if(paras.length>0) paras.forEach(function(p){var s=p.trim();if(s)html+='<p>'+s+'</p>';});
    else lines.slice(1).forEach(function(l){if(l)html+='<p>'+l+'</p>';});
    html+='</div>';
  } else {
    html+='<div class="bio-body">';
    var ps=text.split(/\n\n+/).filter(function(p){return p.trim();});
    if(ps.length<=1) ps=lines;
    ps.forEach(function(p){var s=p.trim();if(s)html+='<p>'+s+'</p>';});
    html+='</div>';
  }
  return html+'</div>';
}

/* ── 전체 렌더 ── */
function render(){
  if(!D) return;
  var ko=(lang==='ko');

  document.getElementById('bioSection').innerHTML=renderBio(ko?(D.bioKo||''):(D.bioEn||''));

  var stmtText=ko?(D.statementKo||''):(D.statementEn||D.statementKo||'');
  var stmtSec=document.getElementById('stmtSection');
  if(stmtText.trim()){
    document.getElementById('stmtBody').textContent=stmtText;
    var pl=document.getElementById('stmtPdfLink');
    if(D.statementLink){pl.href=D.statementLink;pl.style.display='inline';}
    else pl.style.display='none';
    stmtSec.style.display='block';
  } else stmtSec.style.display='none';

  var cvText=ko?(D.cvKo||''):(D.cvEn||'');
  var cvSec=document.getElementById('cvSummarySection');
  if(cvText.trim()){
    var cvP=cvText.split(/\n\n+/).filter(function(p){return p.trim();});
    if(cvP.length<=1) cvP=cvText.split(/\n/).filter(function(p){return p.trim();});
    cvSec.innerHTML='<div class="cv-summary">'+cvP.map(function(p){return'<p>'+p.trim()+'</p>';}).join('')+'</div>';
    cvSec.style.display='block';
  } else cvSec.style.display='none';

  document.getElementById('labelEdu').textContent=ko?'학력':'Education';
  document.getElementById('edu1').textContent=ko?'홍익대학교 미술대학원 회화전공 석사 (M.F.A.)':'M.F.A. in Painting, Hongik University';
  document.getElementById('edu2').textContent=ko?'이화여자대학교 전자계산학과 학사':'B.S. in Computer Science, Ewha Womans University';

  document.getElementById('labelColl').textContent=ko?'주요 작품 소장인':'Major Collections';
  var collText=ko?(D.collKo||''):(D.collEn||'');
  var collLines=collText?collText.split('\n').filter(function(l){return l.trim();}):[];
  document.getElementById('collSection').innerHTML=collLines.length
    ?collLines.map(function(l){return'<div class="left-item">'+l.trim()+'</div>';}).join('')
    :'<div class="left-item">—</div>';

  /* 최신연도 계산 — 문자열로 통일 */
  var allForYear=[].concat(D.solo||[], D.group||[], D.fair||[]);
  var yrs=allForYear.map(function(i){return parseInt(i.year,10)||0;});
  var maxY=yrs.length?Math.max.apply(null,yrs):null;
  latestYear=maxY?String(maxY):null;

  /* 레이블 텍스트 */
  document.getElementById('thType').textContent=ko?'구분':'Type';
  document.getElementById('thTitle').textContent=ko?'제목':'Title';
  document.getElementById('thPlace').textContent=ko?'장소':'Venue';
  document.getElementById('thDate').textContent=ko?'날짜':'Date';
  document.getElementById('labelFullList').textContent=ko?'전시 전체 리스트':'Full List';
  document.getElementById('labelSolo').textContent=ko?'개인 및 초대전':'Solo';
  document.getElementById('labelGroup').textContent=ko?'단체전':'Group';
  document.getElementById('backBtn').textContent='← '+(ko?'현재 연도':'Current Year');

  /* 메인 영역 */
  renderMainArea();

  /* PDF */
  if(D.pdfUrl){
    document.getElementById('pdfLink').href=D.pdfUrl;
    document.getElementById('pdfLink').style.display='inline-flex';
  }
  document.getElementById('pdfLabel').textContent=ko?'CV 전체 다운로드':'Download Full CV';
}

fetch('./data/about.json')
  .then(function(r){return r.json();})
  .then(function(data){
    D=data;
    render();
  })
  .catch(function(e){
    console.error('about.json 로드 실패:', e);
    document.getElementById('bioSection').innerHTML='<div class="loading">데이터를 불러올 수 없습니다.</div>';
  });
</script>
</body>
</html>
