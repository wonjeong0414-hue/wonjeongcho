 <!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About — WON JEONG CHO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:wght@300;400&display=swap" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:wght@300;400&display=swap"></noscript>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1a1a18;--ink-mid:#4a4a47;--ink-dim:#7a7a74;--bg:#f7f6f3;--white:#fff;--nav-h:50px;--lang-h:44px;--max-w:960px;--pad:48px}
html{background:var(--bg);scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
body{background:var(--bg);font-family:'Cormorant Garamond',serif;color:var(--ink);min-height:100vh}
nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 36px;z-index:200;background:var(--bg);border-bottom:.5px solid rgba(26,26,24,.07)}
.nav-logo{font-weight:300;font-size:13px;letter-spacing:.3em;color:var(--ink);text-transform:uppercase;cursor:pointer;transition:opacity .2s}
.nav-logo:hover{opacity:.45}
.nav-right{display:flex;align-items:center}
.nav-item{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-dim);padding:5px 11px;cursor:pointer;text-decoration:none;transition:color .25s;white-space:nowrap;position:relative}
.nav-item::after{content:'';position:absolute;bottom:0;left:11px;right:11px;height:.5px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .28s cubic-bezier(.16,1,.3,1);opacity:.5}
.nav-item:hover{color:var(--ink)}.nav-item:hover::after,.nav-item.active::after{transform:scaleX(1)}
.nav-item.active{color:var(--ink)}
.nav-sep{width:.5px;height:12px;background:rgba(0,0,0,.12);margin:0 5px;flex-shrink:0}
.nav-dd{position:relative;display:flex;align-items:center}
.nav-dd-menu{position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--white);border-radius:4px;min-width:80px;max-height:0;overflow:hidden;opacity:0;padding:0;transition:max-height 0.32s cubic-bezier(0.16,1,0.3,1),opacity 0.22s ease,padding 0.22s ease;pointer-events:none;z-index:400;box-shadow:0 4px 16px rgba(0,0,0,.08)}.nav-dd-menu.open{max-height:200px;opacity:1;padding:4px 0;pointer-events:all}
.nav-dd-item{display:block;font-size:9px;letter-spacing:.08em;color:var(--ink-mid);padding:5px 14px;cursor:pointer;transition:color .15s,background .15s;white-space:nowrap;text-transform:uppercase}
@media(max-width:600px){.nav-dd-item{padding:12px 18px;font-size:12px}}
.nav-dd-item:hover{color:var(--ink);background:rgba(0,0,0,.03)}
.lang-bar{position:fixed;top:var(--nav-h);left:0;right:0;height:var(--lang-h);display:flex;align-items:center;justify-content:flex-end;padding:0 36px;background:var(--bg);border-bottom:.5px solid rgba(26,26,24,.07);z-index:190}
.lang-toggle{display:flex;border:.5px solid rgba(26,26,24,.2);border-radius:2px;overflow:hidden}
.lang-btn{font-size:8px;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;cursor:pointer;background:transparent;color:var(--ink-dim);border:none;transition:background .15s,color .15s;font-family:'Cormorant Garamond',serif}
.lang-btn.active{background:rgba(26,26,24,.62);color:var(--bg)}
.lang-btn:not(.active):hover{color:var(--ink)}
.page-wrap{max-width:var(--max-w);margin:0 auto;padding:calc(var(--nav-h) + var(--lang-h) + 40px) var(--pad) 100px}
.bio-with-img{display:grid;grid-template-columns:1fr 260px;gap:0 48px;align-items:start;margin-bottom:40px}
.bio-img-wrap{width:260px;height:260px;overflow:hidden;align-self:start;flex-shrink:0}
.bio-img-wrap img{width:100%;height:100%;display:block;object-fit:cover;object-position:center top}
.bio-text{font-family:'EB Garamond',serif;color:#2a2a27;word-break:keep-all}
.bio-title{font-size:15px;font-weight:500;line-height:1.7;margin-bottom:1em;letter-spacing:.01em}
.bio-body{font-size:13px;line-height:2.0;color:var(--ink-mid);text-align:justify}
.bio-body p{margin-bottom:1.2em}.bio-body p:last-child{margin-bottom:0}
.stmt-section{margin-bottom:36px}
.stmt-header-row{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.stmt-lbl{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-dim)}
.stmt-body{font-family:'EB Garamond',serif;font-size:13px;line-height:2.0;color:var(--ink-mid);text-align:justify;word-break:keep-all;white-space:pre-wrap}
.cv-summary-section{margin-bottom:48px}
.cv-summary{font-family:'EB Garamond',serif;font-size:13px;line-height:2.0;color:var(--ink-mid);word-break:keep-all;text-align:justify}
.cv-summary p{margin-bottom:1em}
.sec-divider{width:100%;height:.5px;background:rgba(26,26,24,.1);margin:0 0 40px}
.edu-coll-row{display:flex;justify-content:center;gap:100px;margin-bottom:48px}
.edu-coll-block{min-width:0}
.edu-coll-label{font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:10px}
.edu-coll-item{font-family:'EB Garamond',serif;font-size:12.5px;line-height:1.8;color:var(--ink-mid)}
.sec-divider2{width:100%;height:.5px;background:rgba(26,26,24,.1);margin:0 0 36px}
.latest-section{max-width:640px;margin-left:auto;margin-right:auto}
.latest-header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:8px;border-bottom:.5px solid rgba(26,26,24,.08)}
.latest-year-label{font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-dim)}
.latest-table-head{display:grid;grid-template-columns:62px 1fr 180px 96px;gap:0 6px;padding:0 0 5px;border-bottom:.5px solid rgba(26,26,24,.1);margin-bottom:0}
.latest-th{font-size:7.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim)}
.latest-row{display:grid;grid-template-columns:62px minmax(0,1fr) 180px 96px;gap:0 6px;padding:4px 0;border-bottom:.5px solid rgba(26,26,24,.04);font-family:'EB Garamond',serif;font-size:12px;line-height:1.55;color:var(--ink);align-items:baseline}
.latest-cell-type{font-size:10px;color:var(--ink-dim);white-space:nowrap}
.latest-cell-title{color:var(--ink)}
.latest-cell-place{font-size:10.5px;color:var(--ink-mid)}
.latest-cell-date{font-size:10px;color:var(--ink-dim);letter-spacing:.01em;white-space:nowrap}
.full-list-rows{margin-top:4px;max-width:640px;margin-left:auto;margin-right:auto}
.panel-row{display:grid;grid-template-columns:36px minmax(0,1fr) 160px;gap:0 12px;padding:3px 0;border-bottom:.5px solid rgba(26,26,24,.04);font-family:'EB Garamond',serif;font-size:12px;line-height:1.55;align-items:baseline}
.panel-year{font-size:10px;color:var(--ink-dim);letter-spacing:.03em}
.panel-title{color:var(--ink)}
.panel-place{font-size:10.5px;color:var(--ink-mid)}
.full-list-wrap{display:flex;align-items:center;padding:10px 0;border-bottom:.5px solid rgba(26,26,24,.07);gap:0;max-width:640px;margin-left:auto;margin-right:auto}
.full-list-label{font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink);font-weight:600;white-space:nowrap;flex-shrink:0}
.full-list-sep{width:.5px;height:10px;background:rgba(26,26,24,.25);margin:0 14px;flex-shrink:0}
.cv-tabs{display:flex;gap:0;align-items:center;flex:1}
.cv-tab{font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-dim);padding:2px 12px 2px 0;cursor:pointer;transition:color .2s;white-space:nowrap}
.cv-tab:hover{color:var(--ink-mid)}
.cv-tab.active{color:var(--ink);font-weight:700;letter-spacing:.13em;font-size:8.5px}
.back-btn{display:none;font-size:7.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);cursor:pointer;white-space:nowrap;border:.5px solid rgba(26,26,24,.2);border-radius:2px;padding:2px 8px;background:transparent;font-family:'Cormorant Garamond',serif;transition:color .15s,border-color .15s}
.back-btn.visible{display:inline-block}
.exh-link{color:inherit;text-decoration:none;transition:opacity .2s}
.exh-link:hover{opacity:.5}
.cv-footer{margin-top:56px;padding-top:28px;border-top:.5px solid rgba(26,26,24,.1);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px}
.social-links{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.social-link{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mid);padding:4px 10px;border:.5px solid rgba(26,26,24,.22);border-radius:2px;background:transparent;transition:color .2s,border-color .2s}
.social-link:hover{color:var(--ink);border-color:rgba(26,26,24,.45)}
.social-link svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;opacity:.7}
.loading{padding:60px 0;text-align:center;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-dim)}
@media(max-width:600px){:root{--pad:20px;--lang-h:40px}nav{padding:0 16px}.lang-bar{padding:0 16px}html,body{overflow:auto !important;height:auto !important}.page-wrap{padding:calc(var(--nav-h) + var(--lang-h) + 24px) var(--pad) 80px;max-width:100%;margin:0}.bio-with-img{grid-template-columns:1fr;gap:20px 0}.bio-img-wrap{order:-1}.bio-img-wrap img{max-height:240px;width:100%;object-fit:cover}.edu-coll-row{flex-direction:column;gap:28px;align-items:flex-start;margin-bottom:32px}.latest-table-head{grid-template-columns:52px minmax(0,1fr) 100px;gap:0 6px}.latest-th:last-child{display:none}.latest-row{grid-template-columns:52px minmax(0,1fr) 100px;gap:0 6px;font-size:11.5px;}.latest-cell-date{display:none}.panel-row{grid-template-columns:28px minmax(0,1fr) 100px;font-size:11.5px;}.cv-footer{display:none}}
@media(max-width:480px){.nav-logo{font-size:10px;letter-spacing:.18em}.nav-item{font-size:8px;padding:5px 6px}.nav-sep{margin:0 1px}}


</style>
</head>
<body>

<div class="lang-bar">

    <div class="edu-coll-block"><div class="edu-coll-label" id="labelColl">주요 작품 소장처</div><div id="collSection" class="edu-coll-item"></div></div>

<script>
var D=null, lang='ko', activeTab=null, latestYear=null;

function go(p){document.body.classList.add('fade-out');setTimeout(function(){window.location.href=p+'.html';},280);}

document.querySelectorAll('.nav-dd').forEach(function(dd){
  var menu=dd.querySelector('.nav-dd-menu'),timer;
  function openM(){clearTimeout(timer);menu.classList.add('open');}
  function closeM(){timer=setTimeout(function(){menu.classList.remove('open');},160);}
  dd.addEventListener('mouseenter',openM);
  dd.addEventListener('mouseleave',closeM);
  menu.addEventListener('mouseenter',function(){clearTimeout(timer);});
  menu.addEventListener('mouseleave',closeM);
  var ni=dd.querySelector('.nav-item');
  if(ni)ni.addEventListener('click',function(e){
    e.stopPropagation();
    var isOpen=menu.classList.contains('open');
    document.querySelectorAll('.nav-dd-menu').forEach(function(m){m.classList.remove('open');});
    if(!isOpen)menu.classList.add('open');
  });
});
document.addEventListener('click',function(e){
  if(!e.target.closest||!e.target.closest('.nav-dd'))
    document.querySelectorAll('.nav-dd-menu').forEach(function(m){m.classList.remove('open');});
});

function setLang(l){
  lang=l;
  document.getElementById('btnKo').classList.toggle('active',l==='ko');
  document.getElementById('btnEn').classList.toggle('active',l==='en');
  if(D)render();
}

function setCvTab(t){
  activeTab=t;
  ['solo','group','fair'].forEach(function(k){
    var el=document.getElementById('tab'+k.charAt(0).toUpperCase()+k.slice(1));
    if(el)el.classList.toggle('active',k===t);
  });
  document.getElementById('backBtn').classList.add('visible');
  document.getElementById('latestSection').style.display='none';
  document.getElementById('fullListRows').style.display='block';
  renderFullList();
}

function showLatestYear(){
  activeTab=null;
  ['Solo','Group','Fair'].forEach(function(n){
    var el=document.getElementById('tab'+n);if(el)el.classList.remove('active');
  });
  document.getElementById('backBtn').classList.remove('visible');
  document.getElementById('latestSection').style.display='';
  document.getElementById('fullListRows').style.display='none';
}

function makePlace(p,c){
  if(!p&&!c)return'';
  if(!p)return'<span class="place-city">'+c+'</span>';
  return'<span class="place-name">'+p+'</span>'+(c?'<span class="place-sep"> · </span><span class="place-city">'+c+'</span>':'');
}

function exhLink(cvKey){
  if(!cvKey)return'#';
  return'exhibition.html?key='+encodeURIComponent(cvKey);
}

function renderFullList(){
  if(!D||!activeTab)return;
  var ko=(lang==='ko');
  var list={solo:D.solo||[],group:D.group||[],fair:D.fair||[]}[activeTab]||[];
  var el=document.getElementById('fullListRows');
  if(!list.length){el.innerHTML='<div style="font-size:11px;color:var(--ink-dim);padding:8px 0">—</div>';return;}
  el.innerHTML=list.map(function(item){
    var t=ko?(item.ko||''):(item.en||item.ko||'');
    if(!t)return'';
    var p=ko?(item.placeKo||''):(item.placeEn||item.placeKo||'');
    var c=ko?(item.cityKo||''):(item.cityEn||item.cityKo||'');
    var link=item.cvKey?exhLink(item.cvKey):'';
    return'<div class="panel-row">'
      +'<div class="panel-year">'+(item.year||'')+'</div>'
      +'<div class="panel-title"><a class="exh-link" href="'+link+'">'+t+'</a></div>'
      +'<div class="panel-place">'+makePlace(p,c)+'</div>'
      +'</div>';
  }).join('');
}

function renderMainArea(){
  if(!D)return;
  var ko=(lang==='ko');
  var labelEl=document.getElementById('latestYearLabel');
  var rowsEl=document.getElementById('latestRows');
  labelEl.textContent=latestYear?(ko?latestYear+'년 전시':latestYear+' Exhibitions'):(ko?'최근 전시':'Recent');
  document.getElementById('latestTableHead').style.display='';
  var typeL={solo:ko?'개인·초대':'Solo',group:ko?'단체전':'Group',fair:'Art Fair'};
  var all=[]
    .concat((D.solo||[]).map(function(i){return Object.assign({},i,{_t:'solo'});}))
    .concat((D.group||[]).map(function(i){return Object.assign({},i,{_t:'group'});}))
    .concat((D.fair||[]).map(function(i){return Object.assign({},i,{_t:'fair'});}));
  var filtered=latestYear?all.filter(function(i){return String(i.year)===String(latestYear);}):[];
  if(!filtered.length){rowsEl.innerHTML='<div style="font-size:11px;color:var(--ink-dim);padding:8px 0">—</div>';return;}
  rowsEl.innerHTML=filtered.map(function(item){
    var t=ko?(item.ko||''):(item.en||item.ko||'');
    var p=ko?(item.placeKo||''):(item.placeEn||item.placeKo||'');
    var c=ko?(item.cityKo||''):(item.cityEn||item.cityKo||'');
    var link=item.cvKey?exhLink(item.cvKey):'';
    return'<div class="latest-row">'
      +'<div class="latest-cell-type">'+(typeL[item._t]||'')+'</div>'
      +'<div class="latest-cell-title"><a class="exh-link" href="'+link+'">'+t+'</a></div>'
      +'<div class="latest-cell-place">'+makePlace(p,c)+'</div>'
      +'<div class="latest-cell-date">'+(item.date||'')+'</div>'
      +'</div>';
  }).join('');
  if(activeTab){
    document.getElementById('latestSection').style.display='none';
    document.getElementById('fullListRows').style.display='block';
    renderFullList();
  }
}

function renderBio(text){
  if(!text)return'<div class="bio-text"><div class="bio-body"><p>—</p></div></div>';
  var lines=text.split(/\n/).map(function(l){return l.trim();}).filter(Boolean);
  var html='<div class="bio-text">';
  if(!lines.length)return html+'</div>';
  var first=lines[0];
  var isTitle=first.indexOf(':')>=0||first.length<=60;
  if(isTitle){
    html+='<div class="bio-title">'+first+'</div><div class="bio-body">';
    var paras=text.split(/\n\n+/).slice(1);
    if(paras.length>0)paras.forEach(function(p){var s=p.trim();if(s)html+='<p>'+s+'</p>';});
    else lines.slice(1).forEach(function(l){if(l)html+='<p>'+l+'</p>';});
    html+='</div>';
  }else{
    html+='<div class="bio-body">';
    var ps=text.split(/\n\n+/).filter(function(p){return p.trim();});
    if(ps.length<=1)ps=lines;
    ps.forEach(function(p){var s=p.trim();if(s)html+='<p>'+s+'</p>';});
    html+='</div>';
  }
  return html+'</div>';
}

function render(){
  if(!D)return;
  var ko=(lang==='ko');
  document.getElementById('bioSection').innerHTML=renderBio(ko?(D.bioKo||''):(D.bioEn||''));
  var stmtText=ko?(D.statementKo||''):(D.statementEn||D.statementKo||'');
  var stmtSec=document.getElementById('stmtSection');
  if(stmtText.trim()){
    document.getElementById('stmtBody').textContent=stmtText;
    var pl=document.getElementById('stmtPdfLink');
    if(D.statementLink){pl.href=D.statementLink;pl.style.display='inline';}
    else pl.style.display='none';
    stmtSec.style.display='block';
  }else stmtSec.style.display='none';
  var cvText=ko?(D.cvKo||''):(D.cvEn||'');
  var cvSec=document.getElementById('cvSummarySection');
  if(cvText.trim()){
    var cvP=cvText.split(/\n\n+/).filter(function(p){return p.trim();});
    if(cvP.length<=1)cvP=cvText.split(/\n/).filter(function(p){return p.trim();});
    cvSec.innerHTML='<div class="cv-summary">'+cvP.map(function(p){return'<p>'+p.trim()+'</p>';}).join('')+'</div>';
    cvSec.style.display='block';
  }else cvSec.style.display='none';
  document.getElementById('labelEdu').textContent=ko?'학력':'Education';
  document.getElementById('edu1').textContent=ko?'홍익대학교 미술대학원 회화전공 석사 (M.F.A.)':'M.F.A. in Painting, Hongik University';
  document.getElementById('edu2').textContent=ko?'이화여자대학교 전자계산학과 학사':'B.S. in Computer Science, Ewha Womans University';
  document.getElementById('labelColl').textContent=ko?'주요 작품 소장처':'Major Collections';
  var collText=ko?(D.collKo||''):(D.collEn||'');
  var collLines=collText?collText.split('\n').filter(function(l){return l.trim();}):[];
  document.getElementById('collSection').innerHTML=collLines.length
    ?collLines.map(function(l){return l.trim();}).join('<br>'):'—';
  var allForYear=[].concat(D.solo||[],D.group||[],D.fair||[]);
  var yrs=allForYear.map(function(i){return parseInt(i.year,10)||0;});
  var maxY=yrs.length?Math.max.apply(null,yrs):null;
  latestYear=maxY?String(maxY):null;
  document.getElementById('thType').textContent=ko?'구분':'Type';
  document.getElementById('thTitle').textContent=ko?'제목':'Title';
  document.getElementById('thPlace').textContent=ko?'장소':'Venue';
  document.getElementById('thDate').textContent=ko?'날짜':'Date';
  document.getElementById('labelFullList').textContent=ko?'전시 전체 리스트':'Full List';
  document.getElementById('labelSolo').textContent=ko?'개인 및 초대전':'Solo';
  document.getElementById('labelGroup').textContent=ko?'단체전':'Group';
  document.getElementById('backBtn').textContent='← '+(ko?'현재 연도':'Current Year');
  renderMainArea();
  if(D.pdfUrl){document.getElementById('pdfLink').href=D.pdfUrl;document.getElementById('pdfLink').style.display='inline-flex';}
  if(D.aboutImg){
    var m=D.aboutImg.match(/\/d\/([a-zA-Z0-9_-]{10,})/);
    var imgUrl=m?'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w600':D.aboutImg;
    var bi=document.getElementById('bioImg'),bw=document.getElementById('bioImgWrap');
    if(bi&&bw){bi.src=imgUrl;bw.style.display='block';}
  }
  document.getElementById('pdfLabel').textContent=ko?'CV 전체 다운로드':'Download Full CV';
}

fetch('./data/about.json?v='+Date.now(),{cache:'no-store'})
  .then(function(r){return r.json();})
  .then(function(data){D=data;render();})
  .catch(function(e){
    console.error('about.json 로드 실패:',e);
    document.getElementById('bioSection').innerHTML='<div class="loading">데이터를 불러올 수 없습니다.</div>';
  });

/* ── 스크롤 → index 전환 ── */
var _abLocked=false;
var _abWC=0,_abWT=null;
window.addEventListener('wheel',function(e){
  if(_abLocked)return;
  if(e.deltaY<=0){_abWC=0;return;}
  var atBot=window.scrollY+window.innerHeight>=document.body.scrollHeight-8;
  if(!atBot){_abWC=0;return;}
  _abWC++;
  clearTimeout(_abWT);
  _abWT=setTimeout(function(){_abWC=0;},800);
  if(_abWC>=3){
    _abLocked=true;
    document.body.style.opacity='0';
    document.body.style.transition='opacity 0.4s ease';
    setTimeout(function(){window.location.href='index.html';},420);
  }
},{passive:true});
var _abTY=0;
window.addEventListener('touchstart',function(e){_abTY=e.touches[0].clientY;},{passive:true});
window.addEventListener('touchend',function(e){
  if(_abLocked)return;
  var atBot=window.scrollY+window.innerHeight>=document.body.scrollHeight-8;
  if(_abTY-e.changedTouches[0].clientY>60&&atBot){
    _abLocked=true;
    document.body.style.opacity='0';
    document.body.style.transition='opacity 0.4s ease';
    setTimeout(function(){window.location.href='index.html';},420);
  }
},{passive:true});
</script>
