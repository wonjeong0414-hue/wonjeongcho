 <!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About — WON JEONG CHO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:wght@300;400&display=swap" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:wght@300;400&display=swap"></noscript>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1a1a18;--ink-mid:#4a4a47;--ink-dim:#7a7a74;--bg:#f7f6f3;--white:#fff;--nav-h:50px;--max-w:860px;--pad:48px}
html{background:var(--bg)}
body{background:var(--bg);font-family:'Cormorant Garamond',serif;color:var(--ink);min-height:100vh}
nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 36px;z-index:200;background:var(--bg);border-bottom:.5px solid rgba(26,26,24,.07)}
.nav-logo{font-weight:300;font-size:13px;letter-spacing:.3em;color:var(--ink);text-transform:uppercase;cursor:pointer;transition:opacity .2s}
.nav-logo:hover{opacity:.45}
.nav-right{display:flex;align-items:center}
.nav-item{font-size:9.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-dim);padding:5px 11px;cursor:pointer;text-decoration:none;transition:color 0.25s;white-space:nowrap;position:relative}
.nav-item::after{content:'';position:absolute;bottom:0;left:11px;right:11px;height:0.5px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform 0.28s cubic-bezier(0.16,1,0.3,1);opacity:0.5}
.nav-item:hover{color:var(--ink)}
.nav-item:hover::after{transform:scaleX(1)}
.nav-item.active{color:var(--ink)}
.nav-item.active::after{transform:scaleX(1)}
.nav-sep{width:.5px;height:12px;background:rgba(0,0,0,.12);margin:0 5px;flex-shrink:0}
.nav-dd{position:relative}
.nav-dd-menu{display:none;position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--white);border-radius:4px;padding:4px 0;min-width:80px;z-index:300;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.nav-dd-item{display:block;font-size:9px;letter-spacing:.08em;color:var(--ink-mid);padding:5px 14px;cursor:pointer;transition:color .15s,background .15s;white-space:nowrap;text-transform:uppercase}
.nav-dd-item:hover{color:var(--ink);background:rgba(0,0,0,.03)}
.lang-bar{position:fixed;top:var(--nav-h);left:0;right:0;height:44px;display:flex;align-items:center;justify-content:flex-end;padding:0 36px;background:var(--bg);border-bottom:.5px solid rgba(26,26,24,.07);z-index:190}
.lang-toggle{display:flex;border:0.5px solid rgba(26,26,24,0.2);border-radius:2px;overflow:hidden}
.lang-btn{font-size:8px;letter-spacing:0.12em;text-transform:uppercase;padding:4px 10px;cursor:pointer;background:transparent;color:var(--ink-dim);border:none;transition:background 0.15s,color 0.15s;font-family:'Cormorant Garamond',serif}
.lang-btn.active{background:rgba(26,26,24,0.62);color:var(--bg)}
.lang-btn:not(.active):hover{color:var(--ink)}
.page-wrap{max-width:var(--max-w);margin:0 auto;padding:calc(var(--nav-h) + 44px + 32px) var(--pad) 100px}
.bio-text{font-family:'EB Garamond',serif;color:#2a2a27;text-align:justify;word-break:keep-all;hyphens:auto}
.bio-title{font-size:15.5px;font-weight:500;line-height:1.7;margin-bottom:1.3em;letter-spacing:.01em}
.bio-body{font-size:13.5px;line-height:2.0;color:var(--ink-mid)}
.bio-body p{margin-bottom:1.35em}
.bio-body p:last-child{margin-bottom:0}
.sec-divider{width:100%;height:.5px;background:rgba(26,26,24,.12);margin:52px 0}
.grid-section{display:grid;grid-template-columns:1fr 1fr;gap:40px 48px}
@media(max-width:580px){.grid-section{grid-template-columns:1fr;gap:32px}}
.grid-label{font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:14px}
.grid-item{font-family:'EB Garamond',serif;font-size:13px;line-height:1.75;color:var(--ink);padding:5px 0;border-bottom:.5px solid rgba(26,26,24,.07)}
.grid-item:last-child{border-bottom:none}
.coll-box{font-family:'EB Garamond',serif;font-size:13px;line-height:1.75;color:var(--ink-mid);min-height:80px}
.cv-summary{font-family:'EB Garamond',serif;font-size:13.5px;line-height:1.95;color:var(--ink-mid);text-align:justify;word-break:keep-all}
.cv-tabs{display:flex;gap:0;border-bottom:.5px solid rgba(26,26,24,.12);margin:52px 0 24px}
.cv-tab{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);padding:8px 20px 8px 0;cursor:pointer;border-bottom:1.5px solid transparent;margin-bottom:-1px;transition:color .2s,border-color .2s}
.cv-tab:hover{color:var(--ink)}
.cv-tab.active{color:var(--ink);border-bottom-color:var(--ink)}
.cv-panel{display:none}
.cv-panel.active{display:block}

/* ── CV 항목: 연도 / 제목 / 장소 / 도시 ── */
.cv-row-item{
  display:grid;
  grid-template-columns:48px 1fr;
  gap:0 16px;
  padding:7px 0;
  border-bottom:.5px solid rgba(26,26,24,.06);
  font-family:'EB Garamond',serif;
  font-size:13px;
  line-height:1.7;
  color:var(--ink);
}
.cv-row-item:last-child{border-bottom:none}
.cv-year{
  font-size:11px;
  color:var(--ink-dim);
  letter-spacing:0.06em;
  padding-top:2px;
  flex-shrink:0;
}
.cv-content{display:flex;align-items:baseline;flex-wrap:wrap;gap:0}
.cv-title{color:var(--ink);line-height:1.7}
.cv-meta-inline{
  font-size:11px;
  color:var(--ink-dim);
  letter-spacing:0.04em;
  line-height:1.7;
}
.cv-sep{opacity:0.35}

.cv-footer{margin-top:52px;padding-top:28px;border-top:.5px solid rgba(26,26,24,.12);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px}
.cv-pdf-link{display:inline-flex;align-items:center;gap:7px;font-family:'Cormorant Garamond',serif;font-size:8px;letter-spacing:0.14em;text-transform:uppercase;color:var(--bg);text-decoration:none;background:rgba(26,26,24,0.55);padding:4px 12px 4px 10px;border-radius:2px;border:none;transition:background .2s}
.cv-pdf-link:hover{background:rgba(26,26,24,0.75)}
.social-links{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.social-link{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:8px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-mid);padding:4px 10px;border:.5px solid rgba(26,26,24,0.22);border-radius:2px;background:transparent;transition:color .2s,border-color .2s,background .2s}
.social-link:hover{color:var(--ink);border-color:rgba(26,26,24,.45);background:rgba(26,26,24,.05)}
.social-link svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;opacity:.7}
.loading{padding:80px 0;text-align:center;font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-dim)}
@media(max-width:600px){:root{--pad:22px}nav{padding:0 12px}.lang-bar{padding:0 16px;height:40px}.cv-footer{flex-direction:column;align-items:flex-start}.cv-row-item{grid-template-columns:40px 1fr;gap:0 10px}.cv-tabs{flex-wrap:wrap;gap:4px}.cv-tab{font-size:8px;letter-spacing:0.1em;padding:6px 12px 6px 0}}
@media(max-width:480px){.nav-logo{font-size:10px;letter-spacing:0.18em}.nav-item{font-size:8.5px;padding:5px 7px}.nav-sep{margin:0 2px}}
</style>
</head>
<body>
<nav>
  <span class="nav-logo" onclick="go('index')">Won Jeong Cho</span>
  <div class="nav-right">
    <div class="nav-dd">
      <span class="nav-item">Archive</span>
      <div class="nav-dd-menu">
        <span class="nav-dd-item" onclick="go('year')">Year</span>
        <span class="nav-dd-item" onclick="go('context')">Context</span>
      </div>
    </div>
    <div class="nav-sep"></div>
    <span class="nav-item" onclick="go('text')">Text</span>
    <div class="nav-sep"></div>
    <span class="nav-item active">About</span>
  </div>
</nav>

<div class="lang-bar">
  <div class="lang-toggle">
    <button class="lang-btn active" id="btnKo" onclick="setLang('ko')">한국어</button>
    <button class="lang-btn" id="btnEn" onclick="setLang('en')">English</button>
  </div>
</div>

<div class="page-wrap">
  <div id="bioSection"><div class="loading">Loading…</div></div>
  <div class="sec-divider"></div>
  <div class="grid-section">
    <div>
      <div class="grid-label" id="labelEdu">학력</div>
      <div id="edu1" class="grid-item"></div>
      <div id="edu2" class="grid-item"></div>
    </div>
    <div>
      <div class="grid-label" id="labelColl">주요 작품 소장인</div>
      <div id="collSection"></div>
    </div>
  </div>
  <div class="sec-divider"></div>
  <div id="cvSummarySection"></div>
  <div class="cv-tabs">
    <div class="cv-tab active" id="tabSolo"  onclick="setCvTab('solo')"><span id="tabSoloLabel">개인 및 초대전</span></div>
    <div class="cv-tab"        id="tabGroup" onclick="setCvTab('group')"><span id="tabGroupLabel">단체전</span></div>
    <div class="cv-tab"        id="tabFair"  onclick="setCvTab('fair')">Art Fair</div>
  </div>
  <div class="cv-panel active" id="panelSolo"></div>
  <div class="cv-panel"        id="panelGroup"></div>
  <div class="cv-panel"        id="panelFair"></div>
  <div class="cv-footer">
    <a class="cv-pdf-link" id="pdfLink" href="#" target="_blank" style="display:none">
      <svg width="10" height="12" viewBox="0 0 10 12" fill="none"><rect x=".5" y=".5" width="9" height="11" rx="1" stroke="currentColor" stroke-width=".8"/><line x1="2" y1="4" x2="8" y2="4" stroke="currentColor" stroke-width=".8"/><line x1="2" y1="6" x2="8" y2="6" stroke="currentColor" stroke-width=".8"/><line x1="2" y1="8" x2="5.5" y2="8" stroke="currentColor" stroke-width=".8"/></svg>
      <span id="pdfLabel">CV Download</span>
    </a>
    <div class="social-links">
      <a class="social-link" href="mailto:wonjeong.cho@gmail.com">
        <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,4 12,14 22,4"/></svg>Email
      </a>
      <a class="social-link" href="https://www.instagram.com/wonjeong.cho/" target="_blank">
        <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r=".5" fill="currentColor" stroke="none"/></svg>Instagram
      </a>
      <a class="social-link" href="https://www.saatchiart.com/en-kr/chowonjeong" target="_blank">
        <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>Saatchi Art
      </a>
    </div>
  </div>
</div>

<script>
var D = null, lang = 'ko', cvTab = 'solo';

function go(page){ window.location.href = page + '.html'; }

document.querySelectorAll('.nav-dd').forEach(function(dd){
  var menu=dd.querySelector('.nav-dd-menu'), timer;
  dd.addEventListener('mouseenter',function(){clearTimeout(timer);menu.style.display='block';});
  dd.addEventListener('mouseleave',function(){timer=setTimeout(function(){menu.style.display='none';},150);});
  menu.addEventListener('mouseenter',function(){clearTimeout(timer);});
  menu.addEventListener('mouseleave',function(){timer=setTimeout(function(){menu.style.display='none';},150);});
});

function setLang(l){
  lang=l;
  document.getElementById('btnKo').classList.toggle('active',l==='ko');
  document.getElementById('btnEn').classList.toggle('active',l==='en');
  if(D) render();
}

function setCvTab(t){
  cvTab=t;
  ['Solo','Group','Fair'].forEach(function(n){
    var key=n.toLowerCase();
    document.getElementById('tab'+n).classList.toggle('active',key===t);
    document.getElementById('panel'+n).classList.toggle('active',key===t);
  });
}

function renderBio(text){
  if(!text) return '<div class="bio-text"><div class="bio-body"><p>—</p></div></div>';
  var lines=text.split(/\n/).map(function(l){return l.trim();}).filter(Boolean);
  var html='<div class="bio-text">';
  if(!lines.length) return html+'</div>';
  var firstLine=lines[0];
  var isTitle=firstLine.indexOf(':')>=0||firstLine.length<=60;
  if(isTitle){
    html+='<div class="bio-title">'+firstLine+'</div><div class="bio-body">';
    var paras=text.split(/\n\n+/).slice(1);
    if(paras.length>0){paras.forEach(function(p){var t=p.trim();if(t)html+='<p>'+t+'</p>';});}
    else{lines.slice(1).forEach(function(l){if(l)html+='<p>'+l+'</p>';});}
    html+='</div>';
  } else {
    html+='<div class="bio-body">';
    var paras=text.split(/\n\n+/).filter(function(p){return p.trim();});
    if(paras.length<=1) paras=lines;
    paras.forEach(function(p){var t=p.trim();if(t)html+='<p>'+t+'</p>';});
    html+='</div>';
  }
  return html+'</div>';
}

function renderCVPanel(id, items, ko){
  var el=document.getElementById(id);
  if(!items||!items.length){el.innerHTML='<div style="font-size:13px;color:var(--ink-dim);padding:8px 0">—</div>';return;}
  el.innerHTML=items.map(function(item){
    var title = ko ? (item.ko||'')  : (item.en||item.ko||'');
    var place = ko ? (item.placeKo||'') : (item.placeEn||item.placeKo||'');
    var city  = ko ? (item.cityKo||'')  : (item.cityEn||item.cityKo||'');
    if(!title) return '';
    var parts = [];
    if(place) parts.push(place);
    if(city)  parts.push(city);
    var sep = (place || city) ? '&nbsp;&nbsp;' : '';
    var meta = parts.length ? '<span class="cv-meta-inline">'+parts.join('<span class="cv-sep"> · </span>')+'</span>' : '';
    return '<div class="cv-row-item">'
      +'<div class="cv-year">'+(item.year||'')+'</div>'
      +'<div class="cv-content">'
        +'<span class="cv-title">'+title+'</span>'
        +sep+meta
      +'</div>'
      +'</div>';
  }).join('');
}

function render(){
  if(!D) return;
  var ko=lang==='ko';
  document.getElementById('bioSection').innerHTML=renderBio(ko?(D.bioKo||''):(D.bioEn||''));
  document.getElementById('labelEdu').textContent=ko?'학력':'Education';
  document.getElementById('edu1').textContent=ko?'홍익대학교 미술대학원 회화전공 석사 (M.F.A.)':'M.F.A. in Painting, Hongik University Graduate School of Fine Arts';
  document.getElementById('edu2').textContent=ko?'이화여자대학교 전자계산학과 학사':'B.S. in Computer Science, Ewha Womans University';
  document.getElementById('labelColl').textContent=ko?'주요 작품 소장인':'Major Collections';
  var collText=ko?(D.collKo||''):(D.collEn||'');
  document.getElementById('collSection').innerHTML='<div class="coll-box">'+(collText||'—')+'</div>';
  var cvText=ko?(D.cvKo||''):(D.cvEn||'');
  var cvSummaryEl=document.getElementById('cvSummarySection');
  if(cvText.trim()){
    var cvParas=cvText.split(/\n\n+/).filter(function(p){return p.trim();});
    if(cvParas.length<=1) cvParas=cvText.split(/\n/).filter(function(p){return p.trim();});
    cvSummaryEl.innerHTML='<div class="cv-summary">'
      +cvParas.map(function(p){return'<p style="margin-bottom:1.2em">'+p.trim()+'</p>';}).join('')+'</div>';
    cvSummaryEl.style.display='block';
  } else {
    cvSummaryEl.innerHTML='';
    cvSummaryEl.style.display='none';
  }
  if(D.pdfUrl){document.getElementById('pdfLink').href=D.pdfUrl;document.getElementById('pdfLink').style.display='inline-flex';}
  document.getElementById('pdfLabel').textContent=ko?'CV 전체 다운로드':'Download Full CV';
  document.getElementById('tabSoloLabel').textContent=ko?'개인 및 초대전':'Solo & Invitational';
  document.getElementById('tabGroupLabel').textContent=ko?'단체전':'Group Exhibitions';
  renderCVPanel('panelSolo',  D.solo||[],  ko);
  renderCVPanel('panelGroup', D.group||[], ko);
  renderCVPanel('panelFair',  D.fair||[],  ko);
}

fetch('./data/about.json')
  .then(function(r){return r.json();})
  .then(function(data){D=data;render();})
  .catch(function(){
    document.getElementById('bioSection').innerHTML='<div class="loading">데이터를 불러올 수 없습니다.</div>';
  });
</script>
</body>
</html>
