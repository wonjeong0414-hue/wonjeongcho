<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1a1a18;--ink-mid:#4a4a47;--ink-dim:#7a7a74;--bg:#f7f6f3;--white:#fff;--nav-h:50px;--left-w:120px}
html,body{height:100%;background:var(--bg);font-family:'Cormorant Garamond',serif;color:var(--ink)}
nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 36px;z-index:300;background:var(--bg)}
@media(max-width:600px){nav{padding:0 12px}}
@media(max-width:480px){.nav-logo{font-size:9px !important;letter-spacing:0.16em !important}.nav-item{font-size:8px !important;padding:5px 6px !important;letter-spacing:0.1em !important}.nav-sep{margin:0 1px !important}}
.nav-logo{font-weight:400;font-size:13px;letter-spacing:0.28em;color:var(--ink);text-decoration:none;text-transform:uppercase;transition:opacity 0.2s;cursor:pointer}
.nav-logo:hover{opacity:.45}
.nav-right{display:flex;align-items:center}
.nav-item{font-size:9.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-dim);padding:5px 11px;cursor:pointer;text-decoration:none;transition:color 0.25s;white-space:nowrap;position:relative;line-height:1;display:flex;align-items:center}
.nav-item::after{content:'';position:absolute;bottom:0;left:11px;right:11px;height:0.5px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform 0.28s cubic-bezier(0.16,1,0.3,1);opacity:0.5}
.nav-item:hover{color:var(--ink)}
.nav-item:hover::after,.nav-item.active::after{transform:scaleX(1)}
.nav-item.active{color:var(--ink)}
.nav-sep{width:0.5px;height:12px;background:rgba(0,0,0,0.12);margin:0 5px;flex-shrink:0}
.nav-dd{position:relative;display:flex;align-items:center}
.nav-dd-menu{display:none;position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--white);border-radius:4px;padding:4px 0;min-width:80px;z-index:400;box-shadow:0 4px 16px rgba(0,0,0,0.08)}
.nav-dd-item{display:block;font-size:9px;letter-spacing:0.08em;color:var(--ink-mid);padding:5px 14px;cursor:pointer;transition:color 0.15s,background 0.15s;white-space:nowrap;text-transform:uppercase}
.nav-dd-item:hover{color:var(--ink);background:rgba(0,0,0,0.03)}

/* ── lang bar ── */
.lang-bar{position:fixed;top:var(--nav-h);left:0;right:0;height:44px;display:flex;align-items:center;justify-content:flex-end;padding:0 36px;background:var(--bg);border-bottom:0.5px solid rgba(0,0,0,0.07);z-index:200}
.lang-toggle{display:flex;border:0.5px solid rgba(26,26,24,0.2);border-radius:2px;overflow:hidden}
.lang-btn{font-family:'Cormorant Garamond',serif;font-size:9.5px;letter-spacing:0.12em;text-transform:uppercase;padding:4px 10px;cursor:pointer;background:transparent;color:var(--ink-mid);border:none;transition:background 0.15s,color 0.15s}
.lang-btn.active{background:rgba(26,26,24,0.62);color:var(--bg)}
.lang-btn:not(.active):hover{color:var(--ink)}

/* ── page body ── */
.page-body{position:fixed;top:calc(var(--nav-h) + 44px);left:0;right:0;bottom:0;display:flex;flex-direction:column;overflow:hidden;z-index:1}
.desktop-wrap{display:flex;flex-direction:column;height:100%;overflow:hidden}

/* ── Statement 블록 (작가노트 탭에서만 표시) ── */
.stmt-block{width:100%;padding:28px 48px 28px calc(var(--left-w) + 24px);border-bottom:0.5px solid rgba(0,0,0,0.08);flex-shrink:0;max-height:40%;overflow-y:auto;scrollbar-width:none;display:none}
.stmt-block::-webkit-scrollbar{display:none}
.stmt-block.show{display:block}
.stmt-label{font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-mid);margin-bottom:14px}
.stmt-text{font-family:'EB Garamond',serif;font-size:14px;line-height:2.0;color:var(--ink);white-space:pre-wrap;word-break:keep-all;text-align:justify}
.stmt-text.fade{opacity:0;transition:opacity 0.18s}
.stmt-link{display:inline-flex;align-items:center;gap:4px;margin-top:14px;font-size:9.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-mid);text-decoration:none;padding:0 1px;border:0.3px solid rgba(74,74,71,0.25);border-radius:2px;transition:background 0.15s,color 0.15s}
.stmt-link:hover{background:rgba(74,74,71,0.06)}

/* ── 3단 레이아웃 ── */
.three-col{flex:1;display:flex;min-height:0;overflow:hidden}

/* ── 좌측 탭 ── */
.left-panel{width:var(--left-w);flex-shrink:0;padding:20px 0;display:flex;flex-direction:column;align-items:center}
.tab-list{display:flex;flex-direction:column;gap:6px}
.tab-item{font-size:11px;color:var(--ink-dim);letter-spacing:0.06em;cursor:pointer;padding:1px 0;transition:color 0.18s;line-height:1.25;font-family:'Cormorant Garamond',serif;white-space:nowrap}
.tab-item:hover{color:var(--ink-mid)}
.tab-item.active{color:var(--ink)}
.tab-item.active::after{content:'';display:block;height:0.5px;background:var(--ink);opacity:0.35;margin-top:3px}

/* ── 리스트 컬럼 ── */
.list-col{width:40%;flex-shrink:0;padding:20px 20px 40px 0;border-right:0.5px solid rgba(0,0,0,0.07);overflow-y:auto;scrollbar-width:none}
.list-col::-webkit-scrollbar{display:none}

/* ── 리스트 행: 년도 / 구분 / 제목 3열 ── */
.list-header{display:grid;grid-template-columns:44px 60px 1fr;gap:0 8px;padding:0 0 6px;border-bottom:0.5px solid rgba(0,0,0,0.1);margin-bottom:2px}
.list-th{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-mid)}
.file-list{display:flex;flex-direction:column}
.file-row{display:grid;grid-template-columns:44px 60px 1fr;gap:0 8px;padding:6px 0;cursor:pointer;border-bottom:0.5px solid rgba(0,0,0,0.05);align-items:baseline;transition:background 0.12s}
.file-row:hover .file-title{color:var(--ink)}
.file-row.active-row .file-title{color:var(--ink);font-weight:500}
.file-year{font-size:10px;color:var(--ink-mid);white-space:nowrap;letter-spacing:0.02em;font-family:'EB Garamond',serif}
.file-cat{font-size:10px;color:var(--ink-mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-title{font-family:'EB Garamond',serif;font-size:12px;color:var(--ink-mid);line-height:1.4;transition:color 0.15s;min-width:0}

/* ── 상세 컬럼 ── */
.detail-col{flex:1;min-width:0;padding:20px 48px 40px 36px;overflow-y:auto;scrollbar-width:none}
.detail-col::-webkit-scrollbar{display:none}
.detail-panel{opacity:0;transition:opacity 0.4s ease;pointer-events:none}
.detail-panel.visible{opacity:1;pointer-events:all}
.detail-year{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-mid);margin-bottom:4px;font-weight:500}
.detail-cat{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-mid);margin-bottom:12px}
.detail-title{font-family:'EB Garamond',serif;font-size:19px;color:var(--ink);line-height:1.4;margin-bottom:16px}
.detail-img{width:100%;max-width:400px;display:block;margin-bottom:16px;object-fit:cover}
.detail-desc{font-family:'EB Garamond',serif;font-size:14px;color:var(--ink-mid);line-height:1.9;margin-bottom:16px;white-space:pre-wrap}
.detail-place{font-size:12px;color:var(--ink-mid);margin-bottom:12px;font-family:'EB Garamond',serif}
.detail-link{display:inline-flex;align-items:center;gap:4px;margin-top:4px;font-size:9.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-mid);text-decoration:none;padding:0 1px;border:0.3px solid rgba(74,74,71,0.25);border-radius:2px;transition:background 0.15s}
.detail-link:hover{background:rgba(74,74,71,0.06)}
.empty-state{padding:40px 0;font-family:'EB Garamond',serif;font-style:italic;font-size:13px;color:var(--ink-dim);letter-spacing:0.1em}
.loading{padding:40px 0;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-mid)}

/* ── 모바일 ── */
@media(max-width:600px){
  html,body{overflow:hidden;height:100%}
  .lang-bar{height:36px;padding:0 14px}
  .page-body{top:calc(var(--nav-h) + 36px)}
  .stmt-block{padding:14px 20px;max-height:35%}
  .stmt-text{font-size:12px;line-height:1.75}
  .three-col{flex-direction:column}
  .left-panel{flex-shrink:0;width:100%;height:38px;flex-direction:row;align-items:center;justify-content:center;padding:0;border-bottom:0.5px solid rgba(0,0,0,0.08);border-top:0.5px solid rgba(0,0,0,0.06);background:var(--bg)}
  .tab-list{flex-direction:row;gap:0;width:100%}
  .tab-item{font-size:9px;letter-spacing:0.1em;line-height:38px;flex:1;text-align:center;padding:0;white-space:nowrap}
  .tab-item.active::after{display:none}
  .list-col{flex:1;width:100%;border-right:none;padding:0 16px 40px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .list-header{grid-template-columns:36px 52px 1fr;gap:0 6px;padding:6px 0}
  .file-row{grid-template-columns:36px 52px 1fr;gap:0 6px;padding:8px 0}
  .file-year{font-size:9.5px}
  .file-cat{font-size:9px}
  .file-title{font-size:12px}
  .detail-col{display:none}
  /* 모바일 인라인 상세 */
  .m-inline-detail{display:none;padding:12px 14px 18px 8px;border-bottom:0.5px solid rgba(0,0,0,0.06);background:rgba(255,255,255,0.55);animation:mFadeIn 0.22s ease}
  .m-inline-detail.open{display:block}
  @keyframes mFadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .m-detail-year{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-mid);margin-bottom:4px;font-weight:500}
  .m-detail-cat{font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:8px}
  .m-detail-title{font-family:'EB Garamond',serif;font-size:14px;color:var(--ink);line-height:1.4;margin-bottom:10px}
  .m-detail-img{width:100%;max-width:100%;display:block;margin-bottom:12px}
  .m-detail-desc{font-family:'EB Garamond',serif;font-size:12px;color:var(--ink-mid);line-height:1.9;margin-bottom:10px;white-space:pre-wrap}
  .m-detail-place{font-size:10px;color:var(--ink-dim);margin-bottom:10px}
  .m-detail-link{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-mid);text-decoration:none;padding:0 1px;border:0.3px solid rgba(74,74,71,0.25);border-radius:2px}
}

/* ── 페이지 전환 ── */
@keyframes pageFadeIn{from{opacity:0}to{opacity:1}}
.page-fade{animation:pageFadeIn 0.4s ease forwards}
body.fade-out{opacity:0;transition:opacity 0.3s ease}

/* ── 로딩 화면 ── */
#page-loader{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;opacity:1;transition:opacity 0.6s cubic-bezier(0.16,1,0.3,1);pointer-events:all}
#page-loader.hidden{opacity:0;pointer-events:none}
.loader-inner{display:flex;flex-direction:column;align-items:center;gap:20px}
.loader-name{font-family:'EB Garamond',serif;font-style:italic;font-size:clamp(18px,3vw,28px);letter-spacing:0.18em;color:var(--ink);opacity:0;animation:loaderFadeIn 0.8s ease 0.2s forwards}
.loader-line{width:0;height:0.5px;background:var(--ink);opacity:0.3;animation:loaderLine 1s cubic-bezier(0.16,1,0.3,1) 0.4s forwards}
@keyframes loaderFadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes loaderLine{from{width:0}to{width:clamp(80px,12vw,140px)}}

<body>
<div id="page-loader"><div class="loader-inner"><div class="loader-name">Won Jeong Cho</div><div class="loader-line"></div></div></div>

<nav>
  <span class="nav-logo" onclick="go('index')">Won Jeong Cho</span>
  <div class="nav-right">
    <div class="nav-dd" id="navArchive">
      <span class="nav-item">Archive</span>
      <div class="nav-dd-menu">
        <span class="nav-dd-item" onclick="go('year')">Year</span>
        <span class="nav-dd-item" onclick="go('context')">Context</span>
      </div>
    </div>
    <div class="nav-sep"></div>
    <span class="nav-item active">Text</span>
    <div class="nav-sep"></div>
    <span class="nav-item" onclick="go('about')">About</span>
  </div>
</nav>

<div class="lang-bar">
  <div class="lang-toggle">
    <button class="lang-btn active" id="btnKo" onclick="setLang('ko')">한국어</button>
    <button class="lang-btn" id="btnEn" onclick="setLang('en')">English</button>
  </div>
</div>

<div class="page-body">
  <div class="desktop-wrap">

    <!-- Artist Statement (작가노트 탭에서만 표시) -->
    <div class="stmt-block" id="stmtBlock">
      <div class="stmt-label" id="stmtLabel">Artist Statement</div>
      <div class="stmt-text" id="stmtText"></div>
      <a class="stmt-link" id="stmtLink" href="#" target="_blank" style="display:none">PDF 열기 ↗</a>
    </div>

    <div class="three-col">
      <!-- 좌측 탭 -->
      <div class="left-panel" id="leftPanel">
        <div class="tab-list" id="tabList"></div>
      </div>

      <!-- 리스트 -->
      <div class="list-col" id="listCol">
        <div class="list-header" id="listHeader">
          <span class="list-th" id="thYear">년도</span>
          <span class="list-th" id="thCat">구분</span>
          <span class="list-th" id="thTitle">제목</span>
        </div>
        <div id="listInner"><div class="loading">Loading…</div></div>
      </div>

      <!-- 상세 -->
      <div class="detail-col">
        <div class="detail-panel" id="detailPanel">
          <div class="detail-year" id="detailYear"></div>
          <div class="detail-cat" id="detailCat"></div>
          <div class="detail-title" id="detailTitle"></div>
          <img class="detail-img" id="detailImg" src="" alt="" style="display:none">
          <div class="detail-desc" id="detailDesc"></div>
          <div class="detail-place" id="detailPlace" style="display:none"></div>
          <a class="detail-link" id="detailLink" href="#" target="_blank" style="display:none">PDF 열기 ↗</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
var TEXT_DATA={}, TABS=[], STATEMENT={ko:'',en:''};
var currentTab='', lang='ko', mOpenIdx=null, currentDetailRow=null;

function go(p){window.location.href=p+'.html';}
function sel(id){return document.getElementById(id);}
function isMobile(){return window.innerWidth<=600;}
function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

document.querySelectorAll('.nav-dd').forEach(function(dd){
  var menu=dd.querySelector('.nav-dd-menu'),timer;
  dd.addEventListener('mouseenter',function(){clearTimeout(timer);menu.style.display='block';});
  dd.addEventListener('mouseleave',function(){timer=setTimeout(function(){menu.style.display='none';},150);});
  menu.addEventListener('mouseenter',function(){clearTimeout(timer);});
  menu.addEventListener('mouseleave',function(){timer=setTimeout(function(){menu.style.display='none';},150);});
  dd.querySelector('.nav-item').addEventListener('click',function(e){
    e.stopPropagation();
    var isOpen=menu.style.display==='block';
    document.querySelectorAll('.nav-dd-menu').forEach(function(m){m.style.display='none';});
    if(!isOpen)menu.style.display='block';
  });
});
document.addEventListener('click',function(e){
  if(!e.target.closest||!e.target.closest('.nav-dd'))
    document.querySelectorAll('.nav-dd-menu').forEach(function(m){m.style.display='none';});
});

function setLang(l){
  if(lang===l)return;
  lang=l;
  sel('btnKo').classList.toggle('active',l==='ko');
  sel('btnEn').classList.toggle('active',l==='en');
  renderStmt();
  renderList();
  if(!isMobile()&&sel('detailPanel').classList.contains('visible'))renderDetail(currentDetailRow);
}

/* Statement */
function renderStmt(){
  var txt=lang==='ko'?(STATEMENT.ko||STATEMENT.en):(STATEMENT.en||STATEMENT.ko);
  if(!txt){sel('stmtBlock').classList.remove('show');return;}
  var el=sel('stmtText');
  el.classList.add('fade');
  setTimeout(function(){el.textContent=txt;el.classList.remove('fade');},180);
}

function showStmt(show){
  if(show&&(STATEMENT.ko||STATEMENT.en)){
    sel('stmtBlock').classList.add('show');
    renderStmt();
    if(STATEMENT.link){sel('stmtLink').href=STATEMENT.link;sel('stmtLink').style.display='inline-flex';}
  } else {
    sel('stmtBlock').classList.remove('show');
  }
}

/* 탭 */
function buildTabs(){
  var list=sel('tabList');list.innerHTML='';
  TABS.forEach(function(name){
    var div=document.createElement('div');
    div.className='tab-item'+(name===currentTab?' active':'');
    div.textContent=name;
    div.addEventListener('click',function(){switchTab(name);});
    list.appendChild(div);
  });
}

function switchTab(name){
  currentTab=name;mOpenIdx=null;
  document.querySelectorAll('.tab-item').forEach(function(el){el.classList.toggle('active',el.textContent.trim()===name);});
  sel('detailPanel').classList.remove('visible');
  currentDetailRow=null;
  /* 작가노트 탭에서만 Statement 표시 */
  showStmt(name==='작가노트'||name==='Artist Notes');
  renderList();
}

/* 리스트 */
function renderList(){
  var inner=sel('listInner');
  var rows=TEXT_DATA[currentTab]||[];
  var ko=(lang==='ko');
  if(!rows.length){inner.innerHTML='<div class="empty-state">—</div>';return;}

  if(isMobile()){
    inner.innerHTML='<div class="file-list">'+rows.map(function(row,i){
      var title=ko?(row.title||row.filename||''):(row.title||row.filename||'');
      var desc=ko?(row.desc_ko||row.desc||''):(row.desc_en||row.desc||'');
      var imgHtml=row.img?'<img class="m-detail-img" src="'+driveThumb(row.img,'w600')+'" alt="">':'';
      return '<div class="file-row" id="row-'+i+'" onclick="toggleMobile('+i+')">'
        +'<span class="file-year">'+(row.year||'')+'</span>'
        +'<span class="file-cat">'+escH(row.category||'')+'</span>'
        +'<span class="file-title">'+escH(title)+'</span>'
        +'</div>'
        +'<div class="m-inline-detail" id="m-detail-'+i+'">'
        +'<div class="m-detail-year">'+(row.year||'')+'</div>'
        +'<div class="m-detail-cat">'+escH(row.category||'')+'</div>'
        +'<div class="m-detail-title">'+escH(title)+'</div>'
        +imgHtml
        +'<div class="m-detail-desc" id="m-desc-'+i+'">'+escH(desc)+'</div>'
        +(row.place?'<div class="m-detail-place">'+escH(row.place)+'</div>':'')
        +(row.link?'<a class="m-detail-link" href="'+row.link+'" target="_blank">PDF 열기 ↗</a>':'')
        +'</div>';
    }).join('')+'</div>';
  } else {
    inner.innerHTML='<div class="file-list">'+rows.map(function(row,i){
      var title=ko?(row.title||row.filename||''):(row.title||row.filename||'');
      return '<div class="file-row" id="row-'+i+'" onclick="showDetail('+i+')">'
        +'<span class="file-year">'+(row.year||'')+'</span>'
        +'<span class="file-cat">'+escH(row.category||'')+'</span>'
        +'<span class="file-title">'+escH(title)+'</span>'
        +'</div>';
    }).join('')+'</div>';
  }
}

/* 드라이브 썸네일 변환 */
function driveThumb(url, sz){
  if(!url)return'';
  var m=url.match(/\/d\/([a-zA-Z0-9_-]{10,})/);
  return m?'https://drive.google.com/thumbnail?id='+m[1]+'&sz='+(sz||'w400'):url;
}

/* 모바일 토글 */
function toggleMobile(idx){
  var rows=TEXT_DATA[currentTab]||[];
  if(mOpenIdx===idx){
    sel('m-detail-'+idx).classList.remove('open');
    sel('row-'+idx).classList.remove('active-row');
    mOpenIdx=null;return;
  }
  if(mOpenIdx!==null){
    sel('m-detail-'+mOpenIdx).classList.remove('open');
    sel('row-'+mOpenIdx).classList.remove('active-row');
  }
  mOpenIdx=idx;
  sel('m-detail-'+idx).classList.add('open');
  sel('row-'+idx).classList.add('active-row');
  var row=rows[idx];
  if(row){
    var desc=lang==='ko'?(row.desc_ko||row.desc||''):(row.desc_en||row.desc||'');
    var el=sel('m-desc-'+idx);if(el)el.textContent=desc;
  }
  setTimeout(function(){var el=sel('m-detail-'+idx);if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'});},50);
}

/* PC 상세 */
function showDetail(idx){
  var rows=TEXT_DATA[currentTab]||[];
  var row=rows[idx];if(!row)return;
  document.querySelectorAll('.file-row').forEach(function(r){r.classList.remove('active-row');});
  var ar=sel('row-'+idx);if(ar)ar.classList.add('active-row');
  currentDetailRow=row;
  renderDetail(row);
  sel('detailPanel').classList.add('visible');
}

function renderDetail(row){
  if(!row)return;
  var ko=(lang==='ko');
  var title=ko?(row.title||row.filename||''):(row.title||row.filename||'');
  var desc=ko?(row.desc_ko||row.desc||''):(row.desc_en||row.desc||'');
  sel('detailYear').textContent=row.year||'';
  sel('detailCat').textContent=row.category||'';
  sel('detailTitle').textContent=title;
  sel('detailDesc').textContent=desc;
  /* 이미지 */
  var imgEl=sel('detailImg');
  if(row.img){
    imgEl.src=driveThumb(row.img,'w600');
    imgEl.style.display='block';
  } else {
    imgEl.src='';imgEl.style.display='none';
  }
  /* place */
  var placeEl=sel('detailPlace');
  if(row.place){placeEl.textContent=row.place;placeEl.style.display='block';}
  else placeEl.style.display='none';
  /* link */
  var lk=sel('detailLink');
  if(row.link){lk.href=row.link;lk.style.display='inline-flex';}
  else lk.style.display='none';
}

/* 모바일 탭 위치 조정 */
function relocateTabBar(){
  if(!isMobile())return;
  var panel=sel('leftPanel');
  var threeCol=panel&&panel.closest('.three-col');
  var wrap=threeCol&&threeCol.parentNode;
  if(panel&&threeCol&&wrap)wrap.insertBefore(panel,threeCol);
}

/* 데이터 로드 */
fetch('./data/text.json?v='+Date.now(),{cache:'no-store'})
  .then(function(r){return r.json();})
  .then(function(result){
    TEXT_DATA=result.data||{};
    TABS=result.tabs||[];
    STATEMENT=result.statement||{ko:'',en:''};
    currentTab=TABS[0]||'';
    buildTabs();
    relocateTabBar();
    showStmt(currentTab==='작가노트'||currentTab==='Artist Notes');
    renderList();
    /* 헤더 레이블 */
    sel('thYear').textContent=lang==='ko'?'년도':'Year';
    sel('thCat').textContent=lang==='ko'?'구분':'Type';
    sel('thTitle').textContent=lang==='ko'?'제목':'Title';
  })
  .catch(function(){
    sel('listInner').innerHTML='<div class="loading">데이터를 불러올 수 없습니다.</div>';
  });

/* 로딩 화면 제거 */
window.addEventListener('load',function(){
  var loader=document.getElementById('page-loader');
  if(loader){setTimeout(function(){loader.classList.add('hidden');setTimeout(function(){loader.style.display='none';},650);},400);}
});
</script>
