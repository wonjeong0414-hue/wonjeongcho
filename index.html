<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1a1a18;--ink-mid:#4a4a47;--ink-dim:#7a7a74;--bg:#f7f6f3;--white:#fff;--nav-h:50px}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{font-family:'Cormorant Garamond',serif;display:flex;flex-direction:column}

/* ── nav ── */
nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 36px;z-index:100;background:var(--bg);border-bottom:0.5px solid rgba(0,0,0,0.08)}
@media(max-width:600px){nav{padding:0 12px}}
.nav-logo{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:13px;letter-spacing:0.28em;color:var(--ink);text-transform:uppercase;opacity:0;animation:fadeIn 1s ease 0.3s forwards;cursor:pointer}
.nav-right{display:flex;align-items:center;height:100%;opacity:0;animation:fadeIn 1s ease 0.5s forwards}
.nav-item{font-size:9.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-dim);padding:5px 11px;cursor:pointer;text-decoration:none;transition:color 0.25s;white-space:nowrap;position:relative;line-height:1;display:flex;align-items:center}
.nav-item::after{content:'';position:absolute;bottom:0;left:11px;right:11px;height:0.5px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform 0.28s cubic-bezier(0.16,1,0.3,1);opacity:0.5}
.nav-item:hover{color:var(--ink)}
.nav-item:hover::after{transform:scaleX(1)}
.nav-item.active{color:var(--ink)}
.nav-item.active::after{transform:scaleX(1)}
.nav-sep{width:0.5px;height:12px;background:rgba(0,0,0,0.12);margin:0 5px;flex-shrink:0}
.nav-dropdown{position:relative;display:flex;align-items:center}
.nav-dropdown-menu{display:none;position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--white);border:0.5px solid rgba(0,0,0,0.08);border-radius:4px;padding:4px 0;min-width:90px;width:max-content;z-index:200;box-shadow:0 4px 14px rgba(0,0,0,0.07)}
.nav-dropdown-item{display:block;font-size:9px;letter-spacing:0.1em;color:var(--ink-mid);padding:6px 14px;cursor:pointer;transition:color 0.15s,background 0.15s;white-space:nowrap;text-transform:uppercase}
.nav-dropdown-item:hover{color:var(--ink);background:rgba(0,0,0,0.03)}

/* ── shell ── */
.shell{
  position:fixed;top:var(--nav-h);left:0;right:0;bottom:0;
  display:flex;flex-direction:column;align-items:center;
  /* 이미지 약간 위쪽 배치 */
  justify-content:flex-start;
  padding-top:clamp(20px,5vh,52px);
  overflow:hidden;
}

/* ── 이미지 박스 ── */
.img-box{
  width:min(58vw,580px);
  height:min(68vh,620px);
  flex-shrink:0;position:relative;overflow:hidden;cursor:pointer;
}
.img-bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform 0.6s ease}
.img-box:hover .img-bg{transform:scale(1.006)}
.img-overlay{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:28px;background:linear-gradient(to top,rgba(247,246,243,0.75) 0%,transparent 38%)}
@keyframes bob{0%,100%{opacity:0.35;transform:translateY(0) translateX(-50%)}50%{opacity:0.6;transform:translateY(4px) translateX(-50%)}}
.scroll-cue{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:13px;color:var(--ink-mid);animation:bob 2.2s ease-in-out infinite;cursor:pointer;opacity:0;transition:opacity 0.5s ease}
.scroll-cue.visible{opacity:0.35}

/* ── work-info (이미지 아래 작품명 + 설명) ── */
.work-info{
  width:min(58vw,540px);flex-shrink:0;
  display:flex;justify-content:space-between;align-items:baseline;
  padding:8px 0;border-top:0.5px solid rgba(0,0,0,0.1);
  opacity:0;transition:opacity 0.7s ease 0.2s;
}
.work-info.visible{opacity:1}
.wi-left .wi-title{font-family:'EB Garamond',serif;font-size:14px;color:var(--ink)}
.wi-left .wi-meta{font-size:9px;letter-spacing:0.12em;color:var(--ink-dim);text-transform:uppercase;margin-top:3px}
.wi-desc{font-size:10px;color:var(--ink-mid);line-height:1.8;flex:1;max-width:45%;text-align:right;word-break:keep-all}

/* ── 이미지 위 떠다니는 Tactile Thinking ── */
@keyframes gentleFloat{
  0%,100%{transform:translateY(0);opacity:0.9}
  40%{transform:translateY(-7px);opacity:1}
  70%{transform:translateY(3px);opacity:0.85}
}
.work-title{
  font-family:'EB Garamond',serif;
  font-style:italic;
  font-weight:500;
  font-size:32px;
  color:var(--ink);
  letter-spacing:0.06em;
  line-height:1;
  opacity:0;
  transition:opacity 0.9s ease;
  animation:gentleFloat 6s ease-in-out infinite;
  text-shadow:0 2px 20px rgba(247,246,243,0.9);
  display:inline-block;
}
.work-title.visible{opacity:1}

@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
/* ── 모바일 ── */
@media(max-width:600px){
  /* nav: logo 작게, 한 줄에 메뉴와 나란히 */
  .nav-logo{
    font-size:9px !important;
    letter-spacing:0.18em !important;
  }
  .nav-item{font-size:8px !important;padding:4px 7px !important}
  .nav-sep{margin:0 2px !important}

  /* shell: padding 줄여서 이미지 크게 */
  .shell{
    padding-top:clamp(8px,2vh,20px);
  }

  /* 이미지 모바일에서 크게 */
  .img-box{
    width:84vw !important;
    height:52vh !important;
  }

  /* work-info 너비 맞추기 */
  .work-info{
    width:84vw !important;
  }

  /* Tactile Thinking 가운데 정렬 */
  .img-overlay{
    justify-content:center !important;
    align-items:flex-end !important;
  }
  .work-title{
    font-size:22px !important;
    text-align:center;
  }
}

/* ── 페이지 전환 fade ── */
@keyframes pageFadeIn{from{opacity:0}to{opacity:1}}
.page-fade{animation:pageFadeIn 0.4s ease forwards}
body.fade-out{opacity:0;transition:opacity 0.3s ease}

/* ── 로딩 화면 ── */
#page-loader{
  position:fixed;inset:0;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  z-index:9999;
  opacity:1;
  transition:opacity 0.6s cubic-bezier(0.16,1,0.3,1);
  pointer-events:all;
}
#page-loader.hidden{opacity:0;pointer-events:none}
.loader-inner{
  display:flex;flex-direction:column;align-items:center;gap:20px;
}
.loader-name{
  font-family:'EB Garamond',serif;
  font-style:italic;
  font-size:clamp(18px,3vw,28px);
  letter-spacing:0.18em;
  color:var(--ink);
  opacity:0;
  animation:loaderFadeIn 0.8s ease 0.2s forwards;
}
.loader-line{
  width:0;
  height:0.5px;
  background:var(--ink);
  opacity:0.3;
  animation:loaderLine 1s cubic-bezier(0.16,1,0.3,1) 0.4s forwards;
}
@keyframes loaderFadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes loaderLine{from{width:0}to{width:clamp(80px,12vw,140px)}}
</style>

<!-- 로딩 화면 -->
<div id="page-loader">
  <div class="loader-inner">
    <div class="loader-name">Won Jeong Cho</div>
    <div class="loader-line"></div>
  </div>
</div>
<body>
<nav>
  <span class="nav-logo" onclick="go('index')">Won Jeong Cho</span>
  <div class="nav-right">
    <div class="nav-dropdown">
      <span class="nav-item">Archive</span>
      <div class="nav-dropdown-menu">
        <span class="nav-dropdown-item" onclick="go('year')">Year</span>
        <span class="nav-dropdown-item" onclick="go('context')">Context</span>
      </div>
    </div>
    <div class="nav-sep"></div>
    <span class="nav-item" onclick="go('text')">Text</span>
    <div class="nav-sep"></div>
    <span class="nav-item" onclick="go('about')">About</span>
  </div>
</nav>

<div class="shell">
  <div class="img-box" id="imgBox">
    <div class="img-bg" id="imgBg"></div>
    <div class="img-overlay">
      <div class="work-title" id="workTitle"></div>
    </div>
    <div class="scroll-cue" id="scrollCue">&#8595;</div>
  </div>

  <div class="work-info" id="workInfo">
    <div class="wi-left">
      <div class="wi-title" id="wiTitle"></div>
      <div class="wi-meta" id="wiMeta"></div>
    </div>
    <div class="wi-desc" id="wiDesc"></div>
  </div>
</div>
</div>

<script>

/* ── 페이지 전환 ── */
function go(page){
  document.body.classList.add('fade-out');
  setTimeout(function(){window.location.href=page+'.html';},280);
}
document.addEventListener('DOMContentLoaded',function(){
  document.body.classList.add('page-fade');
});


document.querySelectorAll('.nav-dropdown').forEach(function(dd){
  var menu=dd.querySelector('.nav-dropdown-menu'),timer;
  dd.addEventListener('mouseenter',function(){clearTimeout(timer);menu.style.display='block';});
  dd.addEventListener('mouseleave',function(){timer=setTimeout(function(){menu.style.display='none';},150);});
  menu.addEventListener('mouseenter',function(){clearTimeout(timer);});
  menu.addEventListener('mouseleave',function(){timer=setTimeout(function(){menu.style.display='none';},150);});
});

fetch('./data/main.json')
  .then(function(r){return r.json();})
  .then(function(result){
    var main=result.main; if(!main) return;
    var imgUrl=main.imgUrl||main.thumb||'';
    var img=new Image();
    img.onload=function(){
      document.getElementById('imgBg').style.backgroundImage="url('"+imgUrl+"')";
      setTimeout(function(){
        document.getElementById('workTitle').textContent='Tactile Thinking';
        document.getElementById('workTitle').classList.add('visible');
        document.getElementById('workInfo').classList.add('visible');
        document.getElementById('scrollCue').classList.add('visible');
      },350);
    };
    img.onerror=function(){
      document.getElementById('workTitle').textContent='Tactile Thinking';
        document.getElementById('workTitle').classList.add('visible');
        document.getElementById('workInfo').classList.add('visible');
    };
    img.src=imgUrl;
    document.getElementById('wiTitle').textContent=main.title||'';
    document.getElementById('wiMeta').textContent=(main.year||'')+(main.medium?' · '+main.medium:'');
    document.getElementById('wiDesc').textContent=main.desc||'';
  })
  .catch(function(){
    document.getElementById('workTitle').textContent='Tactile Thinking';
        document.getElementById('workTitle').classList.add('visible');
        document.getElementById('workInfo').classList.add('visible');
    document.getElementById('heroText').classList.add('visible');
  });

/* ── 로딩 화면 제거 ── */
window.addEventListener('load', function(){
  var loader = document.getElementById('page-loader');
  if(loader){
    setTimeout(function(){
      loader.classList.add('hidden');
      setTimeout(function(){loader.style.display='none';}, 650);
    }, 400);
  }
});
</script>
</body>
</html>
