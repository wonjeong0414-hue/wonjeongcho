<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1a1a18;--ink-mid:#4a4a47;--ink-dim:#7a7a74;--bg:#f7f6f3;--white:#fff;--nav-h:50px}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{font-family:'Cormorant Garamond',serif;display:flex;flex-direction:column}

/* ── nav ── */
nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 36px;z-index:100;background:var(--bg);border-bottom:0.5px solid rgba(0,0,0,0.08)}
@media(max-width:600px){nav{padding:0 12px}}
.nav-logo{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:13px;letter-spacing:0.28em;color:var(--ink);text-transform:uppercase;opacity:0;animation:fadeIn 1s ease 0.3s forwards;cursor:pointer}
.nav-right{display:flex;align-items:center;height:100%;opacity:0;animation:fadeIn 1s ease 0.5s forwards}
.nav-item{font-size:9.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-dim);padding:5px 11px;cursor:pointer;text-decoration:none;transition:color 0.25s;white-space:nowrap;position:relative;line-height:1;display:flex;align-items:center}
.nav-item::after{content:'';position:absolute;bottom:0;left:11px;right:11px;height:0.5px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform 0.28s cubic-bezier(0.16,1,0.3,1);opacity:0.5}
.nav-item:hover{color:var(--ink)}
.nav-item:hover::after{transform:scaleX(1)}
.nav-item.active{color:var(--ink)}
.nav-item.active::after{transform:scaleX(1)}
.nav-sep{width:0.5px;height:12px;background:rgba(0,0,0,0.12);margin:0 5px;flex-shrink:0}
.nav-dropdown{position:relative;display:flex;align-items:center}
.nav-dropdown-menu{display:none;position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--white);border:0.5px solid rgba(0,0,0,0.08);border-radius:4px;padding:4px 0;min-width:90px;width:max-content;z-index:200;box-shadow:0 4px 14px rgba(0,0,0,0.07)}
.nav-dropdown-item{display:block;font-size:9px;letter-spacing:0.1em;color:var(--ink-mid);padding:6px 14px;cursor:pointer;transition:color 0.15s,background 0.15s;white-space:nowrap;text-transform:uppercase}
.nav-dropdown-item:hover{color:var(--ink);background:rgba(0,0,0,0.03)}

/* ── shell ── */
.shell{
  position:fixed;top:var(--nav-h);left:0;right:0;bottom:0;
  display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;
  padding:clamp(28px,9vh,64px) clamp(16px,4vw,36px) max(12px, env(safe-area-inset-bottom));
  overflow:hidden;
}
.hero-main{
  display:flex;flex-direction:column;align-items:center;
  flex-shrink:0;max-width:100%;
}

/* ── 이미지 박스: 데스크톱 원본 비율 ── */
.img-box{
  max-width:min(86vw,820px);
  max-height:min(72vh,720px);
  flex-shrink:0;
  position:relative;
  overflow:hidden;
  cursor:pointer;
  opacity:0;
  transition:opacity 0.7s ease, transform 0.7s cubic-bezier(0.16,1,0.3,1);
}
.img-box.visible{opacity:1}

.img-inner{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
}

.img-box img{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center;
  transition:transform 0.7s cubic-bezier(0.16,1,0.3,1);
}
.img-box:hover img{transform:scale(1.008)}

.img-overlay{
  position:absolute;inset:0;
  display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:28px;
  pointer-events:none;
}

/* scroll cue */
@keyframes bob{0%,100%{opacity:0.35;transform:translateY(0) translateX(-50%)}50%{opacity:0.6;transform:translateY(4px) translateX(-50%)}}
.scroll-cue{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  font-size:13px;color:var(--ink-mid);
  animation:bob 2.2s ease-in-out infinite;
  cursor:pointer;opacity:0;transition:opacity 0.5s ease;
  pointer-events:auto;
}
.scroll-cue.visible{opacity:0.35}

.work-info{display:none !important}

/* ── Tactile Thinking: 필기 스크립트 ── */
@keyframes scriptWrite{
  from{clip-path:inset(0 100% 0 0);opacity:0.75}
  to{clip-path:inset(0 0 0 0);opacity:1}
}
@keyframes scriptFloat{
  0%,100%{transform:translateY(0)}
  45%{transform:translateY(-8px)}
  70%{transform:translateY(4px)}
}
.work-title{
  font-family:'Allura','Mr Dafoe',cursive;
  font-weight:400;font-size:clamp(32px,5vw,52px);
  color:var(--ink);line-height:1.1;
  letter-spacing:0.06em;
  white-space:nowrap;
  margin:0;
  text-align:center;
  display:inline-block;
  clip-path:inset(0 100% 0 0);
  opacity:0;
  font-feature-settings:"liga" 1,"calt" 1;
  pointer-events:none;
  text-shadow:0 2px 20px rgba(247,246,243,0.92),0 0 1px rgba(247,246,243,0.75);
}
.work-title.visible{
  animation:scriptWrite 2.6s cubic-bezier(0.22,0.85,0.28,1) forwards,
             scriptFloat 7s ease-in-out 2.7s infinite;
}

@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ── 전환 오버레이 (클릭/스크롤 → context 이동) ── */
#transition-overlay{
  position:fixed;inset:0;
  background:var(--bg);
  z-index:9000;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.55s cubic-bezier(0.4,0,0.2,1);
}
#transition-overlay.active{
  opacity:1;
  pointer-events:all;
}

/* 이미지가 위로 슬라이드되며 사라지는 효과 */
.shell.exiting{
  transform:translateY(-18px);
  opacity:0;
  transition:transform 0.55s cubic-bezier(0.4,0,0.2,1), opacity 0.45s ease;
}

/* ── 페이지 전환 fade ── */
@keyframes pageFadeIn{from{opacity:0}to{opacity:1}}
.page-fade{animation:pageFadeIn 0.4s ease forwards}
body.fade-out{opacity:0;transition:opacity 0.3s ease}

/* ── 로딩 화면 ── */
#page-loader{
  position:fixed;inset:0;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  z-index:9999;opacity:1;
  transition:opacity 0.6s cubic-bezier(0.16,1,0.3,1);
  pointer-events:all;
}
#page-loader.hidden{opacity:0;pointer-events:none}
.loader-inner{display:flex;flex-direction:column;align-items:center;gap:20px}
.loader-name{
  font-family:'EB Garamond',serif;font-style:italic;
  font-size:clamp(18px,3vw,28px);letter-spacing:0.18em;color:var(--ink);
  opacity:0;animation:loaderFadeIn 0.8s ease 0.2s forwards;
}
.loader-line{
  width:0;height:0.5px;background:var(--ink);opacity:0.3;
  animation:loaderLine 1s cubic-bezier(0.16,1,0.3,1) 0.4s forwards;
}
@keyframes loaderFadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes loaderLine{from{width:0}to{width:clamp(80px,12vw,140px)}}

/* ── 모바일 ── */
@media(max-width:600px){
  .nav-sep{margin:0 2px !important}
  .shell{
    justify-content:flex-start;
    padding-top:clamp(8px,2vh,16px);
  }
  .img-box{
    display:flex;
    flex-direction:column;
    align-items:center;
    max-width:none;
    max-height:none;
    height:auto !important;
    overflow:visible;
  }
  .img-inner{
    aspect-ratio:1/1;
    flex-shrink:0;
  }
  .img-box img{object-fit:cover}
  .img-overlay{
    position:static;
    inset:auto;
    padding:0;
    margin-top:clamp(12px,2vh,18px);
    align-items:center;
  }
  .work-title{
    font-size:clamp(26px,7.5vw,34px) !important;
    text-shadow:none;
  }
  .wi-medium{display:none}
}

@media(max-width:600px){.nav-logo{touch-action:manipulation;-webkit-tap-highlight-color:transparent}.nav-item{min-height:44px;display:inline-flex;align-items:center;padding:0 9px;font-size:9px;letter-spacing:0.12em;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.nav-sep{margin:0 2px}.nav-dd-item{min-height:44px;display:flex;align-items:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.nav-dropdown-item{font-size:12px;padding:3px 16px;display:block;min-height:unset;touch-action:manipulation;-webkit-tap-highlight-color:transparent}}

<body>

<script>
/* ───────────────────────────────────────────
   일반 페이지 전환 (nav 메뉴용)
─────────────────────────────────────────── */
function go(page){
  document.body.classList.add('fade-out');
  setTimeout(function(){window.location.href = page + '.html';}, 280);
}

document.addEventListener('DOMContentLoaded', function(){
  document.body.classList.add('page-fade');
});

/* ───────────────────────────────────────────
   context 페이지로 부드럽게 전환
─────────────────────────────────────────── */
var transitioning = false;

function goContext(){
  if(transitioning) return;
  transitioning = true;

  var shell   = document.getElementById('shell');
  var overlay = document.getElementById('transition-overlay');

  /* 1) shell을 위로 살짝 올리며 페이드 아웃 */
  shell.classList.add('exiting');

  /* 2) 배경 오버레이 페이드 인 (약간 딜레이) */
  setTimeout(function(){
    overlay.classList.add('active');
  }, 80);

  /* 3) 전환 완료 후 이동 */
  setTimeout(function(){
    window.location.href = 'context.html';
  }, 600);
}

/* ───────────────────────────────────────────
   Nav dropdown
─────────────────────────────────────────── */
document.querySelectorAll('.nav-dropdown').forEach(function(dd){
  var menu = dd.querySelector('.nav-dropdown-menu'), timer;
  dd.addEventListener('mouseenter', function(){ clearTimeout(timer); menu.style.display = 'block'; });
  dd.addEventListener('mouseleave', function(){ timer = setTimeout(function(){ menu.style.display = 'none'; }, 150); });
  menu.addEventListener('mouseenter', function(){ clearTimeout(timer); });
  menu.addEventListener('mouseleave', function(){ timer = setTimeout(function(){ menu.style.display = 'none'; }, 150); });
});

/* ───────────────────────────────────────────
   데이터 로드 & 이미지 비율 처리
─────────────────────────────────────────── */
function driveIdFromUrl(url){
  var m = String(url||'').match(/(?:\/d\/|id=)([a-zA-Z0-9_-]+)/);
  return m ? m[1] : '';
}
function driveImageCandidates(url){
  var id = driveIdFromUrl(url);
  if(!id) return url ? [url] : [];
  return [
    'https://drive.google.com/thumbnail?id='+id+'&sz=w1200',
    'https://drive.google.com/thumbnail?id='+id+'&sz=w800',
    'https://drive.google.com/thumbnail?id='+id+'&sz=w400',
    'https://drive.google.com/uc?export=view&id='+id
  ];
}
function showWorkTitle(){
  var el = document.getElementById('workTitle');
  el.textContent = 'Tactile Thinking';
  el.classList.add('visible');
}

function loadMainImage(imgEl, url, onLoad, onFail){
  var list = driveImageCandidates(url);
  var idx = 0;
  imgEl.referrerPolicy = 'no-referrer';
  function attempt(){
    if(idx >= list.length){ if(onFail) onFail(); return; }
    imgEl.onload = onLoad;
    imgEl.onerror = function(){ idx++; attempt(); };
    imgEl.src = list[idx++];
  }
  attempt();
}

fetch('./data/main.json?v='+Date.now(), { cache: 'no-store' })
  .then(function(r){ return r.json(); })
  .then(function(result){
    var main = result.main;
    if(!main) return;

    var imgUrl = main.imgUrl || main.thumb || '';
    var imgEl  = document.getElementById('mainImg');
    var box    = document.getElementById('imgBox');
    var inner  = document.getElementById('imgInner');

    function onImgReady(){
      var natW = imgEl.naturalWidth;
      var natH = imgEl.naturalHeight;
      var ratio = natW / natH;
      var mobile = window.innerWidth <= 600;
      var viewH = window.innerHeight - 50;
      var titleGap = mobile ? 52 : 48;
      var w, h;

      if (mobile) {
        var maxByW = window.innerWidth * 0.94;
        var maxByH = viewH - titleGap - 24;
        var side = Math.min(maxByW, maxByH);
        box.style.width = side + 'px';
        box.style.height = 'auto';
        inner.style.width = side + 'px';
        inner.style.height = side + 'px';
      } else {
        var maxW = Math.min(window.innerWidth * 0.86, 820);
        var maxH = Math.min(viewH - titleGap - 56, 720);
        if (ratio > maxW / maxH) {
          w = maxW;
          h = maxW / ratio;
        } else {
          h = maxH;
          w = maxH * ratio;
        }
        box.style.width = w + 'px';
        box.style.height = h + 'px';
        inner.style.width = '100%';
        inner.style.height = '100%';
      }

      box.classList.add('visible');
      setTimeout(function(){
        showWorkTitle();
        document.getElementById('scrollCue').classList.add('visible');
      }, 350);

      /* ── 클릭 이벤트 ── */
      box.addEventListener('click', goContext);
      document.getElementById('scrollCue').addEventListener('click', function(e){
        e.stopPropagation();
        goContext();
      });
    }

    function showWithoutImage(){
      box.classList.add('visible');
      showWorkTitle();
    }

    if(!imgUrl){ showWithoutImage(); }
    else { loadMainImage(imgEl, imgUrl, onImgReady, showWithoutImage); }
  })
  .catch(function(){
    document.getElementById('imgBox').classList.add('visible');
    showWorkTitle();
  });

/* ───────────────────────────────────────────
   스크롤 다운 제스처 감지 → context 이동
─────────────────────────────────────────── */
var scrollLocked = false;

/* 마우스 휠 */
window.addEventListener('wheel', function(e){
  if(scrollLocked) return;
  if(e.deltaY > 30){          /* 아래로 스크롤 */
    scrollLocked = true;
    goContext();
  }
}, { passive: true });

/* 터치 스와이프 */
var touchStartY = 0;
window.addEventListener('touchstart', function(e){
  touchStartY = e.touches[0].clientY;
}, { passive: true });

window.addEventListener('touchend', function(e){
  if(scrollLocked) return;
  var dy = touchStartY - e.changedTouches[0].clientY;
  if(dy > 40){                /* 위로 스와이프 = 스크롤 다운 */
    scrollLocked = true;
    goContext();
  }
}, { passive: true });

/* ───────────────────────────────────────────
   로딩 화면 제거
─────────────────────────────────────────── */
window.addEventListener('load', function(){
  var loader = document.getElementById('page-loader');
  if(loader){
    setTimeout(function(){
      loader.classList.add('hidden');
      setTimeout(function(){ loader.style.display = 'none'; }, 650);
    }, 400);
  }
});
</script>
