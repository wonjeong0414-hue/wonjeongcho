<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1a1a18;--ink-mid:#4a4a47;--ink-dim:#7a7a74;--bg:#f7f6f3;--white:#fff;--nav-h:50px}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{font-family:'Cormorant Garamond',serif;display:flex;flex-direction:column}

/* ── nav ── */
nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 36px;z-index:100;background:var(--bg);border-bottom:0.5px solid rgba(0,0,0,0.08)}
@media(max-width:600px){nav{padding:0 12px}}
.nav-logo{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:13px;letter-spacing:0.28em;color:var(--ink);text-transform:uppercase;opacity:0;animation:fadeIn 1s ease 0.3s forwards;cursor:pointer}
.nav-right{display:flex;align-items:center;height:100%;opacity:0;animation:fadeIn 1s ease 0.5s forwards}
.nav-item{font-size:9.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-dim);padding:5px 11px;cursor:pointer;text-decoration:none;transition:color 0.25s;white-space:nowrap;position:relative;line-height:1;display:flex;align-items:center}
.nav-item::after{content:'';position:absolute;bottom:0;left:11px;right:11px;height:0.5px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform 0.28s cubic-bezier(0.16,1,0.3,1);opacity:0.5}
.nav-item:hover{color:var(--ink)}
.nav-item:hover::after{transform:scaleX(1)}
.nav-item.active{color:var(--ink)}
.nav-item.active::after{transform:scaleX(1)}
.nav-sep{width:0.5px;height:12px;background:rgba(0,0,0,0.12);margin:0 5px;flex-shrink:0}
.nav-dropdown{position:relative;display:flex;align-items:center}
.nav-dropdown-menu{display:none;position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--white);border:0.5px solid rgba(0,0,0,0.08);border-radius:4px;padding:4px 0;min-width:90px;width:max-content;z-index:200;box-shadow:0 4px 14px rgba(0,0,0,0.07)}
.nav-dropdown-item{display:block;font-size:9px;letter-spacing:0.1em;color:var(--ink-mid);padding:6px 14px;cursor:pointer;transition:color 0.15s,background 0.15s;white-space:nowrap;text-transform:uppercase}
.nav-dropdown-item:hover{color:var(--ink);background:rgba(0,0,0,0.03)}

/* ── shell ── */
.shell{
  position:fixed;top:var(--nav-h);left:0;right:0;bottom:0;
  display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;
  padding-top:clamp(20px,5vh,52px);
  overflow:hidden;
}

/* ── 이미지 박스: 원본 비율 유지 ── */
.img-box{
  /* 최대 너비/높이 제한만 두고, 실제 크기는 이미지가 결정 */
  max-width:min(72vw,660px);
  max-height:min(70vh,640px);
  flex-shrink:0;
  position:relative;
  overflow:hidden;
  cursor:pointer;
  /* 초기 투명 → 이미지 로드 후 표시 */
  opacity:0;
  transition:opacity 0.7s ease, transform 0.7s cubic-bezier(0.16,1,0.3,1);
}
.img-box.visible{opacity:1}

/* 실제 이미지: 원본 비율 그대로 */
.img-box img{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;   /* 비율 유지, 잘리지 않음 */
  object-position:center;
  transition:transform 0.7s cubic-bezier(0.16,1,0.3,1);
}
.img-box:hover img{transform:scale(1.008)}

.img-overlay{
  position:absolute;inset:0;
  display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:28px;
  background:linear-gradient(to top,rgba(247,246,243,0.65) 0%,transparent 38%);
  pointer-events:none;
}

/* scroll cue */
@keyframes bob{0%,100%{opacity:0.35;transform:translateY(0) translateX(-50%)}50%{opacity:0.6;transform:translateY(4px) translateX(-50%)}}
.scroll-cue{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  font-size:13px;color:var(--ink-mid);
  animation:bob 2.2s ease-in-out infinite;
  cursor:pointer;opacity:0;transition:opacity 0.5s ease;
  pointer-events:auto;
}
.scroll-cue.visible{opacity:0.35}

/* ── work-info ── */
.work-info{
  width:min(72vw,620px);flex-shrink:0;
  display:flex;justify-content:space-between;align-items:baseline;
  padding:8px 0;border-top:0.5px solid rgba(0,0,0,0.1);
  opacity:0;transition:opacity 0.7s ease 0.25s;
}
.work-info.visible{opacity:1}
.wi-left .wi-title{font-family:'EB Garamond',serif;font-size:14px;color:var(--ink)}
.wi-left .wi-meta{font-size:9px;letter-spacing:0.12em;color:var(--ink-dim);text-transform:uppercase;margin-top:3px}
.wi-desc{font-size:10px;color:var(--ink-mid);line-height:1.8;flex:1;max-width:45%;text-align:right;word-break:keep-all}

/* ── Tactile Thinking 플로팅 텍스트 ── */
@keyframes gentleFloat{
  0%,100%{transform:translateY(0);opacity:0.9}
  40%{transform:translateY(-7px);opacity:1}
  70%{transform:translateY(3px);opacity:0.85}
}
.work-title{
  font-family:'EB Garamond',serif;
  font-style:italic;font-weight:500;font-size:32px;
  color:var(--ink);letter-spacing:0.06em;line-height:1;
  opacity:0;transition:opacity 0.9s ease;
  animation:gentleFloat 6s ease-in-out infinite;
  text-shadow:0 2px 20px rgba(247,246,243,0.9);
  display:inline-block;
}
.work-title.visible{opacity:1}

@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ── 전환 오버레이 (클릭/스크롤 → context 이동) ── */
#transition-overlay{
  position:fixed;inset:0;
  background:var(--bg);
  z-index:9000;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.55s cubic-bezier(0.4,0,0.2,1);
}
#transition-overlay.active{
  opacity:1;
  pointer-events:all;
}

/* 이미지가 위로 슬라이드되며 사라지는 효과 */
.shell.exiting{
  transform:translateY(-18px);
  opacity:0;
  transition:transform 0.55s cubic-bezier(0.4,0,0.2,1), opacity 0.45s ease;
}

/* ── 페이지 전환 fade ── */
@keyframes pageFadeIn{from{opacity:0}to{opacity:1}}
.page-fade{animation:pageFadeIn 0.4s ease forwards}
body.fade-out{opacity:0;transition:opacity 0.3s ease}

/* ── 로딩 화면 ── */
#page-loader{
  position:fixed;inset:0;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  z-index:9999;opacity:1;
  transition:opacity 0.6s cubic-bezier(0.16,1,0.3,1);
  pointer-events:all;
}
#page-loader.hidden{opacity:0;pointer-events:none}
.loader-inner{display:flex;flex-direction:column;align-items:center;gap:20px}
.loader-name{
  font-family:'EB Garamond',serif;font-style:italic;
  font-size:clamp(18px,3vw,28px);letter-spacing:0.18em;color:var(--ink);
  opacity:0;animation:loaderFadeIn 0.8s ease 0.2s forwards;
}
.loader-line{
  width:0;height:0.5px;background:var(--ink);opacity:0.3;
  animation:loaderLine 1s cubic-bezier(0.16,1,0.3,1) 0.4s forwards;
}
@keyframes loaderFadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes loaderLine{from{width:0}to{width:clamp(80px,12vw,140px)}}

/* ── 모바일 ── */
@media(max-width:600px){
  .nav-logo{font-size:9px !important;letter-spacing:0.18em !important}
  
  .nav-sep{margin:0 2px !important}
  .shell{padding-top:clamp(8px,2vh,20px)}
  .img-box{max-width:88vw !important;max-height:54vh !important}
  .wi-medium{display:none}
  .img-overlay{justify-content:center !important;align-items:flex-end !important}
  .work-title{font-size:22px !important;text-align:center}
}

@media(max-width:600px){.nav-logo{touch-action:manipulation;-webkit-tap-highlight-color:transparent}.nav-item{min-height:44px;display:inline-flex;align-items:center;padding:0 9px;font-size:9px;letter-spacing:0.12em;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.nav-sep{margin:0 2px}.nav-dd-item{min-height:44px;display:flex;align-items:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent}}
</style>

<!-- 로딩 화면 -->
<div id="page-loader">
  <div class="loader-inner">
    <div class="loader-name">Won Jeong Cho</div>
    <div class="loader-line"></div>
  </div>
</div>

<!-- 전환 오버레이 -->
<div id="transition-overlay"></div>

<body>
<nav>
  <span class="nav-logo" onclick="go('index')">Won Jeong Cho</span>
  <div class="nav-right">
    <div class="nav-dropdown">
      <span class="nav-item">Archive</span>
      <div class="nav-dropdown-menu">
        <span class="nav-dropdown-item" onclick="go('year')">Year</span>
        <span class="nav-dropdown-item" onclick="go('context')">Context</span>
      </div>
    </div>
    <div class="nav-sep"></div>
    <div class="nav-dropdown">
      <span class="nav-item">Text</span>
      <div class="nav-dropdown-menu">
        <span class="nav-dropdown-item" onclick="go('note')">Note</span>
        <span class="nav-dropdown-item" onclick="go('critique')">Critique</span>
      </div>
    </div>
    <div class="nav-sep"></div>
    <span class="nav-item" onclick="go('about')">About</span>
  </div>
</nav>

<div class="shell" id="shell">
  <div class="img-box" id="imgBox">
    <!-- src는 JS에서 주입 -->
    <img id="mainImg" src="" alt="Won Jeong Cho — work" draggable="false">
    <div class="img-overlay">
      <div class="work-title" id="workTitle"></div>
    </div>
    <div class="scroll-cue" id="scrollCue">&#8595;</div>
  </div>

  <div class="work-info" id="workInfo">
    <div class="wi-left">
      <div class="wi-title" id="wiTitle"></div>
      <div class="wi-meta"><span id="wiYear"></span><span id="wiMedium" class="wi-medium"></span></div>
    </div>
    <div class="wi-desc" id="wiDesc"></div>
  </div>
</div>

<script>
/* ───────────────────────────────────────────
   일반 페이지 전환 (nav 메뉴용)
─────────────────────────────────────────── */
function go(page){
  document.body.classList.add('fade-out');
  setTimeout(function(){window.location.href = page + '.html';}, 280);
}

document.addEventListener('DOMContentLoaded', function(){
  document.body.classList.add('page-fade');
});

/* ───────────────────────────────────────────
   context 페이지로 부드럽게 전환
─────────────────────────────────────────── */
var transitioning = false;

function goContext(){
  if(transitioning) return;
  transitioning = true;

  var shell   = document.getElementById('shell');
  var overlay = document.getElementById('transition-overlay');

  /* 1) shell을 위로 살짝 올리며 페이드 아웃 */
  shell.classList.add('exiting');

  /* 2) 배경 오버레이 페이드 인 (약간 딜레이) */
  setTimeout(function(){
    overlay.classList.add('active');
  }, 80);

  /* 3) 전환 완료 후 이동 */
  setTimeout(function(){
    window.location.href = 'context.html';
  }, 600);
}

/* ───────────────────────────────────────────
   Nav dropdown
─────────────────────────────────────────── */
document.querySelectorAll('.nav-dropdown').forEach(function(dd){
  var menu = dd.querySelector('.nav-dropdown-menu'), timer;
  dd.addEventListener('mouseenter', function(){ clearTimeout(timer); menu.style.display = 'block'; });
  dd.addEventListener('mouseleave', function(){ timer = setTimeout(function(){ menu.style.display = 'none'; }, 150); });
  menu.addEventListener('mouseenter', function(){ clearTimeout(timer); });
  menu.addEventListener('mouseleave', function(){ timer = setTimeout(function(){ menu.style.display = 'none'; }, 150); });
});

/* ───────────────────────────────────────────
   데이터 로드 & 이미지 비율 처리
─────────────────────────────────────────── */
fetch('./data/main.json')
  .then(function(r){ return r.json(); })
  .then(function(result){
    var main = result.main;
    if(!main) return;

    var imgUrl = main.imgUrl || main.thumb || '';
    var imgEl  = document.getElementById('mainImg');
    var box    = document.getElementById('imgBox');

    imgEl.onload = function(){
      /* 원본 비율로 박스 크기 결정 */
      var natW = imgEl.naturalWidth;
      var natH = imgEl.naturalHeight;
      var ratio = natW / natH;

      /* 가용 영역 계산 */
      var maxW = Math.min(window.innerWidth * 0.72, 660);
      var maxH = Math.min(window.innerHeight * 0.70, 640);

      var w, h;
      if(ratio > maxW / maxH){
        w = maxW; h = maxW / ratio;
      } else {
        h = maxH; w = maxH * ratio;
      }

      box.style.width  = w + 'px';
      box.style.height = h + 'px';
      document.getElementById('workInfo').style.width = w + 'px';

      /* 표시 */
      box.classList.add('visible');
      setTimeout(function(){
        document.getElementById('workTitle').textContent = 'Tactile Thinking';
        document.getElementById('workTitle').classList.add('visible');
        document.getElementById('workInfo').classList.add('visible');
        document.getElementById('scrollCue').classList.add('visible');
      }, 350);

      /* ── 클릭 이벤트 ── */
      box.addEventListener('click', goContext);
      document.getElementById('scrollCue').addEventListener('click', function(e){
        e.stopPropagation();
        goContext();
      });
    };

    imgEl.onerror = function(){
      /* 이미지 없어도 텍스트는 표시 */
      box.classList.add('visible');
      document.getElementById('workTitle').textContent = 'Tactile Thinking';
      document.getElementById('workTitle').classList.add('visible');
      document.getElementById('workInfo').classList.add('visible');
    };

    imgEl.src = imgUrl;

    document.getElementById('wiTitle').textContent  = main.title || '';
    document.getElementById('wiYear').textContent   = main.year || '';
    document.getElementById('wiMedium').textContent = main.medium ? ' · ' + main.medium : '';
    document.getElementById('wiDesc').textContent  = main.desc || '';
  })
  .catch(function(){
    document.getElementById('imgBox').classList.add('visible');
    document.getElementById('workTitle').textContent = 'Tactile Thinking';
    document.getElementById('workTitle').classList.add('visible');
    document.getElementById('workInfo').classList.add('visible');
  });

/* ───────────────────────────────────────────
   스크롤 다운 제스처 감지 → context 이동
─────────────────────────────────────────── */
var scrollLocked = false;

/* 마우스 휠 */
window.addEventListener('wheel', function(e){
  if(scrollLocked) return;
  if(e.deltaY > 30){          /* 아래로 스크롤 */
    scrollLocked = true;
    goContext();
  }
}, { passive: true });

/* 터치 스와이프 */
var touchStartY = 0;
window.addEventListener('touchstart', function(e){
  touchStartY = e.touches[0].clientY;
}, { passive: true });

window.addEventListener('touchend', function(e){
  if(scrollLocked) return;
  var dy = touchStartY - e.changedTouches[0].clientY;
  if(dy > 40){                /* 위로 스와이프 = 스크롤 다운 */
    scrollLocked = true;
    goContext();
  }
}, { passive: true });

/* ───────────────────────────────────────────
   로딩 화면 제거
─────────────────────────────────────────── */
window.addEventListener('load', function(){
  var loader = document.getElementById('page-loader');
  if(loader){
    setTimeout(function(){
      loader.classList.add('hidden');
      setTimeout(function(){ loader.style.display = 'none'; }, 650);
    }, 400);
  }
});
</script>
</body>
</html>
