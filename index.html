<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WON JEONG CHO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;1,500&family=Cormorant+Garamond:wght@300;400&display=swap" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;1,500&family=Cormorant+Garamond:wght@300;400&display=swap"></noscript>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1a1a18;--ink-mid:#4a4a47;--ink-dim:#7a7a74;--bg:#f7f6f3;--white:#ffffff;--nav-h:50px}
html{height:100%;background:var(--bg)}
body{height:100%;background:var(--bg);font-family:'Cormorant Garamond',serif;display:flex;flex-direction:column}
nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 36px;z-index:100;background:var(--bg);border-bottom:0.5px solid rgba(0,0,0,0.08)}
@media(max-width:600px){nav{padding:0 12px}}
@media(max-width:480px){.nav-logo{font-size:10px !important;letter-spacing:0.16em !important}.nav-item{font-size:8px !important;padding:5px 6px !important;letter-spacing:0.1em !important}.nav-sep{margin:0 1px !important}}
.nav-logo{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:13px;letter-spacing:0.28em;color:var(--ink);text-decoration:none;text-transform:uppercase;opacity:0;animation:fadeIn 1s ease 0.3s forwards;cursor:pointer}
.nav-right{display:flex;align-items:center;opacity:0;animation:fadeIn 1s ease 0.5s forwards}
.nav-item{font-size:9.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-dim);padding:5px 11px;cursor:pointer;text-decoration:none;transition:color 0.2s;white-space:nowrap;position:relative}
.nav-item:hover,.nav-item.active{color:var(--ink)}
.nav-item.active::after{content:'';position:absolute;bottom:0;left:11px;right:11px;height:0.5px;background:var(--ink);opacity:0.4}
.nav-sep{width:0.5px;height:12px;background:rgba(0,0,0,0.12);margin:0 5px;flex-shrink:0}
.nav-dropdown{position:relative}
.nav-dropdown-menu{display:none;position:absolute;top:calc(100% + 6px);left:0;background:var(--white);border:0.5px solid rgba(0,0,0,0.1);border-radius:4px;padding:5px 0;min-width:0;width:max-content;z-index:200;box-shadow:0 6px 18px rgba(0,0,0,0.07)}
.nav-dropdown-item{display:block;font-size:9px;letter-spacing:0.08em;color:var(--ink-mid);padding:6px 16px;cursor:pointer;transition:color 0.15s,background 0.15s;white-space:nowrap}
.nav-dropdown-item:hover{color:var(--ink);background:rgba(0,0,0,0.03)}
.page{margin-top:var(--nav-h);height:calc(100vh - var(--nav-h));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 36px 16px;transition:all 0.75s cubic-bezier(0.16,1,0.3,1);overflow:hidden}
.page.expanded{justify-content:flex-start;padding-top:16px}
.img-box{width:min(58vw,580px);height:min(55vh,520px);flex-shrink:0;position:relative;overflow:hidden;cursor:pointer;transition:all 0.75s cubic-bezier(0.16,1,0.3,1)}
.page.expanded .img-box{width:100%;height:30vh}
.img-bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform 0.6s ease}
.img-box:hover .img-bg{transform:scale(1.006)}
.img-overlay{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:20px;background:linear-gradient(to top,rgba(247,246,243,0.7) 0%,transparent 30%)}
@keyframes txtFloat{0%,100%{transform:translateY(0);opacity:0.92}40%{transform:translateY(-3px);opacity:1}70%{transform:translateY(1.5px);opacity:0.87}}
.work-title{font-family:'EB Garamond',serif;font-style:italic;font-size:26px;letter-spacing:0.08em;color:var(--ink);animation:txtFloat 7s ease-in-out infinite;opacity:0;transition:opacity 0.7s ease;text-shadow:0 1px 12px rgba(247,246,243,0.6)}
.work-title.visible{opacity:1}
.page.expanded .work-title{font-size:18px}
@keyframes bob{0%,100%{opacity:0.35;transform:translateY(0) translateX(-50%)}50%{opacity:0.6;transform:translateY(4px) translateX(-50%)}}
.scroll-cue{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:13px;color:var(--ink-mid);animation:bob 2.2s ease-in-out infinite;cursor:pointer;opacity:0;transition:opacity 0.8s ease 1s}
.scroll-cue.visible{opacity:0.35}
.page.expanded .scroll-cue{display:none}
.work-info{width:min(58vw,540px);display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-top:0.5px solid rgba(0,0,0,0.1);opacity:0;transition:opacity 0.7s ease 0.2s,width 0.75s cubic-bezier(0.16,1,0.3,1);flex-shrink:0}
.work-info.visible{opacity:1}
.page.expanded .work-info{width:100%;padding:8px 0}
.wi-left .wi-title{font-family:'EB Garamond',serif;font-size:14px;color:var(--ink)}
.wi-left .wi-meta{font-size:9px;letter-spacing:0.12em;color:var(--ink-dim);text-transform:uppercase;margin-top:3px}
.wi-desc{font-size:10px;color:var(--ink-mid);line-height:1.8;flex:1;max-width:45%;text-align:right;word-break:keep-all}
.sub-section{width:100%;flex-shrink:0;height:0;overflow:hidden;opacity:0;transition:height 0.65s cubic-bezier(0.16,1,0.3,1),opacity 0.5s ease 0.15s}
.sub-section.open{height:220px;opacity:1}
.sub-grid{display:flex;gap:16px;align-items:flex-start;justify-content:center;padding:16px 0 8px;height:100%}
@keyframes floatA{0%,100%{transform:translateY(0px)}35%{transform:translateY(-7px)}70%{transform:translateY(4px)}}
@keyframes floatB{0%,100%{transform:translateY(0px)}25%{transform:translateY(5px)}60%{transform:translateY(-9px)}}
@keyframes floatC{0%,100%{transform:translateY(0px)}45%{transform:translateY(-5px)}80%{transform:translateY(6px)}}
.sub-card{flex:0 0 auto;width:160px;height:180px;position:relative;overflow:hidden;cursor:pointer;opacity:0;transition:opacity 0.6s ease,box-shadow 0.3s ease}
.sub-card.loaded{opacity:1}
.sub-card:nth-child(1){animation:floatA 8s ease-in-out infinite}
.sub-card:nth-child(2){animation:floatB 10s ease-in-out infinite;margin-top:20px}
.sub-card:nth-child(3){animation:floatC 9s ease-in-out 0.5s infinite;margin-top:8px}
.sub-card:hover{box-shadow:0 12px 32px rgba(0,0,0,0.12)}
.sub-img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.5s ease}
.sub-card:hover .sub-img{transform:scale(1.04)}
.gallery-area{width:100%;flex:1;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity 0.5s ease}
.gallery-area.open{opacity:1;pointer-events:all}
.gallery-placeholder{padding:48px;text-align:center;font-size:10px;color:var(--ink-dim);letter-spacing:0.16em;text-transform:uppercase}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<nav>
  <span class="nav-logo" onclick="go('index')">Won Jeong Cho</span>
  <div class="nav-right">
    <div class="nav-dropdown">
      <span class="nav-item">Archive</span>
      <div class="nav-dropdown-menu">
        <span class="nav-dropdown-item" onclick="go('year')">Year</span>
        <span class="nav-dropdown-item" onclick="go('context')">Context</span>
      </div>
    </div>
    <div class="nav-sep"></div>
    <span class="nav-item" onclick="go('text')">Text</span>
    <div class="nav-sep"></div>
    <span class="nav-item" onclick="go('about')">About</span>
  </div>
</nav>
<div class="page" id="page">
  <div class="img-box" id="imgBox" onclick="expand()">
    <div class="img-bg" id="imgBg"></div>
    <div class="img-overlay">
      <div class="work-title" id="workTitle"></div>
    </div>
    <div class="scroll-cue" id="scrollCue">&#8595;</div>
  </div>
  <div class="work-info" id="workInfo">
    <div class="wi-left">
      <div class="wi-title" id="wiTitle"></div>
      <div class="wi-meta" id="wiMeta"></div>
    </div>
    <div class="wi-desc" id="wiDesc"></div>
  </div>
  <div class="sub-section" id="subSection">
    <div class="sub-grid">
      <div class="sub-card" id="sub1" onclick="go('year')">
        <img class="sub-img" id="subImg1" src="" alt="" onload="this.parentElement.classList.add('loaded')" onerror="this.parentElement.style.display='none'">
      </div>
      <div class="sub-card" id="sub2" onclick="go('year')">
        <img class="sub-img" id="subImg2" src="" alt="" onload="this.parentElement.classList.add('loaded')" onerror="this.parentElement.style.display='none'">
      </div>
      <div class="sub-card" id="sub3" onclick="go('year')">
        <img class="sub-img" id="subImg3" src="" alt="" onload="this.parentElement.classList.add('loaded')" onerror="this.parentElement.style.display='none'">
      </div>
    </div>
  </div>
  <div class="gallery-area" id="galleryArea">
    <div class="gallery-placeholder">— 갤러리 페이지 연결 예정 —</div>
  </div>
</div>
<script>
var SCRIPT_URL = '/api';
var isExpanded = false;

function go(page){ window.location.href = page + '.html'; }

document.querySelectorAll('.nav-dropdown').forEach(function(dd){
  var menu=dd.querySelector('.nav-dropdown-menu'),timer;
  dd.addEventListener('mouseenter',function(){clearTimeout(timer);menu.style.display='block';});
  dd.addEventListener('mouseleave',function(){timer=setTimeout(function(){menu.style.display='none';},150);});
  menu.addEventListener('mouseenter',function(){clearTimeout(timer);});
  menu.addEventListener('mouseleave',function(){timer=setTimeout(function(){menu.style.display='none';},150);});
});

function expand(){
  if(isExpanded) return;
  isExpanded=true;
  document.getElementById('page').classList.add('expanded');
  document.getElementById('subSection').classList.add('open');
  document.getElementById('galleryArea').classList.add('open');
}
function collapse(){
  if(!isExpanded) return;
  isExpanded=false;
  document.getElementById('page').classList.remove('expanded');
  document.getElementById('subSection').classList.remove('open');
  document.getElementById('galleryArea').classList.remove('open');
}

document.getElementById('galleryArea').addEventListener('scroll',function(){
  if(this.scrollTop===0) collapse();
});
window.addEventListener('wheel',function(e){
  if(!isExpanded&&e.deltaY>20) expand();
  if(isExpanded&&e.deltaY<-20&&document.getElementById('galleryArea').scrollTop===0) collapse();
},{passive:true});
var ty=0;
window.addEventListener('touchstart',function(e){ty=e.touches[0].clientY;},{passive:true});
window.addEventListener('touchmove',function(e){if(!isExpanded&&ty-e.touches[0].clientY>40)expand();},{passive:true});

// 데이터 fetch
fetch(SCRIPT_URL + '?page=api_works')
  .then(function(r){ return r.json(); })
  .then(function(works){
    var main = null;
    var subs = [];
    works.forEach(function(w){
      if(!main) main = w;
      else if(subs.length < 3) subs.push(w);
    });
    if(!main) return;
    var imgUrl = main.full || main.thumb || '';
    var img = new Image();
    img.onload = function(){
      document.getElementById('imgBg').style.backgroundImage = "url('"+imgUrl+"')";
      setTimeout(function(){
        document.getElementById('workTitle').textContent = main.title || '';
        document.getElementById('workTitle').classList.add('visible');
        document.getElementById('workInfo').classList.add('visible');
        document.getElementById('scrollCue').classList.add('visible');
      },350);
    };
    img.onerror = function(){
      document.getElementById('workTitle').textContent = main.title || '';
      document.getElementById('workTitle').classList.add('visible');
      document.getElementById('workInfo').classList.add('visible');
      document.getElementById('scrollCue').classList.add('visible');
    };
    img.src = imgUrl;
    document.getElementById('wiTitle').textContent = main.title || '';
    document.getElementById('wiMeta').textContent = (main.year||'')+(main.medium?' · '+main.medium:'');
    document.getElementById('wiDesc').textContent = main.desc || '';
    if(subs[0]) document.getElementById('subImg1').src = subs[0].thumb||'';
    if(subs[1]) document.getElementById('subImg2').src = subs[1].thumb||'';
    if(subs[2]) document.getElementById('subImg3').src = subs[2].thumb||'';
  })
  .catch(function(){
    document.getElementById('workTitle').textContent = 'Won Jeong Cho';
    document.getElementById('workTitle').classList.add('visible');
    document.getElementById('workInfo').classList.add('visible');
  });
</script>
</body>
</html>
