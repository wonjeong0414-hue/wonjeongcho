 <!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Context — WON JEONG CHO</title>

<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=Cormorant+Garamond:wght@300;400&display=swap" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=Cormorant+Garamond:wght@300;400&display=swap"></noscript>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1a1a18;--ink-mid:#6b6b68;--ink-dim:#aaa9a2;--bg:#f7f6f3;--white:#fff;--nav-h:50px;--left-w:280px;--left-pad:28px}
html,body{height:100%;background:var(--bg);font-family:'Cormorant Garamond',serif;color:var(--ink);overflow:hidden}
nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 36px;z-index:200;background:var(--bg)}
@media(max-width:600px){nav{padding:0 16px}}
.nav-logo{font-weight:300;font-size:13px;letter-spacing:0.3em;color:var(--ink);text-decoration:none;text-transform:uppercase;cursor:pointer}
@media(max-width:600px){.nav-logo{font-size:9px;letter-spacing:0.2em}}
.nav-right{display:flex;align-items:center}
.nav-item{font-size:9.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-dim);padding:5px 11px;cursor:pointer;text-decoration:none;transition:color 0.25s;white-space:nowrap;position:relative}
.nav-item::after{content:'';position:absolute;bottom:0;left:11px;right:11px;height:0.5px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform 0.28s cubic-bezier(0.16,1,0.3,1);opacity:0.5}
.nav-item:hover{color:var(--ink)}
.nav-item:hover::after{transform:scaleX(1)}
.nav-item.active{color:var(--ink)}
.nav-item.active::after{transform:scaleX(1)}
.nav-sep{width:0.5px;height:12px;background:rgba(0,0,0,0.12);margin:0 5px;flex-shrink:0}
.nav-dd{position:relative;display:flex;align-items:center}
.nav-dd-menu{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--white);border-radius:4px;min-width:90px;width:max-content;z-index:300;box-shadow:0 4px 14px rgba(0,0,0,0.07);max-height:0;overflow:hidden;opacity:0;padding:0;pointer-events:none;transition:max-height 0.32s cubic-bezier(0.16,1,0.3,1),opacity 0.22s ease,padding 0.22s ease}
.nav-dd-menu.open{max-height:200px;opacity:1;padding:4px 0;pointer-events:all}
.nav-dd-item{display:block;font-size:9px;letter-spacing:0.08em;color:var(--ink-mid);padding:6px 14px;cursor:pointer;transition:color 0.15s,background 0.15s;white-space:nowrap;text-transform:uppercase}
@media(max-width:600px){.nav-dd-item{padding:12px 18px;font-size:12px}}
.nav-dd-item:hover{color:var(--ink);background:rgba(0,0,0,0.03)}
.layout{position:fixed;top:var(--nav-h);left:0;right:0;bottom:0;display:flex;flex-direction:column}
.top-header{flex-shrink:0;display:flex;align-items:center;gap:28px;padding:0 36px 0 var(--left-pad);height:0;overflow:hidden}
.header-title{font-family:'EB Garamond',serif;font-style:italic;font-size:18px;color:var(--ink);white-space:nowrap;flex-shrink:0}
.body-row{flex:1;display:flex;overflow:hidden}
.left-panel{width:var(--left-w);flex-shrink:0;display:flex;flex-direction:column;padding:20px 12px 16px var(--left-pad);overflow:hidden}
.strip-row{display:flex;align-items:center;justify-content:space-between;min-height:18px;margin-bottom:6px}
.clear-btn{font-size:7.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-dim);cursor:pointer;border:none;background:none;padding:0;transition:color 0.15s}
.clear-btn:hover{color:var(--ink-mid)}
.active-strip{display:flex;flex-wrap:wrap;gap:3px;align-items:center;margin-bottom:10px}
.a-pill{font-size:7.5px;letter-spacing:0.03em;background:rgba(0,0,0,0.04);border-radius:20px;padding:2px 7px 2px 8px;display:flex;align-items:center;gap:3px;animation:pillIn 0.15s ease;color:var(--ink-mid)}
@keyframes pillIn{from{opacity:0;transform:scale(0.85)}to{opacity:1;transform:scale(1)}}
.a-pill-x{font-size:10px;opacity:0.35;cursor:pointer;line-height:1;transition:opacity 0.15s}
.a-pill-x:hover{opacity:0.8}
.cat-list-wrap{display:flex;flex-direction:column;flex:1;overflow-y:auto;scrollbar-width:none}
.cat-list-wrap::-webkit-scrollbar{display:none}
.cat-cell{border-bottom:0.5px solid rgba(0,0,0,0.07);padding-bottom:10px}
.cat-header{display:flex;align-items:center;gap:6px;padding:9px 0 5px}
.cat-title{font-size:8.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-dim);line-height:1.3;flex:1}
.cat-cell.has-sel .cat-title{color:#3d3d3b}
.cat-badge{width:5px;height:5px;border-radius:50%;background:var(--ink-dim);display:none;flex-shrink:0}
.cat-cell.has-sel .cat-badge{display:inline-block}
.sub-chip-row{display:flex;flex-wrap:wrap;gap:4px 5px;padding-bottom:2px}
.sub-chip{font-size:8.5px;color:var(--ink-mid);cursor:pointer;padding:2px 8px;border-radius:11px;border:0.5px solid rgba(0,0,0,0.13);transition:color 0.15s,border-color 0.15s,background 0.15s;user-select:none;line-height:1.7}
.sub-chip:hover{color:var(--ink);border-color:rgba(0,0,0,0.28)}
.sub-chip.open{color:var(--ink);border-color:rgba(0,0,0,0.4);background:rgba(0,0,0,0.03)}
.sub-chip.has-sel{color:var(--ink);border-color:var(--ink);font-weight:600}
.sub-dropdown{max-height:0;overflow:hidden;transition:max-height 0.32s cubic-bezier(0.16,1,0.3,1),padding 0.2s ease;display:flex;flex-wrap:wrap;gap:0 10px}
.sub-dropdown.open{max-height:150px;padding:7px 0 4px}
.tag-item{font-size:8.5px;color:var(--ink-mid);cursor:pointer;letter-spacing:0.01em;line-height:2;transition:color 0.15s;user-select:none}
.tag-item:hover{color:var(--ink)}
.tag-item.checked{color:var(--ink);font-weight:600}
.left-top-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.result-count{font-size:7.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-mid);flex-shrink:0}
.empty-state{display:none;padding:48px 20px;text-align:center}
.empty-state.show{display:block}
.empty-state-tags{font-size:12px;color:var(--ink-mid);letter-spacing:0.03em;line-height:1.8;margin-bottom:14px}
.empty-state-msg{font-family:'EB Garamond',serif;font-style:italic;font-size:12px;color:var(--ink-dim);line-height:1.8;margin-bottom:20px}
.empty-clear-btn{font-size:8px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-mid);cursor:pointer;border:0.5px solid rgba(0,0,0,0.22);background:transparent;padding:5px 16px;border-radius:20px;transition:color 0.15s,border-color 0.15s}
.empty-clear-btn:hover{color:var(--ink);border-color:rgba(0,0,0,0.45)}
.right-panel{flex:1;min-width:0;position:relative;overflow:hidden}
.float-zone{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity 0.4s ease;pointer-events:all}
.float-zone.hidden{opacity:0;pointer-events:none}
.pc-float-text{position:absolute;bottom:8%;left:5%;z-index:2;font-family:'EB Garamond',serif;font-style:italic;font-size:clamp(13px,1.4vw,18px);color:var(--ink);line-height:2;letter-spacing:0.03em;word-break:keep-all;pointer-events:none;animation:floatC 9s ease-in-out 0.6s infinite;text-shadow:0 1px 18px rgba(247,246,243,0.9),0 0 30px rgba(247,246,243,0.7)}
@keyframes floatA{0%,100%{transform:translateY(0)}35%{transform:translateY(-7px)}70%{transform:translateY(3px)}}
@keyframes floatB{0%,100%{transform:translateY(0)}30%{transform:translateY(6px)}65%{transform:translateY(-8px)}}
@keyframes floatC{0%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}75%{transform:translateY(5px)}}
.sub-card{position:absolute;overflow:hidden;cursor:pointer;opacity:1;transition:box-shadow 0.3s ease;background:rgba(0,0,0,0.06)}
.sub-card.s1{width:35.5%;height:42.7%;top:6.6%;left:7.4%;animation:floatA 8s ease-in-out infinite}
.sub-card.s2{width:42.3%;height:54.4%;top:3.7%;left:46.3%;animation:floatB 10s ease-in-out infinite}
.sub-card.s3{width:54.7%;height:41.9%;top:51.5%;left:17.9%;animation:floatC 9s ease-in-out 0.6s infinite}
.sub-card:hover{box-shadow:0 14px 40px rgba(0,0,0,0.12);z-index:10}
.sub-img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.5s ease;position:relative;z-index:1}
.sub-card:hover .sub-img{transform:scale(1.04)}
.narrative-zone{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-start;padding:36px 52px 0;opacity:0;transform:translateY(18px);transition:opacity 0.7s cubic-bezier(0.16,1,0.3,1),transform 0.8s cubic-bezier(0.16,1,0.3,1);pointer-events:none}
.narrative-zone.show{opacity:1;transform:translateY(0);pointer-events:all}
.narrative-zone.rising{opacity:0;transform:translateY(-18px);transition:opacity 0.5s ease,transform 0.6s cubic-bezier(0.4,0,0.2,1)}
.ns-label{font-family:'EB Garamond',serif;font-style:italic;font-size:10px;letter-spacing:0.28em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:18px}
.ns-text{font-family:'EB Garamond',serif;font-size:clamp(15px,1.8vw,21px);line-height:1.95;color:var(--ink);max-width:660px;word-break:keep-all}
.ns-rule{width:0;height:0.5px;background:rgba(0,0,0,0.12);margin-top:22px;transition:width 1.1s cubic-bezier(0.16,1,0.3,1) 0.4s}
.narrative-zone.show .ns-rule{width:28px}
.grid-zone{position:absolute;inset:0;overflow-y:auto;padding:20px 7% 48px 20px;scrollbar-width:none;opacity:0;pointer-events:none;transition:opacity 0.5s ease}
.grid-zone::-webkit-scrollbar{display:none}
.grid-zone.open{opacity:1;pointer-events:all}
.tag-header{display:none;position:sticky;top:0;z-index:2;background:var(--white);margin:-20px -7% 24px -20px;padding:20px 7% 16px 20px;border-bottom:0.5px solid rgba(0,0,0,0.1)}
.tag-header.show{display:flex;align-items:baseline;flex-wrap:nowrap;gap:0}
.tag-header-name{font-family:'EB Garamond',serif;font-size:clamp(13px,1.2vw,16px);font-style:italic;letter-spacing:0.04em;color:var(--ink-mid);margin-bottom:0;flex-shrink:0}
.tag-header-desc{font-size:11px;letter-spacing:0.02em;line-height:1.85;color:var(--ink-mid);word-break:keep-all}
.tag-header-desc::before{content:" — ";color:var(--ink-mid);font-family:'EB Garamond',serif;font-style:italic}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
@media(max-width:1200px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
.grid.few-3{grid-template-columns:repeat(3,minmax(0,220px)) !important;justify-content:center;gap:10px}
.grid.few-2{grid-template-columns:repeat(2,minmax(0,300px)) !important;justify-content:center;gap:16px}
.grid.few-1{grid-template-columns:380px !important;justify-content:start;padding-top:36px;padding-left:28px}
.grid.few-1 .card{aspect-ratio:1/1 !important;box-shadow:0 24px 48px rgba(0,0,0,0.10),0 4px 12px rgba(0,0,0,0.06)}
.grid.few-1 .card.revealed{animation:cardFloat 8s ease-in-out 1s infinite}
@keyframes cardFloat{0%,100%{transform:translateY(0) rotate(0deg)}30%{transform:translateY(-14px) rotate(0.5deg)}65%{transform:translateY(7px) rotate(-0.3deg)}}
.card{position:relative;overflow:hidden;cursor:pointer;background:rgba(0,0,0,0.04);aspect-ratio:3/4;opacity:0;transform:translateY(6px);transition:opacity 0.35s ease,transform 0.4s cubic-bezier(0.16,1,0.3,1)}
.card.revealed{opacity:1;transform:translateY(0)}
.card img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;filter:blur(3px);transition:opacity 0.5s ease,filter 0.6s ease,transform 0.35s ease;position:absolute;inset:0}
.card img.loaded{opacity:1;filter:none}
.card:hover img{transform:scale(1.05)}
.card-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(26,26,24,0.8) 0%,rgba(26,26,24,0.1) 60%,transparent 80%);opacity:0;transition:opacity 0.22s ease;display:flex;flex-direction:column;justify-content:flex-end;padding:9px 10px}
.card:hover .card-overlay{opacity:1}
.card-title{font-family:'EB Garamond',serif;font-style:italic;font-size:14px;font-weight:500;color:#fff;line-height:1.3;margin-bottom:3px}
.card-year{font-size:13px;letter-spacing:0.1em;color:rgba(255,255,255,0.97);font-weight:600;margin-bottom:2px}
.card-meta{font-size:9.5px;letter-spacing:0.05em;color:rgba(255,255,255,0.85);text-transform:none;font-weight:400}
.card-dim{font-size:8.5px;letter-spacing:0.04em;color:rgba(255,255,255,0.75);margin-top:1px}
.card-skeleton{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,0.04) 25%,rgba(0,0,0,0.07) 50%,rgba(0,0,0,0.04) 75%);background-size:200% 100%;animation:cardShimmer 1.4s ease infinite}
@keyframes cardShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.card-video-wrap{position:absolute;inset:0;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden;pointer-events:none;}
.card.is-video{pointer-events:all;cursor:pointer;}
.card.video-hover .card-iframe-overlay{pointer-events:none;}
.card-play-icon{position:relative;z-index:2;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.18);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;transition:background 0.2s,transform 0.2s;pointer-events:none;}
.card-play-icon svg{width:12px;height:12px;fill:#fff;margin-left:2px;}
.card:hover .card-play-icon{background:rgba(255,255,255,0.32);transform:scale(1.1);}
.card-iframe-overlay{position:absolute;inset:0;z-index:3;opacity:0;pointer-events:none;transition:opacity 0.4s ease;}
.card-iframe-overlay iframe{width:100%;height:100%;border:none;pointer-events:none;}
.card.video-hover .card-iframe-overlay{opacity:1;pointer-events:all;}
.card.video-hover .card-iframe-overlay iframe{pointer-events:all;}
.card.video-hover .card-play-icon{opacity:0;}
.card-gif-img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;opacity:0;transition:opacity 0.5s ease;}
.card-gif-img.loaded{opacity:1;}
.modal-img-area iframe{width:100%;height:65vh;border:none;display:block;}
.bs-img-area iframe{width:100%;height:48vw;min-height:200px;border:none;display:block;}
.load-sentinel{grid-column:1/-1;height:1px}
.loading-msg{grid-column:1/-1;padding:40px;text-align:center;font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-dim)}
.modal-bg{position:fixed;inset:0;background:rgba(26,26,24,0.82);z-index:500;opacity:0;pointer-events:none;transition:opacity 0.3s ease;display:flex;align-items:center;justify-content:center;padding:5%}
.modal-bg.open{opacity:1;pointer-events:all}
.modal{background:var(--white);max-width:660px;width:100%;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;transform:translateY(16px) scale(0.976);transition:transform 0.34s cubic-bezier(0.16,1,0.3,1);position:relative;border-radius:2px}
.modal-bg.open .modal{transform:translateY(0) scale(1)}
.modal-img-area{width:100%;background:#f0efec;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0;max-height:65vh;flex-shrink:0}
.modal-img-area img{width:100%;height:100%;object-fit:contain;display:block;max-height:65vh;transition:opacity 0.3s ease}
.modal-panel{width:100%;padding:22px 28px 24px;display:flex;flex-direction:column;overflow-y:auto;text-align:center;align-items:center}
.modal-x{position:absolute;top:12px;right:14px;font-size:18px;line-height:1;color:rgba(26,26,24,0.4);cursor:pointer;background:none;border:none;font-family:serif;transition:color 0.15s;z-index:10}
.modal-x:hover{color:var(--ink)}
.m-title{font-family:'EB Garamond',serif;font-style:italic;font-size:18px;color:var(--ink);line-height:1.3;margin-bottom:6px}
.m-meta{font-size:12px;letter-spacing:0.05em;color:#3a3a38;margin-bottom:2px}
#mYear{font-size:12px;letter-spacing:0.08em;color:#3a3a38;font-weight:500}
.m-rule{width:20px;height:0.5px;background:rgba(0,0,0,0.12);margin:12px auto}
.m-desc{font-size:11px;line-height:1.9;color:var(--ink-mid);word-break:keep-all}
.m-tags{margin-top:14px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.m-tag{font-size:7.5px;letter-spacing:0.05em;padding:3px 8px;border-radius:20px;color:var(--ink-dim);border:0.5px solid rgba(0,0,0,0.1)}
.modal-arr{position:fixed;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.12);backdrop-filter:blur(6px);border:none;color:#fff;font-size:24px;width:44px;height:44px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.2s;font-family:serif}
.modal-arr:hover{background:rgba(255,255,255,0.25)}
.arr-prev{left:16px}
.arr-next{right:16px}
.mobile-hint{display:none}
@media(max-width:600px){
  html,body{overflow:auto;height:auto;min-height:100vh}
  .layout{position:static;margin-top:var(--nav-h);height:auto;display:block}
  .top-header{display:none}
  .body-row{display:block;height:auto;overflow:visible}
  .left-panel{width:100%;display:flex;flex-direction:column;padding:0 12px 8px;border-bottom:0.5px solid rgba(0,0,0,0.08);overflow:visible}
  .strip-row{display:none}
  .active-strip{display:none}
  .result-count{display:none}
  .cat-list-wrap{display:flex;flex-direction:column}
  .cat-cell{position:relative;border-bottom:0.5px solid rgba(0,0,0,0.07)}
  .cat-cell:last-child{border-bottom:none}
  .cat-header{padding:10px 2px;border:none;border-radius:0;background:transparent}
  .cat-title{font-size:11px;letter-spacing:0.06em}
  .cat-arrow{font-size:8px}
  .cat-list{position:static;box-shadow:none;border-radius:0;padding:0;background:transparent;max-height:0;overflow:hidden;display:block !important;transition:max-height 0.35s cubic-bezier(0.16,1,0.3,1)}
  .cat-cell.open .cat-list{max-height:600px;padding-bottom:8px}
  .sub-row{padding:5px 0 4px}
  .sub-name{font-size:11px}
  .tag-chip{font-size:10px;padding:4px 11px}
  .right-panel{position:static;width:100%;height:auto;overflow:visible}
  .float-zone{display:none !important}
  .pc-float-text{display:none}
  .m-selected-bar{display:none;padding:6px 12px 8px;border-bottom:0.5px solid rgba(0,0,0,0.06);background:var(--bg)}
  .m-selected-bar.show{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .m-sel-label{display:none}
  .m-sel-tag{font-family:'EB Garamond',serif;font-style:italic;font-size:12px;color:var(--ink-mid);background:rgba(0,0,0,0.04);border-radius:20px;padding:2px 10px;display:flex;align-items:center;gap:4px}
  .m-sel-x{font-size:11px;opacity:0.4;cursor:pointer;font-style:normal}
  .m-sel-x:hover{opacity:0.8}
  .mobile-hint{display:flex;flex-direction:column;align-items:center;padding:0;position:relative}
  .mobile-hint-marquee-wrap{display:none !important}
  .mobile-hint-marquee{display:none}
  .mobile-hint-static{display:none}
  .hint-img-wrap{position:relative;width:90vw;aspect-ratio:4/3;max-height:70vh;margin:6px auto 12px;display:block;overflow:hidden;animation:hintFloat 6s ease-in-out infinite;cursor:pointer;background:rgba(0,0,0,0.04)}
  .hint-img-wrap::after{content:none}
  .mobile-hint-img{width:100%;max-height:70vh;object-fit:contain;display:block;opacity:0;transition:opacity 0.6s ease}
  .mobile-hint-img.loaded{opacity:1}
  .hint-overlay-text{display:none}
  .hot-l1{text-align:left}
  .hot-l2{text-align:right}
  /* ★ PATCH 2: hint-tag-overlay 검은 배경 라인 제거 ★ */
  .hint-tag-overlay{position:absolute;bottom:0;left:0;right:0;padding:10px 16px 28px;background:none;pointer-events:none;z-index:3;display:flex;flex-direction:row;flex-wrap:wrap;gap:6px 10px;align-items:flex-end}

<script>

var subWorks=[];
var pinnedCard=-1;
var tagCycleTimers=[];

function getSubTags(row){
  if(!row)return[];
  var tags=[];
  CAT_KEYS.forEach(function(k){
    parseTags(row[catFieldName(k)]||row[k]||'').forEach(function(t){if(t)tags.push(t);});
  });
  return tags;
}

function buildTagWords(cardIdx){
  var row=subWorks[cardIdx];if(!row)return;
  var inner=sel('tagInner'+cardIdx);if(!inner)return;
  inner.innerHTML='';
  getSubTags(row).forEach(function(t){
    var w=document.createElement('div');w.className='tag-cycle-word';w.textContent=t;
    inner.appendChild(w);
  });
}

/* ★ PATCH 1: hover 시 모든 태그를 stagger로 왼쪽→오른쪽 슬라이드인 ★ */
function startTagCycles(){
  tagCycleTimers.forEach(function(t){clearInterval(t);clearTimeout(t);});
  tagCycleTimers=[];
  subWorks.forEach(function(row,cardIdx){buildTagWords(cardIdx);});
  /* 카드별로 mouseenter/mouseleave 이벤트로 태그 애니메이션 제어 */
  var cards=document.querySelectorAll('.sub-card');
  cards.forEach(function(card,cardIdx){
    card.addEventListener('mouseenter',function(){
      triggerTagSlideIn(cardIdx);
    });
    card.addEventListener('mouseleave',function(){
      if(pinnedCard!==cardIdx)resetTagWords(cardIdx);
    });
  });
}

function triggerTagSlideIn(cardIdx){
  var inner=sel('tagInner'+cardIdx);if(!inner)return;
  var words=Array.prototype.slice.call(inner.querySelectorAll('.tag-cycle-word'));
  words.forEach(function(w){w.classList.remove('lit');});
  words.forEach(function(w,wi){
    setTimeout(function(){w.classList.add('lit');},wi*160);
  });
}

function resetTagWords(cardIdx){
  var inner=sel('tagInner'+cardIdx);if(!inner)return;
  var words=inner.querySelectorAll('.tag-cycle-word');
  words.forEach(function(w){w.classList.remove('lit');});
}

function showSubTags(idx){pinCard(idx);}

function pinCard(idx){
  if(pinnedCard>=0&&pinnedCard!==idx){
    var prev=sel('tagCycle'+pinnedCard);if(prev)prev.classList.remove('pinned');
    resetTagWords(pinnedCard);
  }
  pinnedCard=idx;
  var tc=sel('tagCycle'+idx);if(tc)tc.classList.add('pinned');
  triggerTagSlideIn(idx);
}

var TAGS_THE=[],TAGS_SER=[],TAGS_MAT=[],TAGS_SEN=[];
var CAT_KEYS=['NAR','TEC','SEN'];
var CAT_LABELS={NAR:'Narratives',TEC:'Technique',SEN:'Sensory'};
var CAT_DATA={};
var catSel={};
var openDropdown=null;
var filtered=[],modalIdx=0,narrativeTimer=null,pendingTag=null;
var CHUNK_SIZE=24,renderedCount=0,chunkSentinel=null,chunkObserver=null;
var allWorks=[];
var isMobile=function(){return window.innerWidth<=600;};
function sel(id){return document.getElementById(id);}
function go(page){document.body.classList.add('fade-out');setTimeout(function(){window.location.href=page+'.html';},280);}
document.addEventListener('DOMContentLoaded',function(){document.body.classList.add('page-fade');setTimeout(function(){document.body.classList.remove('page-fade');},500);});
function parseTags(str){if(!str)return[];return String(str).split(/[,\n]/).map(function(t){return t.trim();}).filter(Boolean);}
function catFieldName(key){return CAT_DATA[key]?CAT_DATA[key].name:key;}
function allRowTags(row){var arr=[];CAT_KEYS.forEach(function(k){parseTags(row[catFieldName(k)]||row[k]||'').forEach(function(t){if(t)arr.push(t);});});return arr;}
function thumbUrl(row){return row['thumb']||'';}
function fullUrl(row){return row['full']||row['thumb']||'';}
function isVideoRow(r){return !!(r['isVideo']);}
function isGifRow(r){return !!(r['isGif']);}
function getEmbedUrl(r){var fid=r['fileId']||'';return fid?'https://drive.google.com/file/d/'+fid+'/preview':'';}
function getViewUrl(r){var fid=r['fileId']||'';return fid?'https://drive.google.com/uc?export=view&id='+fid:(r['full']||'');}
function loadSubImg(imgId, url) {
  if (!url) return;
  var img = sel(imgId);
  img.style.opacity = '0';
  img.style.transition = 'opacity 0.8s ease';
  
  // URL을 thumbnail 형식으로 변환
  var fileId = url.match(/id=([a-zA-Z0-9_-]{20,})/);
  if (fileId) {
    url = 'https://drive.google.com/thumbnail?id=' + fileId[1] + '&sz=w400';
  }
  
  var showImage = function() {
    img.style.opacity = '1';
  };
  
  img.onload = showImage;
  img.onerror = function() {
    var m = url.match(/id=([a-zA-Z0-9_-]{20,})/);
    if (m) {
      this.src = 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w400';
    }
    showImage();
  };
  
  img.src = url;
  setTimeout(showImage, 2000);
}
function buildCatPanels(){
  var wrap=sel('catListWrap');if(!wrap)return;
  wrap.innerHTML='';
  var shortTitle={NAR:'Narratives',TEC:'Technique',SEN:'Sensory'};
  CAT_KEYS.forEach(function(key){
    var cat=CAT_DATA[key];if(!cat)return;
    var cell=document.createElement('div');cell.className='cat-cell';cell.id='cell-'+key;
    var hdr=document.createElement('div');hdr.className='cat-header';
    hdr.innerHTML='<span class="cat-title">'+(shortTitle[key]||key)+'</span>'
      +'<span class="cat-badge" id="badge-'+key+'"></span>';
    var chipRow=document.createElement('div');chipRow.className='sub-chip-row';
    var dropdown=document.createElement('div');dropdown.className='sub-dropdown';dropdown.id='dropdown-'+key;
    (cat.subs||[]).forEach(function(sub,idx){
      var chip=document.createElement('span');chip.className='sub-chip';
      chip.id='chip-'+key+'-'+idx;
      chip.dataset.cat=key;chip.dataset.subIdx=idx;
      chip.textContent=sub.name;
      chip.addEventListener('click',function(){clickSubChip(key,idx);});
      chipRow.appendChild(chip);
    });
    cell.appendChild(hdr);cell.appendChild(chipRow);cell.appendChild(dropdown);
    wrap.appendChild(cell);
  });
}
function clickSubChip(cat,subIdx){
  if(openDropdown&&openDropdown.cat===cat&&openDropdown.subIdx===subIdx){
    closeAllDropdowns();return;
  }
  closeAllDropdowns();
  openDropdown={cat:cat,subIdx:subIdx};
  var chip=sel('chip-'+cat+'-'+subIdx);if(chip)chip.classList.add('open');
  var dd=sel('dropdown-'+cat);if(!dd)return;
  dd.innerHTML='';
  var sub=(CAT_DATA[cat]&&CAT_DATA[cat].subs||[])[subIdx];if(!sub)return;
  (sub.tags||[]).forEach(function(tag){
    var item=document.createElement('span');item.className='tag-item';
    item.dataset.cat=cat;item.dataset.tag=tag.kr;
    item.textContent=tag.kr;
    if(catSel[cat]===tag.kr)item.classList.add('checked');
    item.addEventListener('click',function(){toggleTagItem(cat,tag.kr,item);});
    dd.appendChild(item);
  });
  dd.classList.add('open');
}
function closeAllDropdowns(){
  if(openDropdown){
    var chip=sel('chip-'+openDropdown.cat+'-'+openDropdown.subIdx);
    if(chip)chip.classList.remove('open');
    var dd=sel('dropdown-'+openDropdown.cat);
    if(dd)dd.classList.remove('open');
    openDropdown=null;
  }
}
function updateSubChipSelState(cat){
  var subs=CAT_DATA[cat]&&CAT_DATA[cat].subs||[];
  subs.forEach(function(sub,idx){
    var chip=sel('chip-'+cat+'-'+idx);if(!chip)return;
    var hasSel=(sub.tags||[]).some(function(t){return catSel[cat]===t.kr;});
    chip.classList.toggle('has-sel',hasSel);
  });
}
function toggleTagItem(cat,tag,el){
  if(catSel[cat]===tag){delete catSel[cat];el.classList.remove('checked');}
  else{
    document.querySelectorAll('.tag-item.checked[data-cat="'+cat+'"]').forEach(function(e){e.classList.remove('checked');});
    catSel[cat]=tag;el.classList.add('checked');
  }
  closeAllDropdowns();
  updateSubChipSelState(cat);
  updateBadge(cat);showTagHeader();applyFilter();
}
function updateBadge(cat){
  var has=!!catSel[cat];

  setTimeout(function(){if(ov)ov.classList.add('active');},80);
  setTimeout(function(){window.location.href='year.html';},600);
}
window.addEventListener('wheel',function(e){
  if(_ctxLocked)return;
  if(e.deltaY>30)_goYear();
},{passive:true});
var _ctxTY=0;
window.addEventListener('touchstart',function(e){
  _ctxTY=e.touches[0].clientY;
},{passive:true});
window.addEventListener('touchend',function(e){
  if(_ctxLocked)return;
  if(_ctxTY-e.changedTouches[0].clientY>40)_goYear();
},{passive:true});
window.addEventListener('load',function(){
  var loader=document.getElementById('page-loader');
  if(loader){setTimeout(function(){loader.classList.add('hidden');setTimeout(function(){loader.style.display='none';},650);},400);}
});
</script>
