 <!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="조원정 작가의 평론 아카이브입니다.">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1a1a18;--ink-mid:#4a4a47;--ink-dim:#7a7a74;--bg:#f7f6f3;--white:#fff;--nav-h:50px;--lang-h:44px;--max-w:760px}
html{background:var(--bg);scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
body{background:var(--bg);font-family:'Cormorant Garamond',serif;color:var(--ink);min-height:100vh}

/* ── nav ── */
nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 36px;z-index:300;background:var(--bg);border-bottom:.5px solid rgba(26,26,24,.07)}
.nav-logo{font-weight:400;font-size:13px;letter-spacing:.3em;color:var(--ink);text-transform:uppercase;cursor:pointer;transition:opacity .2s}
.nav-logo:hover{opacity:.45}
.nav-right{display:flex;align-items:center}
.nav-item{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-dim);padding:5px 11px;cursor:pointer;text-decoration:none;transition:color .25s;white-space:nowrap;position:relative}
.nav-item::after{content:'';position:absolute;bottom:0;left:11px;right:11px;height:.5px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .28s cubic-bezier(.16,1,.3,1);opacity:.5}
.nav-item:hover{color:var(--ink)}
.nav-item:hover::after,.nav-item.active::after{transform:scaleX(1)}
.nav-item.active{color:var(--ink)}
.nav-sep{width:.5px;height:12px;background:rgba(0,0,0,.12);margin:0 5px;flex-shrink:0}
.nav-dd{position:relative;display:flex;align-items:center}
.nav-dd-menu{display:none;position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--white);border-radius:4px;padding:4px 0;min-width:80px;z-index:400;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.nav-dd-item{display:block;font-size:9px;letter-spacing:.08em;color:var(--ink-mid);padding:5px 14px;cursor:pointer;transition:color .15s,background .15s;white-space:nowrap;text-transform:uppercase}
.nav-dd-item:hover{color:var(--ink);background:rgba(0,0,0,.03)}

/* ── lang bar ── */
.lang-bar{position:fixed;top:var(--nav-h);left:0;right:0;height:var(--lang-h);display:flex;align-items:center;justify-content:flex-end;padding:0 36px;background:var(--bg);border-bottom:.5px solid rgba(26,26,24,.07);z-index:200}
.lang-toggle{display:flex;border:.5px solid rgba(26,26,24,.2);border-radius:2px;overflow:hidden}
.lang-btn{font-family:'Cormorant Garamond',serif;font-size:8px;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;cursor:pointer;background:transparent;color:var(--ink-dim);border:none;transition:background .15s,color .15s}
.lang-btn.active{background:rgba(26,26,24,.62);color:var(--bg)}
.lang-btn:not(.active):hover{color:var(--ink)}

/* ── 페이지 ── */
.page-wrap{max-width:var(--max-w);margin:0 auto;padding:calc(var(--nav-h) + var(--lang-h) + 48px) 48px 100px}

/* ── 평론 아이템 ── */
.critique-item{margin-bottom:64px;padding-bottom:64px;border-bottom:.5px solid rgba(26,26,24,.08)}
.critique-item:last-child{border-bottom:none}

/* 제목 행: 제목 왼쪽 + PDF 오른쪽 */
.critique-title-row{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:16px;margin-bottom:6px;
}
.critique-title{
  font-family:'EB Garamond',serif;font-size:20px;font-weight:400;
  color:var(--ink);line-height:1.4;
}
.critique-pdf{
  flex-shrink:0;
  font-size:8px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-dim);text-decoration:none;
  border:.3px solid rgba(74,74,71,.25);border-radius:2px;
  padding:2px 7px;transition:background .15s,color .15s;white-space:nowrap;
}
.critique-pdf:hover{background:rgba(74,74,71,.06);color:var(--ink-mid)}

.critique-meta {
  display: flex;
  justify-content: flex-end;  /* 오른쪽 정렬 */
  gap: 12px;
  font-size: 9px;
  letter-spacing: 0.12em;
  color: var(--ink-dim);
  text-transform: uppercase;
  margin-bottom: 20px;
}

/* 이미지 + 본문 감싸기 */
.critique-content {
  display: block;        /* grid → block */
}
.critique-content.no-img {
  display: block;
}

/* 이미지 오른쪽 float */
.critique-img {
  float: right;
  width: 260px;             /* 이미지 크기 조절 */
  margin: 4px 0 24px 36px; /* 위 / 오른쪽 / 아래 / 텍스트와 간격 */
  display: block;
  object-fit: cover;
}

/* float 해제 */
.critique-content::after {
  content: '';
  display: table;
  clear: both;
}

/* 본문 단락 */
.critique-body {
  font-family: 'EB Garamond', serif;
  font-size: 14px;
  line-height: 2.1;
  color: var(--ink-mid);
  text-align: justify;
  word-break: keep-all;
}
.critique-body p { margin-bottom: 1.4em; }
.critique-body p:last-child { margin-bottom: 0; }
.loading {
  padding: 80px 0;
  text-align: center;
  font-size: 9px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--ink-dim);
}

/* ── 모바일 ── */
@media(max-width:600px){
  :root{--lang-h:40px}
  nav{padding:0 16px}
  .lang-bar{padding:0 16px}
  .page-wrap{padding:calc(var(--nav-h) + var(--lang-h) + 32px) 20px 80px}
  .critique-title{font-size:17px}
  .critique-body{font-size:13px;line-height:1.9}
  .critique-item{margin-bottom:48px;padding-bottom:48px}
  .critique-content{grid-template-columns:1fr}
  .critique-img{margin-bottom:20px}
}
@media(max-width:480px){
  .nav-logo{font-size:10px;letter-spacing:.18em}
  .nav-item{font-size:8px;padding:5px 6px}
  .nav-sep{margin:0 1px}
}

/* 로딩 */
#page-loader{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;opacity:1;transition:opacity .6s cubic-bezier(.16,1,.3,1);pointer-events:all}
#page-loader.hidden{opacity:0;pointer-events:none}
.loader-inner{display:flex;flex-direction:column;align-items:center;gap:20px}
.loader-name{font-family:'EB Garamond',serif;font-style:italic;font-size:clamp(18px,3vw,28px);letter-spacing:.18em;color:var(--ink);opacity:0;animation:loaderFadeIn .8s ease .2s forwards}
.loader-line{width:0;height:.5px;background:var(--ink);opacity:.3;animation:loaderLine 1s cubic-bezier(.16,1,.3,1) .4s forwards}
@keyframes loaderFadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes loaderLine{from{width:0}to{width:clamp(80px,12vw,140px)}}
body.fade-out{opacity:0;transition:opacity .3s ease}
</style>
</head>
<body>
<div id="page-loader"><div class="loader-inner"><div class="loader-name">Won Jeong Cho</div><div class="loader-line"></div></div></div>

<nav>
  <span class="nav-logo" onclick="go('index')">Won Jeong Cho</span>
  <div class="nav-right">
    <div class="nav-dd" id="navArchive">
      <span class="nav-item">Archive</span>
      <div class="nav-dd-menu">
        <span class="nav-dd-item" onclick="go('year')" >Year</span>
        <span class="nav-dd-item" onclick="go('context')" >Context</span>
      </div>
    </div>
    <div class="nav-sep"></div>
    <div class="nav-dd">
      <span class="nav-item active">Text</span>
      <div class="nav-dd-menu">
        <span class="nav-dd-item" onclick="go('note')">Note</span>
        <span class="nav-dd-item" onclick="go('critique')">Critique</span>
      </div>
    </div>
    <div class="nav-sep"></div>
    <span class="nav-item" onclick="go('about')">About</span>
  </div>
</nav>

<div class="lang-bar">
  <div class="lang-toggle">
    <button class="lang-btn active" id="btnKo" onclick="setLang('ko')">한국어</button>
    <button class="lang-btn" id="btnEn" onclick="setLang('en')">English</button>
  </div>
</div>

<div class="page-wrap">
  <div id="critiqueList"><div class="loading">Loading…</div></div>
</div>

<script>
var DATA=[], lang='ko';

function go(p){document.body.classList.add('fade-out');setTimeout(function(){window.location.href=p+'.html';},280);}
function sel(id){return document.getElementById(id);}

document.querySelectorAll('.nav-dd').forEach(function(dd){
  var menu=dd.querySelector('.nav-dd-menu'),timer;
  dd.addEventListener('mouseenter',function(){clearTimeout(timer);menu.style.display='block';});
  dd.addEventListener('mouseleave',function(){timer=setTimeout(function(){menu.style.display='none';},150);});
  menu.addEventListener('mouseenter',function(){clearTimeout(timer);});
  menu.addEventListener('mouseleave',function(){timer=setTimeout(function(){menu.style.display='none';},150);});
  dd.querySelector('.nav-item').addEventListener('click',function(e){
    e.stopPropagation();
    var isOpen=menu.style.display==='block';
    document.querySelectorAll('.nav-dd-menu').forEach(function(m){m.style.display='none';});
    if(!isOpen)menu.style.display='block';
  });
});
document.addEventListener('click',function(e){
  if(!e.target.closest||!e.target.closest('.nav-dd'))
    document.querySelectorAll('.nav-dd-menu').forEach(function(m){m.style.display='none';});
});

function setLang(l){
  if(lang===l)return;
  lang=l;
  sel('btnKo').classList.toggle('active',l==='ko');
  sel('btnEn').classList.toggle('active',l==='en');
  renderCritiques();
}

function driveThumb(url,sz){
  if(!url)return'';
  var m=url.match(/\/d\/([a-zA-Z0-9_-]{10,})/);
  return m?'https://drive.google.com/thumbnail?id='+m[1]+'&sz='+(sz||'w800'):url;
}

function renderCritiques(){
  var ko=(lang==='ko');
  var list=sel('critiqueList');
  if(!DATA.length){list.innerHTML='<div class="loading">—</div>';return;}
  list.innerHTML=DATA.map(function(row){
    var title=ko?(row.title||row.filename||''):(row.title||row.filename||'');
    var desc=ko?(row.desc_ko||row.desc||''):(row.desc_en||row.desc||'');
    var paras=desc.split(/\n\n+/).filter(function(p){return p.trim();});
    if(paras.length<=1) paras=desc.split(/\n/).filter(function(p){return p.trim();});
    var bodyHtml=paras.map(function(p){return'<p>'+p.trim()+'</p>';}).join('');
    var imgHtml=row.img?'<img class="critique-img" src="'+driveThumb(row.img,'w800')+'" alt="'+title+'">':'';
    var pdfHtml=row.link?'<a class="critique-pdf" href="'+row.link+'" target="_blank">PDF ↗</a>':'';
    var hasImg=!!row.img;
    return '<div class="critique-item">'
      +'<div class="critique-title-row">'
        +'<div class="critique-title">'+title+'</div>'
        +pdfHtml
      +'</div>'
     +'<div class="critique-content"+(hasImg?'':' no-img')+">'
  +(hasImg?'<div>'+imgHtml+'</div>':'')
  +'<div class="critique-body">'+bodyHtml
    // ↓ critique-body 닫기 전에 meta 삽입
    +'<div class="critique-meta">'
      +(row.year?'<span>'+row.year+'</span>':'')
      +(row.category?'<span class="meta-sep">·</span><span>'+row.category+'</span>':'')
      +(row.place?'<span class="meta-sep">·</span><span>'+row.place+'</span>':'')
    +'</div>'
   +'</div>'
  +'</div>'
 +'</div>'
+'</div>';
  }).join('');
}

fetch('./data/text.json?v='+Date.now(),{cache:'no-store'})
  .then(function(r){return r.json();})
  .then(function(result){
    var d=result.data||{};
    DATA=d['평론']||[];
    renderCritiques();
  })
  .catch(function(){sel('critiqueList').innerHTML='<div class="loading">데이터를 불러올 수 없습니다.</div>';});

window.addEventListener('load',function(){
  var loader=document.getElementById('page-loader');
  if(loader){setTimeout(function(){loader.classList.add('hidden');setTimeout(function(){loader.style.display='none';},650);},400);}
});
</script>
</body>
</html>
